# Job lifecycle with one failure and a retry. Scaffold with:
#   python3 scripts/scaffold_from_spec.py examples/specs/job-states.yaml -o anim/job-states/job-states.html
name: job-states
archetype: states
size: [1200, 600]
control: loop
cycle: 12
nodes:
  - { id: queued,  label: Queued }
  - { id: running, label: Running,   sub: "worker 3" }
  - { id: done,    label: Succeeded, kind: milestone }
  - { id: failed,  label: Failed }
edges:
  - { from: queued,  to: running, label: picked }
  - { from: running, to: done,    label: exit 0 }
  - { from: running, to: failed,  label: error, kind: event }
  - { from: failed,  to: queued,  label: retry, kind: event }
phases:
  - { t: 0,   label: queued,  active: [queued],  note: "A job waits in the queue" }
  - { t: 1.5, label: pick,    active: [running], flow: ["queued>running"], note: "A worker picks it up" }
  - { t: 3.5, label: fail,    active: [failed],  flow: ["running>failed"], note: "The first attempt fails" }
  - { t: 5.5, label: retry,   active: [queued],  flow: ["failed>queued"],  note: "Retry with backoff" }
  - { t: 7.5, label: success, active: [done],    flow: ["running>done"],   note: "The second attempt succeeds" }
  - { t: 10,  label: hold,    active: [done] }
