# Service dependency graph with two groups. Scaffold with:
#   python3 scripts/scaffold_from_spec.py examples/specs/dependency-graph.yaml -o anim/service-deps/service-deps.html
name: service-deps
archetype: graph
size: [1680, 600]
control: loop
cycle: 13
nodes:
  - { id: web,       label: Web app,       kind: process,  group: edge }
  - { id: gateway,   label: API gateway,   kind: process,  group: edge }
  - { id: orders,    label: Orders,        kind: process,  group: core }
  - { id: payments,  label: Payments,      kind: process,  group: core }
  - { id: inventory, label: Inventory,     kind: process,  group: core }
  - { id: db,        label: Orders DB,     kind: store,    group: core }
  - { id: psp,       label: Payment provider, kind: external }
  - { id: queue,     label: Event bus,     kind: data }
edges:
  - { from: web,      to: gateway,   kind: depends }
  - { from: gateway,  to: orders,    kind: depends }
  - { from: gateway,  to: payments,  kind: depends }
  - { from: orders,   to: inventory, kind: depends }
  - { from: orders,   to: db,        kind: depends }
  - { from: payments, to: psp,       kind: depends, label: "HTTPS" }
  - { from: orders,   to: queue,     kind: event,   label: "order.placed" }
  - { from: inventory, to: queue,    kind: event }
groups:
  - { id: edge, label: Edge }
  - { id: core, label: Core services }
phases:
  - { t: 0,   label: setup,     show: [web, gateway, edge],              note: "Requests enter through the gateway" }
  - { t: 1.5, label: core,      show: [orders, payments, inventory, core], active: [gateway], note: "Core services behind the gateway" }
  - { t: 3,   label: storage,   show: [db],      active: [orders],      note: "Orders owns its database" }
  - { t: 4.5, label: external,  show: [psp],     active: [payments],    note: "Payments depends on an external provider" }
  - { t: 6,   label: events,    show: [queue],   active: [queue],       note: "Orders and Inventory publish events" }
  - { t: 7.5, label: trace,     active: [web],   flow: ["web>gateway", "gateway>orders", "orders>db"], note: "One request: web, gateway, orders, database" }
  - { t: 9.5, label: blast,     active: [psp, payments], note: "If the provider is down, only Payments is affected" }
  - { t: 11.5, label: hold }
