# A metric with a spike and recovery; the trace draws on in step with the cycle. Scaffold with:
#   python3 scripts/scaffold_from_spec.py examples/specs/load-chart.yaml -o anim/load-spike/load-spike.html
name: load-spike
archetype: chart
title: "Load during a fault"
size: [1680, 600]
control: loop
cycle: 12
series:
  - { id: load,  label: Load,  points: [[0, 52], [1, 54], [2, 55], [3, 58], [4, 90], [5, 96], [6, 70], [7, 61], [8, 57], [9, 55], [10, 54]] }
  - { id: limit, label: Limit, points: [[0, 85], [10, 85]] }
events:
  - { at: 4, label: Fault }
  - { at: 6, label: Recovered }
phases:
  - { t: 0,  label: setup,   note: "Normal load" }
  - { t: 4,  label: fault,   note: "A fault pushes load past the limit" }
  - { t: 7,  label: recover, note: "Back to normal within minutes" }
  - { t: 10, label: hold }
