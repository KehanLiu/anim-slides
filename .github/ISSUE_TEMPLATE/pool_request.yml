name: Pool request
description: Ask for an animation pattern the pool does not cover yet.
labels: [pool]
body:
  - type: markdown
    attributes:
      value: |
        The pool holds domain-neutral examples, organised by motion verb: at least one per
        verb, across many fields. Check the [gallery](https://kehanliu.github.io/anim-slides/)
        and [references/motion-verbs.md](https://github.com/KehanLiu/anim-slides/blob/main/references/motion-verbs.md) first.
  - type: textarea
    id: story
    attributes:
      label: The story
      description: What the animation should show, in two or three sentences, as it would play on a slide.
      placeholder: A river carries sediment to the coast, it settles where the current slows, and a delta grows out into the sea layer by layer.
    validations:
      required: true
  - type: dropdown
    id: verb
    attributes:
      label: Motion verb
      description: The one motion that carries the claim (see references/motion-verbs.md).
      options: [grow, count, accumulate, thin, race, split, merge, sort, stack, nest, transform, wipe, switch, balance, drive, zoom, open, travel, trace, cycle, reveal, not sure]
    validations:
      required: true
  - type: dropdown
    id: archetype
    attributes:
      label: Closest archetype
      options: [pipeline, graph, timeline, states, compare, layers, chart, not sure / new]
    validations:
      required: true
  - type: input
    id: domain
    attributes:
      label: Domain
      placeholder: biology, finance, civics, earth science, education, ...
  - type: textarea
    id: technique
    attributes:
      label: Motion or technique you are after
      description: A specific effect (a bar race, a column filling, a cutaway opening, a counter ticking), with links to examples if you have them.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to build this entry myself (see CONTRIBUTING.md)
