<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How a package gets delivered</title>
<style>
  html, body { margin: 0; height: 100%; background: #e9e9e6; }
  body { display: grid; place-items: center; font-family: "Helvetica Neue", Arial, system-ui, sans-serif; }
  .slide { box-sizing: border-box; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; background: #f9f9f7;
           color: #1b1f24; padding: 5.2% 5.4%; position: relative; container-type: inline-size; overflow: hidden; }
  h1 { margin: 0; font-size: 3.4cqw; color: #1d2b4a; }
  h1::after { content: ""; display: block; width: 10cqw; height: 0.35cqw; background: #1d2b4a; margin-top: 0.9cqw; }
  footer { position: absolute; left: 5.4%; right: 5.4%; bottom: 4.5%; display: flex; justify-content: space-between;
           font-size: 1.05cqw; color: #8a8f96; }

  /* tracking status + controls */
  .top { position: absolute; top: 5.2%; right: 5.4%; display: flex; align-items: center; gap: 1cqw; }
  .status { font-size: 1.2cqw; color: #5b6470; display: flex; align-items: center; gap: .7cqw; }
  .pill { font-weight: 700; color: #fff; background: #1d2b4a; padding: .45cqw 1.1cqw; border-radius: 2cqw;
          transition: background .4s; white-space: nowrap; }
  .pill.done { background: #2f8a57; }
  .ctrl { display: flex; gap: .4cqw; margin-left: 1cqw; }
  .ctrl button { font: inherit; font-size: 1.1cqw; border: 1px solid #c9ccd1; background: #fff; color: #1d2b4a;
                 border-radius: .5cqw; padding: .3cqw .8cqw; cursor: pointer; }
  .ctrl button:hover { background: #eef0f4; }

  svg.diagram { position: absolute; left: 5.4%; right: 5.4%; top: 17%; width: 89.2%; height: auto; overflow: visible; }

  /* SVG styling */
  .road { stroke: #d5d8dd; stroke-width: 6; stroke-linecap: round; fill: none; }
  .progress { stroke: #d9822b; stroke-width: 6; stroke-linecap: round; fill: none;
              stroke-dasharray: 800; stroke-dashoffset: 800; transition: stroke-dashoffset 1.1s ease-in-out; }
  .node circle.bg { fill: #fff; stroke: #c9ccd1; stroke-width: 3; transition: stroke .4s, fill .4s; }
  .node .ic { fill: none; stroke: #9aa1ab; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; transition: stroke .4s; }
  .node .num { font-size: 12px; font-weight: 700; fill: #9aa1ab; text-anchor: middle; transition: fill .4s; }
  .node.past circle.bg { stroke: #1d2b4a; }
  .node.past .ic { stroke: #1d2b4a; }
  .node.past .num { fill: #1d2b4a; }
  .node.now circle.bg { stroke: #d9822b; fill: #fff6ec; stroke-width: 4; }
  .node.now .ic { stroke: #d9822b; }
  .node.now .num { fill: #d9822b; }
  .node.now .ring { opacity: 1; animation: pulse 1.6s ease-out infinite; }
  .ring { fill: none; stroke: #d9822b; stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { from { transform: scale(1); opacity: .7; } to { transform: scale(1.45); opacity: 0; } }

  .cap { opacity: .28; transition: opacity .5s; }
  .cap.past, .cap.now { opacity: 1; }
  .cap .t { font-size: 15px; font-weight: 700; fill: #1d2b4a; text-anchor: middle; }
  .cap .d { font-size: 12.5px; fill: #3a414b; text-anchor: middle; }
  .cap.now .t { fill: #c06a17; }

  .parcel { transition: transform 1.1s ease-in-out; }
  .parcel .box { fill: #c99a5e; stroke: #8a6436; stroke-width: 1.5; }
  .parcel .tape { stroke: #8a6436; stroke-width: 1.5; }
  .parcel .lbl { fill: #fff; }
  .hop { animation: hop 1.1s ease-in-out; }
  @keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }

  .fx { opacity: 0; transition: opacity .5s, transform .6s; }
  .fx.on { opacity: 1; }
  .chip rect { fill: #fff; stroke: #d9822b; stroke-width: 1.5; }
  .chip text { font-size: 12px; font-weight: 700; fill: #c06a17; text-anchor: middle; }
  .ink { fill: none; stroke: #1d2b4a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .draw { stroke-dasharray: 200; stroke-dashoffset: 200; transition: stroke-dashoffset 1.2s ease-out .2s; }
  .on .draw, .draw.on { stroke-dashoffset: 0; }
  .beam { stroke: #e53b3b; stroke-width: 2; opacity: 0; }
  .on .beam { animation: scan 1s ease-in-out .3s 2; }
  @keyframes scan { 0% { opacity: 0; transform: translateY(-14px); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateY(14px); } }
  .stop { fill: #1d2b4a; opacity: 0; transition: opacity .25s; }
  .on .stop { opacity: .8; }
  .stop.next { fill: #d9822b; opacity: 1; }
  .fan path { stroke: #1d2b4a; stroke-width: 2; fill: none; stroke-dasharray: 90; stroke-dashoffset: 90; transition: stroke-dashoffset .7s ease-out; }
  .fan.on path { stroke-dashoffset: 0; }
  .fan.on path.pick { stroke: #d9822b; stroke-width: 3; }
  .truck rect { fill: #fff; stroke: #1d2b4a; stroke-width: 1.6; }

  .lead { opacity: 0; transition: opacity .5s; }
  .lead.on { opacity: 1; }
  .lead .bar { stroke: #1d2b4a; stroke-width: 2.5; fill: none; stroke-dasharray: 820; stroke-dashoffset: 820; transition: stroke-dashoffset 1.6s ease-in-out; }
  .lead.on .bar { stroke-dashoffset: 0; }
  .lead .big { font-size: 22px; font-weight: 700; fill: #1d2b4a; text-anchor: middle; }
  .lead .sm { font-size: 13px; fill: #5b6470; text-anchor: middle; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<section class="slide" aria-label="Animated diagram: how a package gets delivered">
  <h1>How a package gets delivered</h1>

  <div class="top">
    <div class="status">Tracking status <span class="pill" id="pill" aria-live="polite">—</span></div>
    <div class="ctrl">
      <button id="bPrev" title="Previous step (←)">◀</button>
      <button id="bPlay" title="Play / pause (Space)">❚❚</button>
      <button id="bNext" title="Next step (→)">▶</button>
      <button id="bReplay" title="Replay (R)">↺</button>
    </div>
  </div>

  <svg class="diagram" viewBox="0 0 1000 420" role="img"
       aria-label="Five stages: order placed, picked at the warehouse, sorted at the regional hub, out for delivery, delivered. About 28 hours from order to doorstep.">
    <!-- road -->
    <line class="road" x1="100" y1="170" x2="900" y2="170"/>
    <line class="progress" id="prog" x1="100" y1="170" x2="900" y2="170"/>

    <!-- stage effects (behind/above nodes) -->
    <!-- 1: confirmation e-mail with tracking number -->
    <g class="fx" id="fx1">
      <g transform="translate(150,40)">
        <rect x="0" y="0" width="44" height="30" rx="3" fill="#fff" stroke="#1d2b4a" stroke-width="1.8"/>
        <path class="ink" d="M1 1 L22 17 L43 1"/>
      </g>
      <g class="chip" transform="translate(255,55)">
        <rect x="-52" y="-13" width="104" height="26" rx="13"/>
        <text y="4">Tracking # sent</text>
      </g>
      <path class="ink draw" d="M128 118 Q132 80 150 70" />
    </g>

    <!-- 2: aisle 14, scan out -->
    <g class="fx" id="fx2">
      <g class="chip" transform="translate(300,50)">
        <rect x="-38" y="-13" width="76" height="26" rx="13"/>
        <text y="4">Aisle 14</text>
      </g>
      <line class="beam" x1="280" y1="100" x2="320" y2="100"/>
      <text x="368" y="104" font-size="11.5" fill="#5b6470">pack · label · scan</text>
    </g>

    <!-- 3: routed onto trucks by postcode -->
    <g class="fx fan" id="fx3">
      <path d="M530 140 Q560 70 600 50"/>
      <path class="pick" d="M535 150 Q570 100 610 92"/>
      <path d="M540 160 Q575 130 615 134"/>
      <g class="truck"><rect x="604" y="40" width="34" height="20" rx="3"/></g>
      <g class="truck"><rect x="614" y="82" width="34" height="20" rx="3" style="stroke:#d9822b;stroke-width:2.4"/></g>
      <g class="truck"><rect x="619" y="124" width="34" height="20" rx="3"/></g>
      <g class="chip" transform="translate(500,40)">
        <rect x="-50" y="-13" width="100" height="26" rx="13"/>
        <text y="4">by postcode</text>
      </g>
    </g>

    <!-- 4: ~30 other stops -->
    <g class="fx" id="fx4">
      <g id="stops"></g>
      <text x="800" y="28" font-size="12.5" font-weight="700" fill="#1d2b4a" text-anchor="middle">+ about 30 other stops</text>
    </g>

    <!-- 5: signature -->
    <g class="fx" id="fx5">
      <rect x="905" y="40" width="88" height="54" rx="5" fill="#fff" stroke="#1d2b4a" stroke-width="1.6"/>
      <path class="ink draw" d="M915 78 q8 -22 14 -4 q5 14 12 -6 q6 -14 10 2 q4 10 10 -2 q4 -6 12 0"/>
      <line x1="913" y1="84" x2="985" y2="84" stroke="#9aa1ab" stroke-width="1"/>
      <text x="949" y="54" font-size="10" fill="#5b6470" text-anchor="middle">signature</text>
    </g>

    <!-- nodes -->
    <g id="nodes"></g>

    <!-- parcel -->
    <g class="parcel" id="parcel" transform="translate(100,0)">
      <g id="hop">
        <g transform="translate(-16,92)">
          <rect class="box" width="32" height="26" rx="2"/>
          <line class="tape" x1="16" y1="0" x2="16" y2="26"/>
          <rect class="lbl" x="19" y="15" width="10" height="7"/>
        </g>
      </g>
    </g>

    <!-- captions -->
    <g id="caps"></g>

    <!-- lead time -->
    <g class="lead" id="lead">
      <path class="bar" d="M100 330 V342 H900 V330"/>
      <text class="big" x="500" y="378">≈ 28 hours</text>
      <text class="sm" x="500" y="400">typical lead time, from order to doorstep</text>
    </g>
  </svg>

  <footer><span>Logistics 101 · Operations onboarding</span><span>4</span></footer>
</section>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const X = [100, 300, 500, 700, 900];
  const stages = [
    { t: "Order placed", d: ["Customer checks out online;", "confirmation e-mail with", "a tracking number"],
      ic: '<rect x="-14" y="-12" width="28" height="19" rx="2"/><path d="M-6 13 h12 M0 7 v6"/><path d="M-6 -3 l4 4 l8 -8"/>' },
    { t: "Picked at the warehouse", d: ["Item located (aisle 14),", "packed, labelled", "and scanned out"],
      ic: '<path d="M-16 14 V-6 L0 -15 L16 -6 V14"/><path d="M-9 14 V2 H9 V14 M-9 8 H9"/>' },
    { t: "Sorted at regional hub", d: ["Parcels scanned and", "routed onto trucks", "by postcode"],
      ic: '<path d="M-14 0 H2 M2 0 L12 -10 M2 0 L12 10 M2 0 H14"/><path d="M9 -13 l3 3 l-3 3 M11 0 l3 0 M9 13 l3 -3 l-3 -3"/>' },
    { t: "Out for delivery", d: ["Loaded onto a local van", "with about 30", "other stops"],
      ic: '<path d="M-16 8 V-8 H4 V8 Z M4 -3 H11 L16 3 V8 H4"/><circle cx="-9" cy="10" r="3"/><circle cx="10" cy="10" r="3"/>' },
    { t: "Delivered", d: ["Handed over, signature", "collected, status", "changes to “Delivered”"],
      ic: '<path d="M-15 0 L0 -13 L15 0 M-11 -3 V14 H11 V-3"/><path d="M-5 5 l4 4 l7 -8"/>' },
  ];
  const pillText = ["Waiting for order", "Order placed", "Picked at the warehouse", "Sorted at regional hub",
                    "Out for delivery", "Delivered", "Delivered"];

  const el = (tag, attrs, html) => { const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]); if (html) e.innerHTML = html; return e; };

  const nodesG = document.getElementById("nodes"), capsG = document.getElementById("caps");
  const nodes = [], caps = [];
  stages.forEach((s, i) => {
    const g = el("g", { class: "node", transform: `translate(${X[i]},170)` });
    g.append(el("circle", { class: "ring", r: 42 }), el("circle", { class: "bg", r: 42 }),
             el("g", { class: "ic" }, s.ic), el("text", { class: "num", y: 33 }, String(i + 1)));
    nodesG.append(g); nodes.push(g);
    const c = el("g", { class: "cap" });
    c.append(el("text", { class: "t", x: X[i], y: 245 }, s.t));
    s.d.forEach((line, j) => c.append(el("text", { class: "d", x: X[i], y: 268 + j * 17 }, line)));
    capsG.append(c); caps.push(c);
  });

  // 30 other stops: dots on an arc above the van stage
  const stopsG = document.getElementById("stops"), stopEls = [];
  for (let i = 0; i < 30; i++) {
    const a = Math.PI * (1.08 + 0.84 * i / 29);
    const s = el("circle", { class: "stop", r: 4.2, cx: (800 + 150 * Math.cos(a)).toFixed(1), cy: (150 + 110 * Math.sin(a)).toFixed(1) });
    s.style.transitionDelay = (0.4 + i * 0.04) + "s";
    stopsG.append(s); stopEls.push(s);
  }

  const fx = [1, 2, 3, 4, 5].map(n => document.getElementById("fx" + n));
  const parcel = document.getElementById("parcel"), hop = document.getElementById("hop");
  const prog = document.getElementById("prog"), lead = document.getElementById("lead"), pill = document.getElementById("pill");
  const LAST = 6; // 0 = empty, 1..5 = stages, 6 = lead time
  let step = 0, playing = true, timer = null;

  function render(prev) {
    const cur = Math.min(step, 5); // active stage
    nodes.forEach((n, i) => { n.classList.toggle("past", i < cur - 1 || step === 6);
                              n.classList.toggle("now", i === cur - 1 && step < 6); });
    caps.forEach((c, i) => { c.classList.toggle("past", i < cur - 1 || step === 6);
                             c.classList.toggle("now", i === cur - 1 && step < 6); });
    fx.forEach((f, i) => f.classList.toggle("on", i === cur - 1 && step < 6 || (i === 4 && step === 6)));
    const idx = Math.max(cur - 1, 0);
    parcel.setAttribute("transform", `translate(${X[idx]},0)`);
    parcel.style.transform = `translate(${X[idx]}px,0)`;
    if (prev !== undefined && Math.max(Math.min(prev, 5) - 1, 0) !== idx) {
      hop.classList.remove("hop"); void hop.getBBox(); hop.classList.add("hop");
    }
    parcel.style.opacity = step === 0 ? 0 : 1;
    prog.style.strokeDashoffset = 800 - (idx / 4) * 800;
    lead.classList.toggle("on", step === 6);
    pill.textContent = step >= 5 ? "“Delivered”" : pillText[step];
    pill.classList.toggle("done", step >= 5);
  }

  const DUR = [700, 3200, 3400, 3400, 3800, 3400, 6000];
  function schedule() {
    clearTimeout(timer);
    if (!playing) return;
    timer = setTimeout(() => { if (step < LAST) go(step + 1); else go(0); }, DUR[step]);
  }
  function go(n) { const p = step; step = Math.max(0, Math.min(LAST, n)); render(p); schedule(); }
  function setPlay(p) { playing = p; document.getElementById("bPlay").textContent = p ? "❚❚" : "⏵"; schedule(); }

  document.getElementById("bPrev").onclick = () => { setPlay(false); go(step - 1); };
  document.getElementById("bNext").onclick = () => { setPlay(false); go(step + 1); };
  document.getElementById("bPlay").onclick = () => setPlay(!playing);
  document.getElementById("bReplay").onclick = () => { setPlay(true); go(0); };
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { setPlay(false); go(step + 1); }
    else if (e.key === "ArrowLeft") { setPlay(false); go(step - 1); }
    else if (e.key === " ") { e.preventDefault(); setPlay(!playing); }
    else if (e.key.toLowerCase() === "r") { setPlay(true); go(0); }
  });

  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { playing = false; step = LAST; render(); setPlay(false); }
  else if (/^#\d$/.test(location.hash)) { step = +location.hash[1]; render(); setPlay(false); }
  else { render(); schedule(); }
})();
</script>
</body>
</html>
