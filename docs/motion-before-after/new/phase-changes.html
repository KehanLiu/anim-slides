<!-- phase-changes (pool, verb switch, archetype states drawn as one sealed container of particles, domain chemistry). Hand-built; lean style, references/style.md.
  Story: the same particles, arranged differently. One sample of 18 particles sits in one container
  for the whole pass and makes the full round trip. Energy in (the stroke at the left rises, absorbing
  colour): the solid lattice loosens into a liquid of two loose, irregular rows across the container
  floor (melting), then spreads to fill the container (vaporization). Energy out (the stroke takes the
  releasing colour and falls): the gas gathers back into the liquid (condensation), then locks into the
  lattice (freezing). The state scale at the right keeps the record: a small thumbnail of each
  arrangement appears when that state is first reached and stays; between them two thin arrows, up
  (absorbs) and down (releases), appear with their change's name as it happens. Sublimation and
  deposition, the direct jumps, are one quiet line under the container. The live container rests on
  the solid; the resting frame shows the whole story on the scale.
  Verb: switch (a change of state in place, caused by energy in and out). Object constancy: the same
  18 circles all pass; nothing is swapped or cross-faded.
  Technique: one translate track per particle (lattice -> liquid -> gas -> liquid -> lattice; the base
  rule is the lattice position). The particles' parent group carries data-anim-series: each change is
  one collective staggered series (30 ms apart, moves of 0.7/0.7/0.7/0.7 s).
  Targets and orders were chosen by simulating the eased paths so that no two particles come closer
  than 40 px between centres (diameter 36 + stroke) at any moment: no overlap mid-move.
  Energy stroke: draw-on (pathLength 100): 50 at melting, 0 at vaporization, back to 50 and to 101.
  Once pass 10 s: scene 0-0.4 s | four changes, each 2 s: energy step 0.4 s, particle series, the
  scale records it (starts 0.45, 2.45, 4.45, 6.45 s) | final caption and the direct-jump line
  8.39-8.74 s | hold to 10 s. Phases 0.42,2.41,4.41,6.41,9.06.
  Facts:
  - Solid, liquid, gas and their sub-labels ("ordered, fixed in place", "close, slide past each
    other", "far apart, move freely"): from the entry (spec.yaml), textbook.
  - Six named changes and their energy: melting, vaporization, sublimation absorb energy; freezing,
    condensation, deposition release it (textbook; spec.yaml). Shortened to "absorbs" / "releases"
    beside each name, as the review asked; "energy in" / "energy out" at the stroke carry "energy".
  - "water at 1 atm: melts at 0 °C, boils at 100 °C": stated facts from the entry, verbatim, one note.
  - Particle drawing, the count of 18, their positions and the thumbnails: schematic, not data. The
    liquid lies close and loose along the container floor; the gas fills the container (textbook
    qualitative facts). The energy stroke has no scale: half its length at melting is drawing position
    only, not a ratio of energies.
  - Captions: the entry's own phase notes; the sublimation and deposition notes are not played. -->
