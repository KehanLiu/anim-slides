<body><section class="visible">
<!-- phase-changes (pool, verb switch, archetype states drawn as one sealed container of particles, domain chemistry). Hand-built; lean style, references/style.md.
  Story: the same particles, arranged differently. One sample of 18 particles sits in one container
  for the whole pass and makes the full round trip. Energy in (the stroke at the left rises, absorbing
  colour): the solid lattice loosens into a liquid along the container floor (melting), then spreads
  to fill the container (vaporization). Energy out (the stroke takes the releasing colour and falls):
  the gas gathers back into the liquid (condensation), then locks into the lattice (freezing). Each
  change lights its name and its absorbs/releases wording as it happens; a state scale at the right
  lights the current state. Sublimation and deposition, the direct jumps, are a quiet legend line that
  lights at the end. The pass rests on the solid, with all six changes named.
  Verb: switch (a change of state in place, caused by energy in and out). Object constancy: the same
  18 circles all pass; nothing is swapped or cross-faded.
  Technique: one translate track per particle (lattice -> liquid -> gas -> liquid -> lattice; the base
  rule is the lattice position, so the still is the solid). The particles' parent group carries
  data-anim-series: each change is one collective staggered series (40 ms apart, moves of
  0.55/0.6/0.6/0.55 s, each burst 1.28 s or less). Targets are assigned to
  minimise the summed path length, so no two straight paths cross. Energy stroke: draw-on
  (pathLength 100): 50 at melting, 0 at vaporization, back to 50 and to 101 as energy is removed.
  Lit states, lit labels and captions cross-fade stacked copies.
  Once pass 10 s: set 0-0.6 s | four changes, each 2 s: energy step 0.4 s, particle series, state and
  label lit (starts 0.65, 2.65, 4.65, 6.65 s) | final caption and legend 8.67-9.02 s | hold to 10 s.
  Phases 0.62,2.63,4.68,6.68,9.02.
  Facts:
  - Solid, liquid, gas and their sub-labels ("ordered, fixed in place", "close, slide past each
    other", "far apart, move freely"): from the entry (pool/phase-changes/spec.yaml), textbook.
  - Six named changes and their energy: melting, vaporization, sublimation absorb energy; freezing,
    condensation, deposition release it (textbook; spec.yaml). Wording kept from the entry.
  - "water at 1 atm: melts at 0 °C, boils at 100 °C": stated facts from the entry, kept verbatim as
    the top-right note; "melts at 0 °C" and "boils at 100 °C" also sit under their pair of changes
    (the same words, split at the comma).
  - "energy in" / "energy out": the direction words of the absorbs/releases statements.
  - Particle drawing, the count of 18 and their positions: schematic, not data. The liquid lies about
    as dense as the solid and takes the container floor; the gas fills the container (textbook
    qualitative facts). The energy stroke has no scale: melting at half its length is drawing
    position only, not a ratio of energies.
  - Captions: the entry's own phase notes; the sublimation and deposition notes are not played (those
    two changes are the legend line). -->
