<!-- service-deps (pool, verb nest, archetype graph, domain software). Hand-built; lean style, references/style.md.
  Story: a service graph builds rank by rank, then a third-party outage stays contained to Payments.
  Set-up (reveal, 0-2.6 s): Edge, then gateway, then Orders and Payments, then Inventory and the
  database, then the provider and the event bus, wires drawn on. The outage (2.7-4.8 s): the provider
  changes state in place (danger ring, DOWN), the failure runs back along the one edge that depends on
  it (Payments > provider), Payments takes the danger state (DEGRADED) and the colour reaches the wall
  on the gateway > Payments wire; nothing else changes colour. Hero (5.1-6.85 s): a containment
  outline draws slowly around exactly the provider and Payments and gets its mono label
  "blast radius". Answer (7.1-8.05 s): everything outside the outline comes back lit as healthy, and
  the entry's last caption. Hold 8.2-9.4 s.
  Verb: nest (one boundary contains the failure). Technique: draw-on (pathLength 100) of the wires and
  of one closed outline path; the spread is a draw-on of a danger copy along each affected edge, drawn
  from the failing end (no marker travels; no offset-path); node states are stacked copies cross-faded.
  Once pass 9.4 s, phases 2.6 (graph built), 3.5 (provider down), 4.9 (Payments degraded),
  7.0 (outline closed), 8.2 (hold).
  Facts:
  - Node names, sub-labels, edges, edge labels (HTTPS, order.placed), groups (Edge, Core services),
    captions and the affected set (provider DOWN, Payments DEGRADED, the gateway > Payments call
    affected, the rest healthy): unchanged from the previous service-deps entry and its spec.yaml.
  - "blast radius": the entry's own term for the affected part (index tag blast-radius, spec phase
    "blast"). No numbers in this fragment.
  - Captions kept: "Core services sit behind the gateway" (graph), "Payments calls an external
    provider" (outage and containment), the final one. Dropped so each caption stays readable:
    "Requests enter through the API gateway", "Orders and Inventory publish events", and
    "One request: web app > gateway > Orders > database" (its traced request is gone). -->
