<!-- bloom-taxonomy (pool, verb stack, archetype layers drawn as a pyramid, domain education). Hand-built; lean style, references/style.md. No spec.yaml (six levels exceed the scaffolder five-layer limit).
  Story: the six levels of the revised Bloom's taxonomy stack bottom-up, each resting on the one
  below, and one topic (fractions) gets an example task at every level. A ground line draws and the
  first tier (Remember) comes down onto it at once; then each next tier comes down onto the one
  below, one at a time, Create last. Every tier is an outline in the foreground tone; it stops 3 px
  above the tier below and then seats onto it, so its bottom edge and the top edge below merge into
  one line. Its fraction task lands 0.1 s after it seats. Nothing is highlighted on the way up.
  Answer: the finished pyramid, Create takes the accent and the one glow, final caption.
  Verb: stack. Technique: per tier an outer <g> fades in (enter curve) and an inner <g> is lowered
  56 px with translateY (transform-box view-box): ease-in-out down to -3 px, then a 0.2 s seat on
  the move curve to 0, no overshoot. Tiers share their edges. Accent = an outline copy on Create only.
  No token, no offset-path.
  Once pass 10 s: Remember lands 0-0.55 s on the ground (drawn 0-0.4 s) | stack in three pairs with a
  settled gap after each (Remember+Understand to 1.9 s, Apply+Analyze 2.2-4.1, Evaluate+Create
  4.4-5.85, rows follow each seat by 0.1 s) | answer 6.25-7.4 s (Create accent, glow, final caption)
  | hold 8.6-10 s. Phases 2.15, 4.35, 6.2, 7.4, 8.6.
  Facts:
  - Six levels Remember, Understand, Apply, Analyze, Evaluate, Create, bottom to top: the revised
    taxonomy, Anderson & Krathwohl (2001), cognitive process dimension (stated fact).
  - Mono sub-labels: cognitive processes A&K list under each level (plan = designing, critique =
    judging) (stated fact, unchanged from the earlier version of this entry).
  - The six fraction tasks: ILLUSTRATIVE examples, marked by the outlined tag "example tasks, one
    topic: fractions".
  - "Each level builds on the ones below it" / "each level rests on the one below": the usual
    pyramid reading of the taxonomy, kept from the earlier entry. Note: Krathwohl (2002) says the
    revision relaxed the strict cumulative hierarchy so that categories may overlap.
  - No numbers besides 2001 and the fractions inside the example tasks. Tier sizes are drawing scale. -->
