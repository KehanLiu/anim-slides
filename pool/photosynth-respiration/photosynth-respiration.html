<!-- photosynth-respiration (pool, archetype compare, domain biology), lean restyle (references/style.md).
  Down arrow (accent-2) = taken in, up arrow (accent) = given off; the gutter ring flips as each respiration row enters.

  as one staggered series, headers settle with a small rise. -->
