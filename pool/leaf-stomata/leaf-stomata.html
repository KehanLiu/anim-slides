<!-- leaf-stomata (pool, verb zoom, archetype layers drawn as a scene, domain biology). Hand-built; lean style, references/style.md.
  Story: a leaf exchanges gases through tiny pores on its surface. A whole leaf (outline, midrib, a few
  veins), seen from its underside; a ring marks one spot; the view moves into that spot until it fills
  the slot (the hero), the leaf fading as one stoma fades in: two bean-shaped guard cells with the pore
  between them, a few neighbouring cells around, a small outline of the leaf kept in the corner. The
  guard cells bow apart and the pore opens; then two arrows draw on through the pore: CO2 in, O2 and
  water vapour out.
  Verb: zoom (with the pore opening as the move inside the detail, motion-verbs.md section 3).
  Technique: one root group <g class="leaf-stomata-zoom"> carries translate(-7192px,-2210px) scale(8) with
  transform-box:view-box and transform-origin 0 0, interpolated from identity; both translate and scale
  are linear in the eased progress, so the spot (1004,310) travels straight to the centre (840,270) while
  the ring (r 26.25) grows into the 210 px lens. The detail is drawn in final coordinates inside a
  group with the inverse static transform (scale(0.125) translate(7192 2210)), so it rides the same zoom exactly.
  vector-effect:non-scaling-stroke keeps every stroke 2-2.5 px through the x8 move. No text is inside the
  zoomed group: leaf labels leave before the move, detail labels arrive after it settles.
  Pore: the closed and open outlines of each guard cell share their commands; base = cross-fade of stacked
  copies, enhancement inside @supports (d: path()) animates d on one copy. Resting frame = open = 100 %.
  Once pass 9.3 s: set 0-1.6 s (leaf, ring), zoom 1.9-3.6 s, labels 3.7-4.2 s, pore opens 4.6-6.0 s,
  status 6.05-6.4 s, exchange arrows 6.75-8.05 s, hold 8.15-9.3 s. Phases 1.6, 4.3, 6.45, 8.15.
  Facts (textbook plant biology, the brief's stated facts; no numbers are shown):
  - stomata are pores, mostly on the underside of leaves: stated; drawn as a leaf seen from the "underside".
  - each pore lies between two guard cells: stated; drawn as two bean-shaped cells around one pore.
  - guard cells take up water and swell, the pore opens: stated; drawn as the cells bowing apart ("closed" -> "open").
  - CO2 enters through the open pore; O2 and water vapour leave through it: stated; two arrows through the pore.
  - neighbouring cells: stated in the brief as outlined cells around the stoma; their shapes are schematic.
  - leaf shape, vein pattern, cell shapes, sizes and the x8 zoom factor: drawing choices, not data; the
    figure carries the mono note "not to scale". No sizes, counts per area or magnification are stated. -->
