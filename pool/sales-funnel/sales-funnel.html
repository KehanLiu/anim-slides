<!-- sales-funnel (pool, archetype pipeline drawn as a funnel, domain marketing). Hand-built.

  (one dot = 50 people) and the conversion to the next stage. ILLUSTRATIVE numbers, marked in the
  fragment: 10,000 -> 2,500 (25 %) -> 800 (32 %) -> 200 (25 %) -> 150 (75 %). Band widths taper
