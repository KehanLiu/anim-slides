<!-- number-sets (pool, verb nest, archetype layers drawn as nested sets, domain education / mathematics). Hand-built; lean style, references/style.md.
  Story: every natural number is an integer, every integer is a rational number and every rational
  number is a real number: each set of numbers sits inside the next. The natural numbers 1, 2, 3
  stand alone; an outline draws around them and its label lands on it (natural, N). Then 0 and -3
  arrive just outside and a larger outline draws around everything so far (integers, Z); then 1/2
  and -0.75 (rational, Q); then the square root of 2 and pi (real, R). Answer: one mono line
  "N subset Z subset Q subset R" under the figure.
  Verb: nest. Technique: four rounded outlines that share the lower-left region and grow up and to
  the right, so each set's new members have their own band and each label sits in a gap of its
  own top edge (labels step diagonally, no collisions). Each outline is one path with
  pathLength=100 that starts at the right end of its label gap and runs clockwise back to it; it
  draws on by stroke-dashoffset 101 -> 0 (1.1 s; the outermost 1.2 s). Each set's group carries
  `color`; outline and set letter use currentColor: accent while that outline is the current one,
  settling to muted as the next outline starts; the outermost (R) keeps the accent at rest.
  Nothing travels: no offset-path, no markers, no arrows.
  Once pass 9.9 s: set 0-0.8 s (1, 2, 3 rise in); N draws 0.8-1.9, label 1.95; Z members 2.3,
  draws 2.85-3.95, label 4.0; Q members 4.35, draws 4.9-6.0, label 6.05; R members 6.4, draws
  6.95-8.15, label 8.2; answer line 8.55-8.95, last caption 8.4-9.02; hold 9.1-9.9. Phases 2.3,4.35,6.4,9.1 (each step settled).
  Facts (school mathematics, stated in the entry's brief):
  - Natural numbers N: 1, 2, 3, ... (0 is left out because some textbooks include it and some do
    not; it is shown among the integers, where it belongs either way).
  - Integers Z add zero and the negatives: examples 0 and -3.
  - Rational numbers Q add fractions: examples 1/2 and -0.75.
  - Real numbers R add the irrational numbers: examples the square root of 2 and pi.
  - N is contained in Z, Z in Q, Q in R (the answer line, subset sign U+2282). No other numbers
    are drawn. Set symbols are plain capitals N, Z, Q, R: the double-struck forms render in
    headless Chrome but from mixed fallback fonts (Q unlike the others), so plain letters it is.
  - Outline sizes and positions are layout only and carry no quantity (no "illustrative" tag
    needed: nothing on the slide is an example value beyond the stated example members). -->
