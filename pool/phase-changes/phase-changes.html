<!-- phase-changes (pool, archetype states, domain chemistry; lean restyle, references/style.md). Hand-built from pool/phase-changes/spec.yaml.
  Solid, liquid and gas with the six named transitions; changes toward gas (melting, vaporization,
  sublimation) absorb energy, changes toward solid (freezing, condensation, deposition) release it.
  Only temperatures shown: water at 1 atm (0 °C, 100 °C). Particle drawings are schematic.
  10 s once-play pass (one full circuit): states enter 0.08-0.6 s | one token per transition, solid > liquid >
  gas > liquid > solid > gas > solid, 1.34 s apart | 8.7 s all six lit | hold to 10 s, then stays. -->

<text class="phase-changes-note phase-changes-n0" x="840" y="574" text-anchor="middle">Three states of matter and the six named changes between them</text>
<text class="phase-changes-note phase-changes-n1" x="840" y="574" text-anchor="middle">Melting: particles leave their fixed positions as the solid absorbs energy</text>
<text class="phase-changes-note phase-changes-n2" x="840" y="574" text-anchor="middle">Vaporization: particles absorb energy and escape into the gas</text>
<text class="phase-changes-note phase-changes-n3" x="840" y="574" text-anchor="middle">Condensation: gas particles release energy and gather into a liquid</text>
<text class="phase-changes-note phase-changes-n4" x="840" y="574" text-anchor="middle">Freezing: the liquid releases energy and particles lock into a lattice</text>
<text class="phase-changes-note phase-changes-n5" x="840" y="574" text-anchor="middle">Sublimation: a solid absorbs energy and becomes a gas directly</text>
<text class="phase-changes-note phase-changes-n6" x="840" y="574" text-anchor="middle">Deposition: a gas releases energy and becomes a solid directly</text>
<text class="phase-changes-note phase-changes-n7" x="840" y="574" text-anchor="middle">Changes toward gas absorb energy; changes toward solid release it</text>
