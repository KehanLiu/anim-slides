<!-- phase-changes (pool, verb switch, archetype states drawn as one sealed container of particles, domain chemistry). Hand-built; lean style, references/style.md.
  Story: the same particles, arranged differently. One sample of 18 particles sits in one container.
  Energy is added (the "energy in" stroke at the left draws up, absorbing colour): the solid lattice
  loosens into a liquid that lies along the container floor (melting, absorbs energy, melts at 0 °C);
  more energy and the particles spread out to fill the whole container (vaporization, absorbs energy,
  boils at 100 °C). A state scale at the right lights the current state: solid, liquid, gas. The
  reverse changes (condensation, freezing) and the direct jumps (sublimation, deposition) are a quiet
  legend line that lights at the end with the final caption. The pass ends on the gas: a return
  (condensation and freezing played back) would need two more 2.4 s particle series at the honest
  concurrency limit and does not fit 10 s, so the reverse is named in the legend only.
  Verb: switch (a change of state in place, caused by energy in). Object constancy: the same 18
  circles for the whole pass; nothing is swapped or cross-faded.
  Technique: one translate track per particle (lattice -> liquid -> gas positions; the base rule is
  the gas position, so the still is the gas). Each rearrangement is one staggered series in which at
  most three particles are in motion at once (melting 0.12 s apart, 0.33 s each; vaporization 0.14 s
  apart, 0.4 s each), top layer first. Energy-in stroke: draw-on (pathLength 100) to 50 at melting,
  0 at vaporization. Lit states, lit labels and captions cross-fade stacked copies.
  Once pass 10 s: set 0-0.85 s | energy in 0.95-1.45 s | melting series 1.55-3.92 s |
  liquid lit, melting label 3.99-4.44 s | energy in 4.6-5.1 s |
  vaporization series 5.2-7.98 s | gas lit, label 8.04-8.44 s | legend lit and
  final caption 8.55-9.05 s | hold to 10 s. Phases 0.85,4.54,8.5,9.05.
  Facts:
  - Solid, liquid, gas and their sub-labels ("ordered, fixed in place", "close, slide past each
    other", "far apart, move freely"): from the entry (pool/phase-changes/spec.yaml), textbook.
  - Six named changes and their energy: melting, vaporization, sublimation absorb energy; freezing,
    condensation, deposition release it (textbook; spec.yaml). Wording kept from the entry.
  - "water at 1 atm: melts at 0 °C, boils at 100 °C": stated facts from the entry, kept verbatim
    as the top-right note; "0 °C" and "100 °C" also sit under their change as "melts at 0 °C" and
    "boils at 100 °C" (the same words, split at the comma).
  - Particle drawing, the count of 18 and their positions: schematic, not data. The liquid lies
    about as dense as the solid and takes the container floor; the gas fills the container
    (textbook qualitative facts). The energy stroke has no scale: melting at half its length is
    drawing position only, not a ratio of energies.
  - Captions: the entry's own phase notes (states, melting, vaporization, hold); the condensation,
    freezing, sublimation and deposition notes are not played because the pass ends on the gas. -->
