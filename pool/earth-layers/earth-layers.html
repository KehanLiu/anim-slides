<!-- earth-layers (pool, verb open as a cutaway, archetype layers drawn as the planet itself, domain earth science). Hand-built; lean style, references/style.md.
  Story: the Earth is one closed sphere drawn as a thin outline. A quarter is cut away: a knife radius
  turns from the top cut face round to the right one and the wedge opens behind it (hero, step 1).
  The opened wedge then shows the layers one after another from the outside in (hero, step 2): the
  crust is the outline itself and gets its label; the mantle face fills in; the outer core face fills
  in as the core-mantle boundary arc draws on; the inner core fills in as the inner-core boundary
  draws on. Each layer gets a thin leader from a dot on the flat cut face to a label at the right,
  with its depth in mono. Answer: a depth scale draws along the vertical cut face in the one accent,
  from 0 km at the surface to 6,371 km at the centre, its depths arriving as the line reaches them.
  Verb: open (cutaway). Technique: the wedge contents sit in one <g> whose clip-path is a 4-vertex
  polygon() stepped in 8 linear segments on a smoothstep, so the opening edge is one radius sweeping
  90 degrees and keeps pace with a knife line rotated about the centre (transform-box view-box, px
  origin). An invisible rect fixes the group's reference box (570,12)-(862,304);
  polygon px are relative to it. Layer faces fade in, boundary arcs and leaders draw on (pathLength).
  The accent is kept for the depth scale only. No offset-path, no marker. Leaders leave each layer
  through the flat cut face, drop through the closed lower quarter and cross the outline once at most.
  Once pass 8.7 s: set 0-0.6 s, cut 0.6-2.2 s, layers 2.65-6.15 s, answer 6.35-7.4 s, hold 7.5-8.7 s.
  Phases 0.57, 2.3, 4.4, 6.25, 7.5.
  Facts (checked on Wikipedia, "Structure of Earth", which cites PREM/USGS values; USGS and
  Britannica pages refused automated fetches):
  - mean radius 6,371 km; core-mantle boundary 2,890 km deep; inner-core boundary about 5,150 km deep:
    stated facts (brief; Wikipedia "Structure of Earth"). Britannica rounds the centre to 6,370 km.
  - crust 5-70 km thick: stated fact (brief; same source).
  - mantle rocky (solid, flows slowly), outer core liquid, inner core solid (iron and nickel): stated
    facts; only "rocky", "liquid" and "solid" are drawn.
  - radii drawn: R = 252 px for 6,371 km; core-mantle boundary 6,371 - 2,890 = 3,481 km -> 137.69 px;
    inner-core boundary 6,371 - 5,150 = 1,221 km -> 48.3 px: arithmetic.
  - "thinner than this line": 3 px stroke = 3 x 6,371 / 252 = about 76 km > 70 km: arithmetic.
  - mantle depth written "to 2,890 km" (not "0-2,890"): the mantle starts under the crust.
  - the three tints are scene ground (data-anim-scene) in one muted hue, denser toward the centre; the
    density step carries no data. No temperatures, pressures or percentages. -->
