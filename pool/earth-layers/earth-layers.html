<!-- earth-layers (pool, verb open as a cutaway, archetype layers drawn as the planet itself, domain earth science). Hand-built; lean style, references/style.md.
  Story: the Earth is one closed sphere drawn as a thin outline. A quarter of it is cut away: the cut
  sweeps open from the top cut face round to the right one and the inside shows concentric layers at
  true radial proportion (hero, step 1). The layers are then named from the outside in, each with a
  thin leader to a label outside the sphere and its depth in mono; the layer being named takes the
  accent and the earlier labels dim (hero, step 2). Leaders leave each layer through the flat
  cut face (a dot on the horizontal cut edge), drop through the closed lower quarter and cross only the
  outer outline once. Answer: the labels come back and a depth scale
  draws along the vertical cut face, from 0 km at the surface to 6,371 km at the centre.
  Verb: open (cutaway). Technique: the wedge contents (faint layer faces, boundary arcs, the two cut
  faces) sit in one <g> whose clip-path is a 4-vertex polygon() animated in two segments (the third
  vertex runs along the top of the quarter's box, then the fourth runs down its right side), so the
  opening edge is one straight radius sweeping 90 degrees; equal vertex counts, so it interpolates
  everywhere. An invisible rect fixes the group's reference box (610,30)-(890,310); polygon px are
  relative to it. Labels: stacked accent copies cross-faded, leaders drawn on with pathLength,
  callout groups dimmed by colour (label and dot to --anim-muted) and opacity .6, legible on light grounds too. No offset-path, no marker. The crust is the outline stroke itself
  (3 px = about 80 km at this scale), said in the crust's mono note.
  Once pass 9.9 s: set 0-1.28 s, cut 1.3-3.0 s, naming 3.35-7.23 s, answer 7.25-8.85 s, hold 8.9-9.9 s.
  Phases 1.28, 3.0, 5.25, 7.24, 8.9.
  Facts (checked on Wikipedia, "Structure of Earth", which cites PREM/USGS values; USGS and
  Britannica pages refused automated fetches):
  - mean radius 6,371 km; core-mantle boundary 2,890 km deep; inner-core boundary about 5,150 km deep:
    stated facts (brief; Wikipedia "Structure of Earth"). Britannica rounds the centre to 6,370 km.
  - crust 5-70 km thick: stated fact (brief; same source).
  - mantle rocky (solid, flows slowly), outer core liquid, inner core solid (iron and nickel): stated
    facts; only "rocky", "liquid" and "solid" are drawn.
  - radii drawn: R = 240 px for 6,371 km; core-mantle boundary 6,371 - 2,890 = 3,481 km -> 131.13 px;
    inner-core boundary 6,371 - 5,150 = 1,221 km -> 46 px: arithmetic.
  - "thinner than this line": 3 px stroke = 3 x 6,371 / 240 = about 80 km > 70 km: arithmetic.
  - mantle depth written "to 2,890 km" (not "0-2,890"): the mantle starts under the crust.
  - the four tints are scene ground (data-anim-scene) in one muted hue, denser toward the centre; the
    density step carries no data. No temperatures, pressures or percentages. -->
<style>
.anim-earth-layers{
  --anim-bg:       var(--anim-theme-bg,       #0F1E27);
  --anim-panel:    var(--anim-theme-panel,    #0D1820);
  --anim-line:     var(--anim-theme-line,     #2A3D49);
  --anim-fg:       var(--anim-theme-fg,       #E6EDF0);
  --anim-muted:    var(--anim-theme-muted,    #93A7B2);
  --anim-accent:   var(--anim-theme-accent,   #34D1BF);
  --anim-accent-2: var(--anim-theme-accent-2, #FF8A3D);
  --anim-ok:       var(--anim-theme-ok,       #8ED7AD);
  --anim-warn:     var(--anim-theme-warn,     #FFD15C);
  --anim-danger:   var(--anim-theme-danger,   #FF6B6B);
  --anim-font:     var(--anim-theme-font,     system-ui, sans-serif);
  --anim-mono:     var(--anim-theme-mono,     ui-monospace, monospace);
  display:block;width:100%;height:100%
}
.anim-earth-layers svg{display:block;width:100%;height:100%;max-width:none}
.anim-earth-layers .earth-layers-t{font-family:var(--anim-font);fill:var(--anim-fg)}
.anim-earth-layers .earth-layers-lbl{font-size:24px;font-weight:600}
.anim-earth-layers .earth-layers-note{font-size:26px;font-weight:400}
.anim-earth-layers .earth-layers-mono{font-family:var(--anim-mono);font-size:20px;font-weight:400;fill:var(--anim-muted)}
.anim-earth-layers .earth-layers-sc{font-size:18px}
.anim-earth-layers .earth-layers-acc{fill:var(--anim-accent)}
/* the planet: the outline is the crust */
.anim-earth-layers .earth-layers-earth{fill:none;stroke:var(--anim-fg);stroke-width:3}
.anim-earth-layers .earth-layers-face0{fill:color-mix(in srgb,var(--anim-muted) 7%,transparent)}
.anim-earth-layers .earth-layers-face1{fill:color-mix(in srgb,var(--anim-muted) 13%,transparent)}
.anim-earth-layers .earth-layers-face2{fill:color-mix(in srgb,var(--anim-muted) 20%,transparent)}
.anim-earth-layers .earth-layers-bnd{fill:none;stroke:var(--anim-muted);stroke-width:2}
.anim-earth-layers .earth-layers-edge{fill:none;stroke:var(--anim-fg);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.anim-earth-layers .earth-layers-box{fill:none;stroke:none}
.anim-earth-layers .earth-layers-knife{fill:none;stroke:var(--anim-fg);stroke-width:2.5;stroke-linecap:round;transform-box:view-box;transform-origin:630px 290px;transform:rotate(90deg)}
/* accent copies of the named layer */
.anim-earth-layers .earth-layers-hlf{fill:color-mix(in srgb,var(--anim-accent) 24%,transparent);stroke:var(--anim-accent);stroke-width:2.5;stroke-linejoin:round}
.anim-earth-layers .earth-layers-hla{fill:none;stroke:var(--anim-accent);stroke-width:6;stroke-linecap:round}
/* callouts */
.anim-earth-layers .earth-layers-lead{fill:none;stroke:var(--anim-muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100 120;stroke-dashoffset:0;opacity:.75}
.anim-earth-layers .earth-layers-cob{fill:var(--anim-fg)}
.anim-earth-layers .earth-layers-cl{font-family:var(--anim-font);fill:inherit}
.anim-earth-layers .earth-layers-dot{fill:inherit}
.anim-earth-layers .earth-layers-tick{fill:none;stroke:var(--anim-accent);stroke-width:2;stroke-linecap:round}
.anim-earth-layers .earth-layers-scl{fill:none;stroke:var(--anim-accent);stroke-width:3;stroke-linecap:round;stroke-dasharray:100 120;stroke-dashoffset:0}
/* resting frame = the end: wedge open, all four callouts at full strength, no layer lit, scale drawn */
.anim-earth-layers .earth-layers-cut{clip-path:polygon(14px 266px,14px 0px,280px 0px,280px 266px)}
.anim-earth-layers .earth-layers-hl0,.anim-earth-layers .earth-layers-hl1,.anim-earth-layers .earth-layers-hl2,.anim-earth-layers .earth-layers-hl3,.anim-earth-layers .earth-layers-n0,.anim-earth-layers .earth-layers-n1,.anim-earth-layers .earth-layers-n2{opacity:0}
.anim-earth-layers .earth-layers-tx0,.anim-earth-layers .earth-layers-tx1,.anim-earth-layers .earth-layers-tx2,.anim-earth-layers .earth-layers-tx3{transform:translateY(0px)}

/* ---- motion (9.9 s once pass), only when the slide is visible. percent = s / 9.9 ---- */
/* scene fades in 0-0.6 s */
@keyframes earth-layers-scene{
  0%{opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1)}  /* 0 s */
  6.061%{opacity:1}  /* 0.6 s */
  100%{opacity:1}  /* 9.9 s */
}
/* the cut: a fan clip sweeps 90 deg from the top cut face round to the right one, 1.3-3.0 s (hero);
   8 linear segments on a smoothstep, so the clip edge keeps pace with the knife line */
@keyframes earth-layers-cut{
  0%{clip-path:polygon(14px 266px,14px 0px,14px 0px,14px 0px)}  /* 0 s */
  13.131%{clip-path:polygon(14px 266px,14px 0px,14.0px 0px,14.0px 0px)}  /* 1.3 s */
  15.273%{clip-path:polygon(14px 266px,14px 0px,37.6px 0px,37.6px 0px)}  /* 1.512 s */
  17.424%{clip-path:polygon(14px 266px,14px 0px,85.1px 0px,85.1px 0px)}  /* 1.725 s */
  19.576%{clip-path:polygon(14px 266px,14px 0px,161.0px 0px,161.0px 0px)}  /* 1.938 s */
  21.717%{clip-path:polygon(14px 266px,14px 0px,280.0px 0px,280.0px 0px)}  /* 2.15 s */
  23.859%{clip-path:polygon(14px 266px,14px 0px,280px 0px,280px 119.0px)}  /* 2.362 s */
  26.01%{clip-path:polygon(14px 266px,14px 0px,280px 0px,280px 194.9px)}  /* 2.575 s */
  28.162%{clip-path:polygon(14px 266px,14px 0px,280px 0px,280px 242.4px)}  /* 2.788 s */
  30.303%{clip-path:polygon(14px 266px,14px 0px,280px 0px,280px 266px)}  /* 3.0 s */
  100%{clip-path:polygon(14px 266px,14px 0px,280px 0px,280px 266px)}  /* 9.9 s */
}
/* the knife: the cut's leading radius, fades in 1.05-1.3 s and turns with the clip */
@keyframes earth-layers-knife{
  0%{transform:rotate(0deg);opacity:0}  /* 0 s */
  10.606%{transform:rotate(0deg);opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1)}  /* 1.05 s */
  13.131%{transform:rotate(0deg);opacity:1}  /* 1.3 s */
  15.273%{transform:rotate(3.87deg);opacity:1}  /* 1.512 s */
  17.424%{transform:rotate(14.06deg);opacity:1}  /* 1.725 s */
  19.576%{transform:rotate(28.48deg);opacity:1}  /* 1.938 s */
  21.717%{transform:rotate(45deg);opacity:1}  /* 2.15 s */
  23.859%{transform:rotate(61.52deg);opacity:1}  /* 2.362 s */
  26.01%{transform:rotate(75.94deg);opacity:1}  /* 2.575 s */
  28.162%{transform:rotate(86.13deg);opacity:1}  /* 2.788 s */
  30.303%{transform:rotate(90deg);opacity:1}  /* 3.0 s */
  100%{transform:rotate(90deg);opacity:1}  /* 9.9 s */
}
