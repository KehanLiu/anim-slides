<!-- court-case (pool, archetype timeline, domain civics/law). Hand-built; spec.yaml reproduces the stages.
  Story: a generic criminal case moves from investigation and charge through arraignment, discovery,
  trial and verdict to sentencing. The progress line changes colour where responsibility passes
  (police and prosecution -> court -> jury -> court); brackets under the axis mark each owner and
  each hand-off. Labels alternate above and below the axis. Once-play pass 10 s, ends on the resting frame; hold 9.2-10 s.
  Entrance by kind: the axis draws on and the stage marks land as it passes; at each stage the progress line
  arrives, the mark lands, its leader draws out, then label and sub-label settle; hand-off chevrons draw on.
  Focal: the sentencing mark (larger ring, the one glow at rest), where the last owner closes the case.
  Generic and simplified: assumes a not-guilty plea and a jury trial; many cases end in a guilty plea or a bench trial, and stage names and order vary by jurisdiction. -->
<style>
.anim-court-case{
  --anim-bg:       var(--anim-theme-bg,       #0F1E27);
  --anim-panel:    var(--anim-theme-panel,    #0D1820);
  --anim-line:     var(--anim-theme-line,     #56707F);
  --anim-fg:       var(--anim-theme-fg,       #E6EDF0);
  --anim-muted:    var(--anim-theme-muted,    #93A7B2);
  --anim-accent:   var(--anim-theme-accent,   #34D1BF);
  --anim-accent-2: var(--anim-theme-accent-2, #FF8A3D);
  --anim-ok:       var(--anim-theme-ok,       #8ED7AD);
  --anim-warn:     var(--anim-theme-warn,     #FFD15C);
  --anim-danger:   var(--anim-theme-danger,   #FF6B6B);
  --anim-font:     var(--anim-theme-font,     "Avenir Next", "Segoe UI Variable Display", "Segoe UI", "Helvetica Neue", system-ui, sans-serif);
  --anim-mono:     var(--anim-theme-mono,     ui-monospace, "SF Mono", Menlo, Consolas, monospace);
  display:block;width:100%;height:100%
}
.anim-court-case svg{display:block;width:100%;height:100%}
/* lean style (references/style.md): one axis, dots, labels alternate above and below on thin leaders,
   no cards; the progress line (4 px) changes colour where ownership passes; owners are hairline brackets
   with labels in the text font; the current stage is a ring; one glow copy follows it, and only
   sentencing (the focal mark, drawn larger) keeps it at rest */

.anim-court-case .court-case-st-ok{stroke:var(--anim-ok)}
