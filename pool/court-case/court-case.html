<!-- court-case (pool, archetype timeline, domain civics/law). Hand-built; spec.yaml reproduces the stages.
  Story: a generic criminal case moves from investigation and charge through arraignment, discovery,
  trial and verdict to sentencing. The progress line changes colour where responsibility passes
  (police and prosecution -> court -> jury -> court); brackets under the axis mark each owner and
  each hand-off. Labels alternate above and below the axis. Once-play pass 10 s, ends on the resting frame; hold 8.96-10 s.
  Generic and simplified: assumes a not-guilty plea and a jury trial; many cases end in a guilty plea or a bench trial, and stage names and order vary by jurisdiction. -->
<style>

  --anim-fg:       var(--anim-theme-fg,       #E6EDF0);
  --anim-muted:    var(--anim-theme-muted,    #93A7B2);
  --anim-accent:   var(--anim-theme-accent,   #34D1BF);
  --anim-accent-2: var(--anim-theme-accent-2, #FF8A3D);
  --anim-ok:       var(--anim-theme-ok,       #8ED7AD);
  --anim-warn:     var(--anim-theme-warn,     #FFD15C);
  --anim-danger:   var(--anim-theme-danger,   #FF6B6B);
  --anim-font:     var(--anim-theme-font,     system-ui, sans-serif);
  --anim-mono:     var(--anim-theme-mono,     ui-monospace, monospace);
  display:block;width:100%;height:100%
}
.anim-court-case svg{display:block;width:100%;height:100%}

.anim-court-case .court-case-sub{font-family:var(--anim-mono);font-size:19px;fill:var(--anim-muted)}

.anim-court-case .court-case-prog{fill:none;stroke-width:3;stroke-linecap:butt;stroke-dasharray:100 120;stroke-dashoffset:0}
