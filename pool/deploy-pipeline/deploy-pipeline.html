<!-- deploy-pipeline (pool, archetype pipeline). Hand-polished from the scaffold of spec.yaml.
  Story: commit > build > test > staging > canary; the rollback edge is armed during the canary,
  errors stay under the limit and production is promoted to 100 %. Cycle 12 s, hold 9.4-11.5 s. -->
<style>
.anim-deploy-pipeline{
  --anim-bg:       var(--anim-theme-bg,       #0f1218);
  --anim-panel:    var(--anim-theme-panel,    #1a2030);
  --anim-line:     var(--anim-theme-line,     #3a4660);
  --anim-fg:       var(--anim-theme-fg,       #eef2f8);
  --anim-muted:    var(--anim-theme-muted,    #9aa7bd);
  --anim-accent:   var(--anim-theme-accent,   #4cc2ff);
  --anim-accent-2: var(--anim-theme-accent-2, #ffb454);
  --anim-ok:       var(--anim-theme-ok,       #3ecf8e);
  --anim-warn:     var(--anim-theme-warn,     #ffb454);
  --anim-danger:   var(--anim-theme-danger,   #ff5d5d);
  --anim-font:     var(--anim-theme-font,     system-ui, sans-serif);
  --anim-mono:     var(--anim-theme-mono,     ui-monospace, monospace);
  display:block;width:100%;height:100%
}
.anim-deploy-pipeline svg{display:block;width:100%;height:100%}
.anim-deploy-pipeline .deploy-pipeline-t{font-family:var(--anim-font);fill:var(--anim-fg)}
.anim-deploy-pipeline .deploy-pipeline-lbl{font-size:22px;font-weight:700}
.anim-deploy-pipeline .deploy-pipeline-sub{font-size:18px;fill:var(--anim-muted)}
.anim-deploy-pipeline .deploy-pipeline-note{font-size:22px}
.anim-deploy-pipeline .deploy-pipeline-mono{font-family:var(--anim-mono);font-size:18px;fill:var(--anim-muted)}
.anim-deploy-pipeline .deploy-pipeline-sub.deploy-pipeline-gn,.anim-deploy-pipeline .deploy-pipeline-mono.deploy-pipeline-gn{fill:var(--anim-ok)}
.anim-deploy-pipeline .deploy-pipeline-mono.deploy-pipeline-cy{fill:var(--anim-accent)}
.anim-deploy-pipeline .deploy-pipeline-mono.deploy-pipeline-wn{fill:var(--anim-warn)}
.anim-deploy-pipeline .deploy-pipeline-wire{fill:none;stroke:var(--anim-line);stroke-width:3;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:0}
.anim-deploy-pipeline .deploy-pipeline-arrow{fill:none;stroke:var(--anim-line);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

.anim-deploy-pipeline .deploy-pipeline-arc-head{stroke:var(--anim-muted);stroke-width:2.5}
.anim-deploy-pipeline .deploy-pipeline-arc-armed{stroke:var(--anim-warn);stroke-width:3;stroke-dasharray:2 11}
.anim-deploy-pipeline .deploy-pipeline-box{fill:var(--anim-panel);stroke:var(--anim-line);stroke-width:2;stroke-linejoin:round}
.anim-deploy-pipeline .deploy-pipeline-box-run{fill:color-mix(in srgb,var(--anim-accent) 14%,var(--anim-panel));stroke:var(--anim-accent);stroke-width:2.5}
.anim-deploy-pipeline .deploy-pipeline-box-ok{fill:color-mix(in srgb,var(--anim-ok) 8%,var(--anim-panel));stroke:var(--anim-ok)}
.anim-deploy-pipeline .deploy-pipeline-bar{fill:var(--anim-line);opacity:.6}
.anim-deploy-pipeline .deploy-pipeline-fill{fill:var(--anim-ok);transform-box:fill-box;transform-origin:left center;transform:scaleX(1)}
.anim-deploy-pipeline .deploy-pipeline-check{fill:none;stroke:var(--anim-ok);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.anim-deploy-pipeline .deploy-pipeline-chip{stroke-width:1.5}
.anim-deploy-pipeline .deploy-pipeline-chip-q{fill:none;stroke:var(--anim-line)}
.anim-deploy-pipeline .deploy-pipeline-chip-r{fill:color-mix(in srgb,var(--anim-accent) 14%,transparent);stroke:var(--anim-accent)}
.anim-deploy-pipeline .deploy-pipeline-chip-o{fill:color-mix(in srgb,var(--anim-ok) 14%,transparent);stroke:var(--anim-ok)}
.anim-deploy-pipeline .deploy-pipeline-pkt{fill:var(--anim-accent);stroke:var(--anim-bg);stroke-width:3;opacity:0}
.anim-deploy-pipeline .deploy-pipeline-p0{offset-path:path('M280 174 H380');offset-rotate:0deg}
.anim-deploy-pipeline .deploy-pipeline-p1{offset-path:path('M620 174 H720');offset-rotate:0deg}

.anim-deploy-pipeline .deploy-pipeline-cap{fill:var(--anim-panel)}
.anim-deploy-pipeline .deploy-pipeline-scene{opacity:1}
