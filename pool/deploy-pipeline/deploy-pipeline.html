<!-- deploy-pipeline (pool, archetype pipeline). Lean restyle of the scaffold of spec.yaml.
  Story: commit > build > test > staging > canary; five rings on one thin line, a glowing dot carries
  the artifact ring to ring, the active ring lights in the accent and a passed ring settles in ok; the
  rollback edge above Staging and Production is armed (marching, warn colour) during the canary,
  errors stay under the limit and production is promoted to 100 %. Plays once: 9.8 s pass, final state from 8.7 s.
  Names, numbers and times are illustrative examples. -->
<style>
.anim-deploy-pipeline{
  --anim-bg:       var(--anim-theme-bg,       #0F1E27);
  --anim-panel:    var(--anim-theme-panel,    #0D1820);
  --anim-line:     var(--anim-theme-line,     #2A3D49);
  --anim-fg:       var(--anim-theme-fg,       #E6EDF0);
  --anim-muted:    var(--anim-theme-muted,    #93A7B2);
  --anim-accent:   var(--anim-theme-accent,   #34D1BF);
  --anim-accent-2: var(--anim-theme-accent-2, #FF8A3D);
  --anim-ok:       var(--anim-theme-ok,       #8ED7AD);
  --anim-warn:     var(--anim-theme-warn,     #FFD15C);

  --anim-mono:     var(--anim-theme-mono,     ui-monospace, monospace);
  display:block;width:100%;height:100%
}
