<!-- mediation-vs-trial (pool, verb race, archetype compare drawn as two time bars on one month axis, domain law). Hand-built; lean style, references/style.md.
  Story: the same dispute can go two routes. Both start on the same day ("dispute", month 0) on one
  shared calendar axis. Two bars grow at the same moment and at the same rate; mediation stops at
  3 months ("agreement"), the court trial keeps growing alone through its four stages and stops at
  18 months ("judgment"). Answer: a bracket from month 3 to month 18, "15 months longer".
  Verb: race. Technique: each bar is one <g> (a quiet fill band plus its top and bottom edge, butt
  caps, so scaleX does not distort a stroke) scaled with scaleX about the dispute line (220px, view-box
  reference box). Scale: 1 month = 70 px for both bars (x = 220 + 70 * month). Both tracks share the
  start (0.5 s) and the linear timing function; their durations are proportional to their lengths
  (mediation 3 months in 0.667 s, trial 18 months in 4.0 s), so both fronts move at 315 px/s and the
  bars have the same length at every instant until mediation stops. Linear here tracks time
  (motion-rules.md: continuous motion that tracks time); everything else eases by role.
  Stage dividers sit outside the scaled group at fixed x and tick in (0.15 s) at the instant the bar
  front passes them; each stage's name and length follow 0.08 s later. Stages are told apart by thin
  dividers, not by fills. Mediation's segments (70 px) are too narrow for their names at 20 px, so
  the names are in the caption while the trial runs on alone.
  Once pass 7.9 s: set 0-0.4 s, race 0.5-4.93 s (front 0.5-4.5 s, last label lands 4.93 s), answer
  5.05-6.35 s, hold 6.5-7.9 s. Phases 0.45, 5.0, 6.5.
  Facts:
  - Mediation and a court trial as two routes for the same dispute: the brief's claim.
  - Mediation 3 months in total: prepare 1, sessions 1, agreement 1 (1 + 1 + 1 = 3): ILLUSTRATIVE.
  - Court trial 18 months in total: pleadings 4, evidence 6, waiting for a hearing date 5, hearing and
    judgment 3 (4 + 6 + 5 + 3 = 18): ILLUSTRATIVE.
  - "15 months longer" = 18 - 3: arithmetic on the illustrative values.
  - Stage names, "dispute", "agreement", "judgment": the brief's words.
  - "example durations; real ones vary widely by country and case": the brief's caveat, shown with
    the "illustrative" tag. No costs, success rates, courts or jurisdictions.
  - Axis 0 to 18 months, ticks every 3 months, 70 px per month: drawing scale, not data. -->

  --anim-accent-2: var(--anim-theme-accent-2, #FF8A3D);

  display:block;width:100%;height:100%
}

.anim-mediation-vs-trial .mediation-vs-trial-n0,.anim-mediation-vs-trial .mediation-vs-trial-n1{opacity:0}

@keyframes mediation-vs-trial-d15{0%{opacity:0}48.523%{opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1)}50.422%{opacity:1}100%{opacity:1}}

@keyframes mediation-vs-trial-brk{0%{stroke-dashoffset:101}68.987%{stroke-dashoffset:101;animation-timing-function:cubic-bezier(0.2,0,0,1)}77.215%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
