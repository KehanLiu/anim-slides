<!-- mediation-vs-trial (pool, verb race, archetype compare drawn as two time bars on one month axis, domain law). Hand-built; lean style, references/style.md.
  Story: the same dispute can go two routes. Both start on the same day ("dispute", month 0) on one
  shared calendar axis. Two bars grow at the same moment and at the same rate; mediation stops at
  3 months ("agreement"), the court trial keeps growing alone through its four stages and stops at
  18 months ("judgment"). Answer: a bracket from month 3 to month 18, "15 months longer".
  Verb: race. Technique: each bar is one <g> (a quiet fill band plus its top and bottom edge, butt
  caps, so scaleX does not distort a stroke) scaled with scaleX about the dispute line (220px, view-box
  reference box). Scale: 1 month = 70 px for both bars (x = 220 + 70 * month). Both tracks share the
  start (1.4 s) and the linear timing function; their durations are proportional to their lengths
  (mediation 3 months in 0.667 s, trial 18 months in 4.0 s), so both fronts move at 315 px/s and the
  bars have the same length at every instant until mediation stops. Linear here tracks time
  (motion-rules.md: continuous motion that tracks time); everything else eases by role.
  Stage dividers sit outside the scaled group at fixed x and tick in (0.15 s) at the instant the bar
  front passes them; each stage's name and length follow 0.08 s later. Stages are told apart by thin
  dividers, not by fills.
  Once pass 8.8 s: set 0-1.35 s, race 1.4-5.83 s (front 1.4-5.4 s, last label lands 5.83 s), answer
  6.0-7.25 s, hold 7.4-8.8 s. Phases 1.35, 5.9, 7.4.
  Facts:
  - Mediation and a court trial as two routes for the same dispute: the brief's claim.
  - Mediation 3 months in total: prepare 1, sessions 1, agreement 1 (1 + 1 + 1 = 3): ILLUSTRATIVE.
  - Court trial 18 months in total: pleadings 4, evidence 6, waiting for a hearing date 5, hearing and
    judgment 3 (4 + 6 + 5 + 3 = 18): ILLUSTRATIVE.
  - "15 months longer" = 18 - 3: arithmetic on the illustrative values.
  - Stage names, "dispute", "agreement", "judgment": the brief's words.
  - "example durations; real ones vary widely by country and case": the brief's caveat, shown with
    the "illustrative" tag. No costs, success rates, courts or jurisdictions.
  - Axis 0 to 18 months, ticks every 3 months, 70 px per month: drawing scale, not data. -->
<style>

  --anim-accent-2: var(--anim-theme-accent-2, #FF8A3D);
  --anim-ok:       var(--anim-theme-ok,       #8ED7AD);

  --anim-danger:   var(--anim-theme-danger,   #FF6B6B);

}

.anim-mediation-vs-trial .mediation-vs-trial-t{font-family:var(--anim-font);fill:var(--anim-fg)}
.anim-mediation-vs-trial .mediation-vs-trial-row{font-size:26px;font-weight:600}
.anim-mediation-vs-trial .mediation-vs-trial-lbl{font-size:22px;font-weight:600}

.anim-mediation-vs-trial .mediation-vs-trial-grid{fill:none;stroke:var(--anim-line);stroke-width:2;stroke-dasharray:2 8;stroke-linecap:round}

/* bars: a quiet band plus top and bottom edges (butt caps: scaleX leaves them intact) */

.anim-mediation-vs-trial .mediation-vs-trial-edge{fill:none;stroke:var(--anim-fg);stroke-width:2.5;stroke-linecap:butt}
.anim-mediation-vs-trial .mediation-vs-trial-div{fill:none;stroke:var(--anim-fg);stroke-width:2;stroke-linecap:round}
.anim-mediation-vs-trial .mediation-vs-trial-end{fill:none;stroke:var(--anim-fg);stroke-width:3;stroke-linecap:round}

.anim-mediation-vs-trial .mediation-vs-trial-brk{fill:none;stroke:var(--anim-accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100 120;stroke-dashoffset:0}

/* resting frame = the end: both bars at full length, every stage labelled, bracket drawn, last caption */
.anim-mediation-vs-trial .mediation-vs-trial-n0,.anim-mediation-vs-trial .mediation-vs-trial-n1{opacity:0}

@keyframes mediation-vs-trial-d15{0%{opacity:0}53.788%{opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1)}55.492%{opacity:1}100%{opacity:1}}

@keyframes mediation-vs-trial-lm{0%{opacity:0;transform:translateY(8px)}24.394%{opacity:0;transform:translateY(8px);animation-timing-function:cubic-bezier(0.16,1,0.3,1)}28.371%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(0)}}

@keyframes mediation-vs-trial-l15{0%{opacity:0;transform:translateY(8px)}54.697%{opacity:0;transform:translateY(8px);animation-timing-function:cubic-bezier(0.16,1,0.3,1)}58.674%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(0)}}
