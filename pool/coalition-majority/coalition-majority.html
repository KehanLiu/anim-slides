<!-- coalition-majority (pool, verb merge, archetype compare drawn as a seat bar, domain civics). Hand-built; lean style, references/style.md.
  Story: no party has a majority alone; three parties join their seats and together pass the
  majority line. A tall chamber row of 100 seat marks (1 mark = 1 seat) with a vertical majority
  line after seat 51; the 47 seats of other parties sit muted at the right end. Party A (34) stands
  in the chamber row; Party C (7) and Party B (12) wait apart in a row below, each visibly short of
  the line. Hero (merge): B's label fades, B slides right along the waiting row (still short of the
  line) and rises into the empty seats after A; at the join the two outlines cross-fade into one, a
  thin divider stays between A and B, and B's label returns. Then the same for C, which now slides
  along the emptied waiting row and rises into the seats after A+B: the joined bar passes the line.
  Answer: the joined outline, the two seats past the line and the line itself take the accent, a
  hairline bracket under the joined bar gives the total 53, a second bracket "2 seats over the line".
  Verb: merge (with a closing mark). Technique: each moving party is nested groups, an outer
  translateX and a middle translateY that starts as the slide ends (so the block never crosses
  other seat marks), plus an entrance group; all transform-box:view-box. "Outline becomes one" =
  cross-fade of the party outlines into one static outline in the chamber row. Labels of a moving
  party fade out before it moves and in about 120 ms after it has joined. No offset-path, no
  travelling marker. Parties are told apart by outline stroke style (A solid, B dashed, C dotted),
  dividers and labels, not by hue.
  Once pass 9.4 s; phases 1.4,3.58,6.3,7.35,8.15 (the last is the hold start).
  Facts:
  - A government in a parliamentary system needs more than half of the seats; parties without a
    majority can form a coalition: stated principle (the brief's claim, general civics).
  - 100 seats, majority line at 51, Party A 34, Party B 12, Party C 7, other parties 47:
    ILLUSTRATIVE, shown with the "illustrative numbers" tag. "Party A/B/C" are neutral names.
  - 51 = more than half of 100: arithmetic. 53 = 34 + 12 + 7, 47 = 100 - 53, 46 (A+B, drawn, not
    labelled) = 34 + 12: arithmetic on the illustrative values.
  - "2 seats over the line" = 53 - 51: arithmetic.
  - Seat marks: drawing scale, 1 mark = 1 seat = 13 px. -->
