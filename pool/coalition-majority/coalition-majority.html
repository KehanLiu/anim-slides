<!-- coalition-majority (pool, verb merge, archetype compare drawn as a seat bar, domain civics). Hand-built; lean style, references/style.md.
  Story: no party has a majority alone; three parties join their seats and together pass the
  majority line. A chamber row of 100 seat marks (1 mark = 1 seat) with a vertical majority line
  after seat 51; the 47 seats of other parties sit muted at the right end. Party A (34) stands in
  the chamber row, Party B (12) and Party C (7) in rows below, each at its true length from the same
  left edge, each visibly short of the line. Hero (merge): B slides right and rises into the empty
  seats after A; at the join the two outlines cross-fade into one. Then C slides right and rises
  into the seats after A+B; the outlines become one again and the joined bar now reaches past the
  line. Answer: the joined outline, the two seats past the line and the line itself take the
  accent, a hairline bracket under the joined bar gives the total 53, a second bracket marks "2 seats over the line".
  Verb: merge (with a closing mark). Technique: each moving party is three nested groups, an outer
  translateX, a middle translateY that starts later (so the segment slides along its own row first
  and rises into the slot from below without crossing A or B), and an inner entrance group; all
  transform-box:view-box. "Outline becomes one" = cross-fade of the party outlines into one
  static outline drawn in the chamber row. No offset-path, no travelling marker. Parties are told
  apart by outline stroke style (A solid, B dashed, C dotted) and labels, not by hue.
  Once pass 9.2 s: set 0-1.4 s, B joins 1.5-3.3 s, C joins 3.7-5.6 s, accent 5.95-6.45 s, bracket under the joined bar and total 53 6.25-6.85 s,
  bracket 6.95-7.7 s, hold 7.8-9.2 s. Phases 1.4,3.6,5.9,6.95,7.8.
  Facts:
  - A government in a parliamentary system needs more than half of the seats; parties without a
    majority can form a coalition: stated principle (the brief's claim, general civics).
  - 100 seats, majority line at 51, Party A 34, Party B 12, Party C 7, other parties 47:
    ILLUSTRATIVE, shown with the "illustrative numbers" tag. "Party A/B/C" are neutral names.
  - 51 = more than half of 100: arithmetic. 53 = 34 + 12 + 7, 47 = 100 - 53, 46 (A+B, drawn, not
    labelled) = 34 + 12: arithmetic on the illustrative values.
  - "2 seats over the line" = 53 - 51: arithmetic.
  - Seat marks: drawing scale, 1 mark = 1 seat = 12 px. -->
