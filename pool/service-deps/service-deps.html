<!-- service-deps (pool, verb nest, archetype graph, domain software). Hand-built; lean style, references/style.md.
  Story: a service graph builds rank by rank, then a third-party outage stays contained to Payments.
  Set-up (reveal, 0-2.55 s): Edge, gateway, Orders and Payments, Inventory and the database, then the
  provider and the event bus, wires drawn on. The outage (2.9-4.8 s), physical, not a colour wash: the
  provider's ring collapses into a smaller dashed outline with a cross (DOWN); the Payments > provider
  wire breaks, its two halves pulling apart so a gap opens where the broken-call mark lands;
  Payments' ring goes dashed (DEGRADED) and its incoming call fails up to the wall. Nothing else
  changes. Hero (5.3-6.6 s, data-anim-focal): a containment outline in a muted danger colour draws slowly around exactly the
  provider and Payments and gets its label "blast radius" (stillness 4.8-5.3 s before it).
  Answer (7.1-8.2 s, stillness 6.6-7.1 s before it): the healthy path (web app, gateway, Orders, Orders DB, event bus and their
  wires) takes the accent as one staggered step, then the last caption. Hold 8.3-9.5 s.
  Verb: nest (one boundary contains the failure). Technique: draw-on (pathLength 100) of wires and of
  one closed outline path; scale about the node centre for the collapse; scaleX of each wire half about
  its outer end for the break (transform-box view-box, px origins, in the local coordinates of the
  layout group); stacked copies cross-faded for node states. No marker travels; no offset-path.
  The graph sits in one group scaled 0.9 and centred (translate 48 40).
  Once pass 9.5 s, phases 2.7 (graph built), 3.7 (provider down), 5.0 (wire broken, Payments
  degraded), 6.9 (outline closed), 8.3 (hold).
  Facts:
  - Node names, edges, edge labels (HTTPS, order.placed), groups (Edge, Core services), the "third
    party" sub-label, captions and the affected set (provider DOWN, Payments DEGRADED, the gateway >
    Payments call affected, the rest healthy): from the previous service-deps entry and its spec.yaml.
  - "blast radius": the entry's own term for the affected part (index tag blast-radius, spec phase
    "blast"). No numbers in this fragment.
  - Dropped as decoration for this story: the sub-labels browser, auth · routing, REST, SQL, pub/sub;
    the captions "Requests enter through the API gateway", "Orders and Inventory publish events" and
    "One request: web app > gateway > Orders > database" (its traced request is gone). -->
