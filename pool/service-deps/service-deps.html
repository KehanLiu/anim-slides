<!-- service-deps: graph archetype, lean restyle (references/style.md) of pool/service-deps.
  14 s cycle: 0-6 s graph builds rank by rank | 6.2-8.6 s one request traced web > gateway > Orders > DB
  | 9-10.6 s provider fails, Payments degrades, the rest is untouched | hold | 13.3 s fade, restart -->
<style>

  --anim-fg:       var(--anim-theme-fg,       #E6EDF0);

  --anim-danger:   var(--anim-theme-danger,   #FF6B6B);

}
.anim-service-deps svg{display:block;width:100%;height:100%}

.anim-service-deps .service-deps-arw-bad{stroke:var(--anim-danger);stroke-width:3}
