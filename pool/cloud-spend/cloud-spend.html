<!-- cloud-spend: chart archetype, lean restyle (references/style.md).
  Plays once, 9.5 s pass: budget and series fade in | trace draws Jan..Dec 0.68-8.16 s | over budget 3.88 s
  | fix tagged at Jul 4.76 s | back under 6.65 s | Dec readout 8.16 s | final state from 8.5 s -->
<style>
.anim-cloud-spend {
  --anim-bg:       var(--anim-theme-bg,       #0F1E27);
  --anim-panel:    var(--anim-theme-panel,    #0D1820);
  --anim-line:     var(--anim-theme-line,     #2A3D49);
  --anim-fg:       var(--anim-theme-fg,       #E6EDF0);
  --anim-muted:    var(--anim-theme-muted,    #93A7B2);
  --anim-accent:   var(--anim-theme-accent,   #34D1BF);
  --anim-accent-2: var(--anim-theme-accent-2, #FF8A3D);
  --anim-ok:       var(--anim-theme-ok,       #8ED7AD);
  --anim-warn:     var(--anim-theme-warn,     #FFD15C);
  --anim-danger:   var(--anim-theme-danger,   #FF6B6B);
  --anim-font:     var(--anim-theme-font,     system-ui, sans-serif);
  --anim-mono:     var(--anim-theme-mono,     ui-monospace, monospace);
  display: block; width: 100%; height: 100%;
}
.anim-cloud-spend svg{display:block;width:100%;height:100%}
/* type */
.anim-cloud-spend .cloud-spend-title{font-family:var(--anim-font);font-size:28px;font-weight:600;fill:var(--anim-fg)}
.anim-cloud-spend .cloud-spend-mono{font-family:var(--anim-mono);font-size:18px;fill:var(--anim-muted)}
.anim-cloud-spend .cloud-spend-stat{font-family:var(--anim-mono);font-size:20px}
.anim-cloud-spend .cloud-spend-big{font-family:var(--anim-mono);font-size:26px;font-weight:600;fill:var(--anim-accent)}
.anim-cloud-spend .cloud-spend-fg{fill:var(--anim-fg)}
.anim-cloud-spend .cloud-spend-ok{fill:var(--anim-ok)}
.anim-cloud-spend .cloud-spend-danger{fill:var(--anim-danger)}
/* frame: thin axes, dotted grid */
.anim-cloud-spend .cloud-spend-grid{stroke:var(--anim-line);stroke-width:2;stroke-dasharray:1 9;stroke-linecap:round;opacity:.4}
.anim-cloud-spend .cloud-spend-axis{fill:none;stroke:var(--anim-line);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.anim-cloud-spend .cloud-spend-tick{stroke:var(--anim-line);stroke-width:2;stroke-linecap:round}
/* reference line */
.anim-cloud-spend .cloud-spend-budget-line{stroke:color-mix(in srgb,var(--anim-muted) 45%,var(--anim-line));stroke-width:2;stroke-dasharray:10 8;stroke-linecap:round}
.anim-cloud-spend .cloud-spend-over{fill:color-mix(in srgb,var(--anim-danger) 10%,transparent)}
/* series */
.anim-cloud-spend .cloud-spend-line{fill:none;stroke:var(--anim-accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.anim-cloud-spend .cloud-spend-dot{fill:var(--anim-accent)}
.anim-cloud-spend .cloud-spend-halo{fill:var(--anim-accent);opacity:.3;filter:blur(5px)}
.anim-cloud-spend .cloud-spend-peak{fill:var(--anim-bg);stroke:var(--anim-danger);stroke-width:2.5}
/* event tag + outlined tags */
.anim-cloud-spend .cloud-spend-lead{stroke:var(--anim-line);stroke-width:2;stroke-dasharray:4 5;stroke-linecap:round}
.anim-cloud-spend .cloud-spend-tag{fill:none;stroke:var(--anim-line);stroke-width:2}

/* resting frame (no .visible): the full year drawn, fix tagged, back under budget */
.anim-cloud-spend .cloud-spend-clip-r{width:1378px}
.anim-cloud-spend .cloud-spend-head{transform:translate(1492px,233.7px)}
.anim-cloud-spend .cloud-spend-s0,.anim-cloud-spend .cloud-spend-s1{opacity:0}
.anim-cloud-spend .cloud-spend-s2{opacity:1}
.anim-cloud-spend .cloud-spend-budget,.anim-cloud-spend .cloud-spend-sg,.anim-cloud-spend .cloud-spend-event,.anim-cloud-spend .cloud-spend-end{opacity:1}

/* ---- motion, only when the slide is visible (plays once, 9.5 s pass) ----
   x(month m) = 150 + 122 (m-1); the trace reaches month m at t = 0.68 + 0.68 (m-1) s.
   over budget at m 5.71 (3.88 s), fix at Jul (4.76 s), back under at m 9.77 (6.65 s), Dec at 8.16 s */
.visible .anim-cloud-spend .cloud-spend-budget{animation:cloud-spend-budget 9.5s 1 forwards}
.visible .anim-cloud-spend .cloud-spend-sg{animation:cloud-spend-sg 9.5s 1 forwards}
.visible .anim-cloud-spend .cloud-spend-clip-r{animation:cloud-spend-clip 9.5s 1 forwards}
.visible .anim-cloud-spend .cloud-spend-head{animation:cloud-spend-head 9.5s 1 forwards}
.visible .anim-cloud-spend .cloud-spend-event{animation:cloud-spend-event 9.5s 1 forwards}
.visible .anim-cloud-spend .cloud-spend-end{animation:cloud-spend-end 9.5s 1 forwards}
.visible .anim-cloud-spend .cloud-spend-s0{animation:cloud-spend-s0 9.5s 1 forwards}
.visible .anim-cloud-spend .cloud-spend-s1{animation:cloud-spend-s1 9.5s 1 forwards}
.visible .anim-cloud-spend .cloud-spend-s2{animation:cloud-spend-s2 9.5s 1 forwards}

/* budget line fades in 0.17-0.51 s, out with the reset 9.86-10.2 s */
@keyframes cloud-spend-budget{
  0%{opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1);}  /* 0s */
  1.79%{opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1);}  /* 0.17s */
  5.37%{opacity:1;animation-timing-function:cubic-bezier(0.3,0,1,1);}  /* 0.51s */
  100%{opacity:1;}  /* 9.5s */
}
/* spend series group: in 0.42-0.68 s, out 9.86-10.2 s */
@keyframes cloud-spend-sg{
  0%{opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1);}  /* 0s */
  4.48%{opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1);}  /* 0.43s */
  7.16%{opacity:1;animation-timing-function:cubic-bezier(0.3,0,1,1);}  /* 0.68s */
  100%{opacity:1;}  /* 9.5s */
}
/* reveal clip: right edge = head x (the dot covers the line end), linear 0.68-8.16 s */
@keyframes cloud-spend-clip{
  0%{width:30px;animation-timing-function:linear;}  /* 0s */
  7.16%{width:30px;animation-timing-function:linear;}  /* 0.68s */
  85.89%{width:1372px;}  /* 8.16s */
  100%{width:1372px;}  /* 9.5s */
}
/* head dot: one stop per month vertex, 0.68 s apart */
@keyframes cloud-spend-head{
  0%{transform:translate(150px,306.8px);animation-timing-function:linear;}  /* 0s */
  7.16%{transform:translate(150px,306.8px);animation-timing-function:linear;}  /* 0.68s */
  14.31%{transform:translate(272px,293.2px);animation-timing-function:linear;}  /* 1.36s */
  21.47%{transform:translate(394px,274.5px);animation-timing-function:linear;}  /* 2.04s */
  28.64%{transform:translate(516px,252.4px);animation-timing-function:linear;}  /* 2.72s */
  35.79%{transform:translate(638px,226.9px);animation-timing-function:linear;}  /* 3.4s */
  42.95%{transform:translate(760px,198px);animation-timing-function:linear;}  /* 4.08s */
  50.11%{transform:translate(882px,157.2px);animation-timing-function:linear;}  /* 4.76s */
  57.26%{transform:translate(1004px,167.4px);animation-timing-function:linear;}  /* 5.44s */
  64.42%{transform:translate(1126px,189.5px);animation-timing-function:linear;}  /* 6.12s */
  71.58%{transform:translate(1248px,211.6px);animation-timing-function:linear;}  /* 6.8s */
  78.73%{transform:translate(1370px,225.2px);animation-timing-function:linear;}  /* 7.48s */
  85.89%{transform:translate(1492px,233.7px);}  /* 8.16s */
  100%{transform:translate(1492px,233.7px);}  /* 9.5s */
}
/* fix event: line, chip and peak tag land as the trace reaches Jul (4.76 s) */
@keyframes cloud-spend-event{
  0%{opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1);}  /* 0s */
  50.11%{opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1);}  /* 4.76s */
  53.68%{opacity:1;animation-timing-function:cubic-bezier(0.3,0,1,1);}  /* 5.1s */
  100%{opacity:1;}  /* 9.5s */
}
/* end readout: Dec value and drop from peak, 8.16-8.5 s */
@keyframes cloud-spend-end{
  0%{opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1);}  /* 0s */
  85.89%{opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1);}  /* 8.16s */
  89.47%{opacity:1;animation-timing-function:cubic-bezier(0.3,0,1,1);}  /* 8.5s */
  100%{opacity:1;}  /* 9.5s */
}
/* status chip: within budget -> over budget (3.88 s) -> back under (6.65 s) -> reset */
@keyframes cloud-spend-s0{
  0%{opacity:1;}  /* 0s */
  39.83%{opacity:1;}  /* 3.78s */
  41.98%{opacity:0;}  /* 3.99s */
  100%{opacity:0;}  /* 9.5s */
}
@keyframes cloud-spend-s1{
  0%{opacity:0;}  /* 0s */
  39.83%{opacity:0;}  /* 3.78s */
  41.98%{opacity:1;}  /* 3.99s */
  68.82%{opacity:1;}  /* 6.54s */
  70.97%{opacity:0;}  /* 6.74s */
  100%{opacity:0;}  /* 9.5s */
}
@keyframes cloud-spend-s2{
  0%{opacity:0;}  /* 0s */
  68.82%{opacity:0;}  /* 6.54s */
  70.97%{opacity:1;}  /* 6.74s */
  100%{opacity:1;}  /* 9.5s */
}

@media (prefers-reduced-motion: reduce) { .anim-cloud-spend * { animation: none !important; } }
</style>
<div class="anim anim-cloud-spend" data-anim="cloud-spend" data-anim-cycle="9.5" data-anim-phases="3.4,4.76,6.12,8.5" data-anim-control="once">
<svg viewBox="0 0 1680 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Monthly cloud spend climbs past a 155 thousand dollar budget, then autoscaling and reserved instances in July bend it back down to 139 thousand by December, under budget again">
  <defs>
