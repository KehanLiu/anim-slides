<style>
.anim-cloud-spend{
  --anim-bg:       var(--anim-theme-bg,       #0f1218);
  --anim-panel:    var(--anim-theme-panel,    #1a2030);
  --anim-line:     var(--anim-theme-line,     #3a4660);
  --anim-fg:       var(--anim-theme-fg,       #eef2f8);
  --anim-muted:    var(--anim-theme-muted,    #9aa7bd);
  --anim-accent:   var(--anim-theme-accent,   #4cc2ff);
  --anim-accent-2: var(--anim-theme-accent-2, #ffb454);
  --anim-ok:       var(--anim-theme-ok,       #3ecf8e);
  --anim-warn:     var(--anim-theme-warn,     #ffb454);
  --anim-danger:   var(--anim-theme-danger,   #ff5d5d);
  --anim-font:     var(--anim-theme-font,     system-ui, sans-serif);
  --anim-mono:     var(--anim-theme-mono,     ui-monospace, monospace);
  display:block;width:100%;height:100%
}
.anim-cloud-spend svg{display:block;width:100%;height:100%}
.anim-cloud-spend .cloud-spend-title{font-family:var(--anim-font);font-size:28px;font-weight:700;fill:var(--anim-fg)}
.anim-cloud-spend .cloud-spend-mono{font-family:var(--anim-mono);font-size:18px;fill:var(--anim-muted)}
.anim-cloud-spend .cloud-spend-big{font-family:var(--anim-mono);font-size:24px;font-weight:700;fill:var(--anim-accent)}
.anim-cloud-spend .cloud-spend-fg{fill:var(--anim-fg)}
.anim-cloud-spend .cloud-spend-a2{fill:var(--anim-accent-2)}
.anim-cloud-spend .cloud-spend-ok{fill:var(--anim-ok)}
.anim-cloud-spend .cloud-spend-danger{fill:var(--anim-danger)}
.anim-cloud-spend .cloud-spend-grid{stroke:var(--anim-line);stroke-width:1.5;opacity:.6}
.anim-cloud-spend .cloud-spend-axis{fill:none;stroke:var(--anim-muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.anim-cloud-spend .cloud-spend-tick{stroke:var(--anim-muted);stroke-width:2;stroke-linecap:round}
.anim-cloud-spend .cloud-spend-budget-line{stroke:var(--anim-accent-2);stroke-width:2.5;stroke-dasharray:10 8;stroke-linecap:round}
.anim-cloud-spend .cloud-spend-over{fill:color-mix(in srgb,var(--anim-danger) 18%,transparent)}
.anim-cloud-spend .cloud-spend-line{fill:none;stroke:var(--anim-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.anim-cloud-spend .cloud-spend-breach{fill:none;stroke:var(--anim-danger);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.anim-cloud-spend .cloud-spend-dot{fill:var(--anim-accent);stroke:var(--anim-bg);stroke-width:2.5}
.anim-cloud-spend .cloud-spend-peak{fill:var(--anim-bg);stroke:var(--anim-danger);stroke-width:2.5}
.anim-cloud-spend .cloud-spend-ev{stroke:var(--anim-ok);stroke-width:2;stroke-dasharray:5 6;stroke-linecap:round}
.anim-cloud-spend .cloud-spend-chip{fill:var(--anim-panel);stroke-width:2;stroke-linejoin:round}
.anim-cloud-spend .cloud-spend-chip-ok{stroke:var(--anim-ok)}
.anim-cloud-spend .cloud-spend-chip-danger{stroke:var(--anim-danger)}

/* resting frame (no .visible): the full year drawn, fix tagged, back under budget */
.anim-cloud-spend .cloud-spend-clip-r{width:1378px}
.anim-cloud-spend .cloud-spend-head{transform:translate(1492px,233.7px)}
.anim-cloud-spend .cloud-spend-s0,.anim-cloud-spend .cloud-spend-s1{opacity:0}
.anim-cloud-spend .cloud-spend-s2{opacity:1}
.anim-cloud-spend .cloud-spend-budget,.anim-cloud-spend .cloud-spend-sg,.anim-cloud-spend .cloud-spend-event,.anim-cloud-spend .cloud-spend-end{opacity:1}

/* ---- motion, only when the slide is visible (cycle 12 s) ----
   x(month m) = 150 + 122 (m-1); the trace reaches month m at t = 0.8 + 0.8 (m-1) s.
   over budget at m 5.71 (4.57 s), fix at Jul (5.6 s), back under at m 9.77 (7.82 s), Dec at 9.6 s */
.visible .anim-cloud-spend .cloud-spend-budget{animation:cloud-spend-budget 12s infinite}
.visible .anim-cloud-spend .cloud-spend-sg{animation:cloud-spend-sg 12s infinite}
.visible .anim-cloud-spend .cloud-spend-clip-r{animation:cloud-spend-clip 12s infinite}
.visible .anim-cloud-spend .cloud-spend-head{animation:cloud-spend-head 12s infinite}
.visible .anim-cloud-spend .cloud-spend-event{animation:cloud-spend-event 12s infinite}
.visible .anim-cloud-spend .cloud-spend-end{animation:cloud-spend-end 12s infinite}
.visible .anim-cloud-spend .cloud-spend-s0{animation:cloud-spend-s0 12s infinite}
.visible .anim-cloud-spend .cloud-spend-s1{animation:cloud-spend-s1 12s infinite}
.visible .anim-cloud-spend .cloud-spend-s2{animation:cloud-spend-s2 12s infinite}

/* budget line fades in 0.2-0.6 s, out with the reset 11.6-12 s */
@keyframes cloud-spend-budget{
  0%,1.67%{opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1)}
  5%,96.67%{opacity:1;animation-timing-function:cubic-bezier(0.3,0,1,1)}
  100%{opacity:0}}
/* spend series group: in 0.5-0.8 s, out 11.6-12 s */
@keyframes cloud-spend-sg{
  0%,4.17%{opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1)}
  6.67%,96.67%{opacity:1;animation-timing-function:cubic-bezier(0.3,0,1,1)}
  100%{opacity:0}}
/* reveal clip: right edge = head x (the dot covers the line end), linear 0.8-9.6 s */
@keyframes cloud-spend-clip{
  0%,6.67%{width:30px;animation-timing-function:linear}
  80%,100%{width:1372px}}
/* head dot: one stop per month vertex, 0.8 s apart */
@keyframes cloud-spend-head{
  0%,6.67%{transform:translate(150px,306.8px);animation-timing-function:linear}
  13.33%{transform:translate(272px,293.2px);animation-timing-function:linear}
  20%{transform:translate(394px,274.5px);animation-timing-function:linear}
  26.67%{transform:translate(516px,252.4px);animation-timing-function:linear}
  33.33%{transform:translate(638px,226.9px);animation-timing-function:linear}
  40%{transform:translate(760px,198px);animation-timing-function:linear}
  46.67%{transform:translate(882px,157.2px);animation-timing-function:linear}
  53.33%{transform:translate(1004px,167.4px);animation-timing-function:linear}
  60%{transform:translate(1126px,189.5px);animation-timing-function:linear}
  66.67%{transform:translate(1248px,211.6px);animation-timing-function:linear}
  73.33%{transform:translate(1370px,225.2px);animation-timing-function:linear}
  80%,100%{transform:translate(1492px,233.7px)}}
/* fix event: line, chip and peak tag land as the trace reaches Jul (5.6 s) */
@keyframes cloud-spend-event{
  0%,46.67%{opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1)}
  50%,96.67%{opacity:1;animation-timing-function:cubic-bezier(0.3,0,1,1)}
  100%{opacity:0}}
/* end readout: Dec value and drop from peak, 9.6-10 s */
@keyframes cloud-spend-end{
  0%,80%{opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1)}
  83.33%,96.67%{opacity:1;animation-timing-function:cubic-bezier(0.3,0,1,1)}
  100%{opacity:0}}
/* status chip: within budget -> over budget (4.57 s) -> back under (7.82 s) -> reset */
@keyframes cloud-spend-s0{
  0%,37.1%{opacity:1}
  39.1%,96.67%{opacity:0}
  100%{opacity:1}}
@keyframes cloud-spend-s1{
  0%,37.1%{opacity:0}
  39.1%,64.1%{opacity:1}
  66.1%,100%{opacity:0}}
@keyframes cloud-spend-s2{
  0%,64.1%{opacity:0}
  66.1%,96.67%{opacity:1}
  100%{opacity:0}}

@media (prefers-reduced-motion: reduce) { .anim-cloud-spend * { animation: none !important; } }
</style>
<div class="anim anim-cloud-spend" data-anim="cloud-spend" data-anim-cycle="12" data-anim-control="loop">
<svg viewBox="0 0 1680 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Monthly cloud spend climbs past a 155 thousand dollar budget, then autoscaling and reserved instances in July bend it back down to 139 thousand by December, under budget again">
  <defs>
    <clipPath id="cloud-spend-clip"><rect class="cloud-spend-clip-r" x="120" y="110" width="1378" height="370"/></clipPath>
  </defs>

  <!-- ================= header ================= -->
  <text class="cloud-spend-title" x="40" y="52">Monthly cloud spend</text>
  <text class="cloud-spend-mono" x="40" y="82">$k per month · last 12 months</text>
  <g class="cloud-spend-s0">
    <rect class="cloud-spend-chip cloud-spend-chip-ok" x="1420" y="34" width="220" height="36" rx="6"/>
    <text class="cloud-spend-mono cloud-spend-ok" x="1530" y="58" text-anchor="middle">within budget</text>
  </g>
  <g class="cloud-spend-s1">
    <rect class="cloud-spend-chip cloud-spend-chip-danger" x="1420" y="34" width="220" height="36" rx="6"/>
    <text class="cloud-spend-mono cloud-spend-danger" x="1530" y="58" text-anchor="middle">over budget</text>
  </g>
  <g class="cloud-spend-s2">
    <rect class="cloud-spend-chip cloud-spend-chip-ok" x="1420" y="34" width="220" height="36" rx="6"/>
    <text class="cloud-spend-mono cloud-spend-ok" x="1530" y="58" text-anchor="middle">back under budget</text>
  </g>

  <!-- ================= axes: y = 470 - 1.7 * $k ================= -->
  <text class="cloud-spend-mono" x="108" y="108" text-anchor="end">$k</text>
  <line class="cloud-spend-grid" x1="120" y1="130" x2="1500" y2="130"/>
  <line class="cloud-spend-grid" x1="120" y1="215" x2="1500" y2="215"/>
  <line class="cloud-spend-grid" x1="120" y1="300" x2="1500" y2="300"/>
  <line class="cloud-spend-grid" x1="120" y1="385" x2="1500" y2="385"/>
  <text class="cloud-spend-mono" x="108" y="136" text-anchor="end">200</text>
  <text class="cloud-spend-mono" x="108" y="221" text-anchor="end">150</text>
  <text class="cloud-spend-mono" x="108" y="306" text-anchor="end">100</text>
  <text class="cloud-spend-mono" x="108" y="391" text-anchor="end">50</text>
  <text class="cloud-spend-mono" x="108" y="476" text-anchor="end">0</text>
  <path class="cloud-spend-axis" d="M 120,122 V 470 H 1500"/>
  <line class="cloud-spend-tick" x1="150" y1="470" x2="150" y2="477"/>
  <line class="cloud-spend-tick" x1="272" y1="470" x2="272" y2="477"/>
  <line class="cloud-spend-tick" x1="394" y1="470" x2="394" y2="477"/>
  <line class="cloud-spend-tick" x1="516" y1="470" x2="516" y2="477"/>
  <line class="cloud-spend-tick" x1="638" y1="470" x2="638" y2="477"/>
  <line class="cloud-spend-tick" x1="760" y1="470" x2="760" y2="477"/>
  <line class="cloud-spend-tick" x1="882" y1="470" x2="882" y2="477"/>
  <line class="cloud-spend-tick" x1="1004" y1="470" x2="1004" y2="477"/>
  <line class="cloud-spend-tick" x1="1126" y1="470" x2="1126" y2="477"/>
  <line class="cloud-spend-tick" x1="1248" y1="470" x2="1248" y2="477"/>
  <line class="cloud-spend-tick" x1="1370" y1="470" x2="1370" y2="477"/>
  <line class="cloud-spend-tick" x1="1492" y1="470" x2="1492" y2="477"/>
  <text class="cloud-spend-mono" x="150" y="502" text-anchor="middle">Jan</text>
  <text class="cloud-spend-mono" x="272" y="502" text-anchor="middle">Feb</text>
  <text class="cloud-spend-mono" x="394" y="502" text-anchor="middle">Mar</text>
  <text class="cloud-spend-mono" x="516" y="502" text-anchor="middle">Apr</text>
  <text class="cloud-spend-mono" x="638" y="502" text-anchor="middle">May</text>
  <text class="cloud-spend-mono" x="760" y="502" text-anchor="middle">Jun</text>
  <text class="cloud-spend-mono" x="882" y="502" text-anchor="middle">Jul</text>
  <text class="cloud-spend-mono" x="1004" y="502" text-anchor="middle">Aug</text>
  <text class="cloud-spend-mono" x="1126" y="502" text-anchor="middle">Sep</text>
  <text class="cloud-spend-mono" x="1248" y="502" text-anchor="middle">Oct</text>
  <text class="cloud-spend-mono" x="1370" y="502" text-anchor="middle">Nov</text>
  <text class="cloud-spend-mono" x="1492" y="502" text-anchor="middle">Dec</text>
  <text class="cloud-spend-mono" x="821" y="540" text-anchor="middle">month →</text>
  <text class="cloud-spend-mono" x="1640" y="584" text-anchor="end" style="fill:var(--anim-muted)">illustrative</text>

  <!-- ================= budget: $155k ================= -->
  <g class="cloud-spend-budget">
    <line class="cloud-spend-budget-line" x1="120" y1="206.5" x2="1500" y2="206.5"/>
    <text class="cloud-spend-mono cloud-spend-a2" x="1512" y="200">budget $155k</text>
  </g>

  <!-- ================= fix event at Jul ================= -->
  <g class="cloud-spend-event">
    <line class="cloud-spend-ev" x1="882" y1="124" x2="882" y2="468"/>
    <rect class="cloud-spend-chip cloud-spend-chip-ok" x="692" y="88" width="380" height="34" rx="6"/>
    <text class="cloud-spend-mono cloud-spend-ok" x="882" y="111" text-anchor="middle">autoscaling + reserved instances</text>
    <circle class="cloud-spend-peak" cx="882" cy="157.2" r="6"/>
    <text class="cloud-spend-mono cloud-spend-danger" x="896" y="150">peak $184k</text>
  </g>

  <!-- ================= spend series ================= -->
  <g class="cloud-spend-sg">
    <g clip-path="url(#cloud-spend-clip)">
      <polygon class="cloud-spend-over" points="724.1,206.5 760,198 882,157.2 1004,167.4 1126,189.5 1219.8,206.5"/>
      <polyline class="cloud-spend-line" points="150,306.8 272,293.2 394,274.5 516,252.4 638,226.9 760,198 882,157.2 1004,167.4 1126,189.5 1248,211.6 1370,225.2 1492,233.7"/>
      <polyline class="cloud-spend-breach" points="724.1,206.5 760,198 882,157.2 1004,167.4 1126,189.5 1219.8,206.5"/>
    </g>
    <circle class="cloud-spend-dot cloud-spend-head" cx="0" cy="0" r="7"/>
  </g>
  <g class="cloud-spend-end">
    <text class="cloud-spend-big" x="1512" y="243">$139k</text>
    <text class="cloud-spend-mono cloud-spend-ok" x="1512" y="268">−24% vs peak</text>
  </g>
</svg>
</div>
