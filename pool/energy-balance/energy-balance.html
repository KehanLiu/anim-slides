<!-- energy-balance (pool, verb balance, archetype compare drawn as a beam balance, domain health). Hand-built; lean style, references/style.md.
  Story: body weight follows the balance between energy taken in and energy used. A beam balance
  stands level and empty. The three components of energy use land one after another on the right
  pan (resting metabolism, activity, digesting food) and the beam dips right with each. Then
  intake from food and drink lands on the left pan as one weight; the beam swings past level and
  settles tilted to the left, intake side down (the hero move). Answer: the top of the intake
  block above the "used" level is marked: +500 kcal a day, stored.
  Verb: balance. Technique: rotate on the beam group about the pivot (800,110); each pan group is
  nested inside the beam and counter-rotated by the same angle about its own hang point (560,110)
  and (1040,110), so the pans hang straight and only translate. transform-box:view-box with px
  origins. Tilt = (energy used on the right - energy in on the left) / 100 kcal, in degrees:
  1,400 -> 14 deg, 1,850 -> 18.5 deg, 2,000 -> 20 deg, then 2,000 - 2,500 = -500 -> -5 deg
  (left side down). Level when equal. Beam half-length 240 so 20 deg fits the slot. Move curve /
  ease-in-out, no overshoot, no wobble.
  Weights: outlined blocks of equal width (170), height proportional to value:
  100 kcal = 10 px (2,500 -> 250 px; 1,400 -> 140; 450 -> 45; 150 -> 15), so the stacks compare
  directly and the 500 kcal surplus is the top 50 px of the intake block.
  Once pass 9.3 s: set 0-0.6 s, use stacks 0.6-4.05 s, intake lands and the beam tips 4.3-6.7 s,
  answer 6.9-8.1 s, hold 8.3-9.3 s. Phases 0.6, 4.2, 6.9, 8.3.
  Facts:
  - Energy balance principle (intake vs expenditure; a surplus is stored): stated qualitative fact,
    standard physiology (the brief's claim).
  - "energy in" = intake from food and drink; "energy used" = resting metabolism, physical activity
    and digesting food (the three standard components of expenditure): stated qualitative facts.
  - 2,500 (intake), 1,400 (resting metabolism), 450 (activity), 150 (digesting food), kcal a day:
    ILLUSTRATIVE, shown with the "illustrative numbers" tag.
  - 2,000 (energy used) = 1,400 + 450 + 150: arithmetic on the illustrative values.
  - +500 kcal a day = 2,500 - 2,000: arithmetic on the illustrative values. No weight change claimed.
  - Tilt angles and block heights: drawing scale, stated above, not data. -->
<style>
.anim-energy-balance{
  --anim-bg:       var(--anim-theme-bg,       #0F1E27);
  --anim-panel:    var(--anim-theme-panel,    #0D1820);
  --anim-line:     var(--anim-theme-line,     #2A3D49);
  --anim-fg:       var(--anim-theme-fg,       #E6EDF0);
  --anim-muted:    var(--anim-theme-muted,    #93A7B2);
  --anim-accent:   var(--anim-theme-accent,   #34D1BF);
  --anim-accent-2: var(--anim-theme-accent-2, #FF8A3D);
  --anim-ok:       var(--anim-theme-ok,       #8ED7AD);
  --anim-warn:     var(--anim-theme-warn,     #FFD15C);
  --anim-danger:   var(--anim-theme-danger,   #FF6B6B);
  --anim-font:     var(--anim-theme-font,     system-ui, sans-serif);
  --anim-mono:     var(--anim-theme-mono,     ui-monospace, monospace);
  display:block;width:100%;height:100%
}
.anim-energy-balance svg{display:block;width:100%;height:100%;max-width:none}
.anim-energy-balance .energy-balance-t{font-family:var(--anim-font);fill:var(--anim-fg)}
.anim-energy-balance .energy-balance-ttl{font-size:26px;font-weight:600}
.anim-energy-balance .energy-balance-lbl{font-size:24px;font-weight:600}
.anim-energy-balance .energy-balance-note{font-size:26px;font-weight:400}
.anim-energy-balance .energy-balance-mono{font-family:var(--anim-mono);font-size:22px;font-weight:400;fill:var(--anim-muted)}
.anim-energy-balance .energy-balance-small{font-size:18px}
.anim-energy-balance .energy-balance-acc{fill:var(--anim-accent)}
.anim-energy-balance .energy-balance-ans{font-size:26px;font-weight:600}
/* structure: thin strokes, no panels */
.anim-energy-balance .energy-balance-post{fill:none;stroke:var(--anim-muted);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.anim-energy-balance .energy-balance-beam-s{fill:none;stroke:var(--anim-fg);stroke-width:2.5;stroke-linejoin:round}
.anim-energy-balance .energy-balance-knob{fill:var(--anim-bg);stroke:var(--anim-fg);stroke-width:2.5}
.anim-energy-balance .energy-balance-level{fill:none;stroke:var(--anim-line);stroke-width:2;stroke-dasharray:6 8;stroke-linecap:round}
.anim-energy-balance .energy-balance-string{fill:none;stroke:var(--anim-muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.anim-energy-balance .energy-balance-tray{fill:none;stroke:var(--anim-fg);stroke-width:2.5;stroke-linejoin:round}
.anim-energy-balance .energy-balance-wt{fill:none;stroke:var(--anim-fg);stroke-width:2.5;stroke-linejoin:round}
.anim-energy-balance .energy-balance-lead{fill:none;stroke:var(--anim-line);stroke-width:2;stroke-linecap:round}
.anim-energy-balance .energy-balance-tag{fill:none;stroke:var(--anim-line);stroke-width:2}
/* answer: the surplus band of the intake block, its glow, the "used" level and the bracket */
.anim-energy-balance .energy-balance-band{fill:color-mix(in srgb,var(--anim-accent) 22%,transparent);stroke:none}
.anim-energy-balance .energy-balance-glow{fill:var(--anim-accent);opacity:.3;filter:blur(8px)}
.anim-energy-balance .energy-balance-cut{fill:none;stroke:var(--anim-accent);stroke-width:2;stroke-dasharray:6 6}
.anim-energy-balance .energy-balance-brk{fill:none;stroke:var(--anim-accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100 120;stroke-dashoffset:0}
/* pivot and hang-point origins (transform-box view-box, px origins; lessons.md) */
.anim-energy-balance .energy-balance-beam{transform-box:view-box;transform-origin:800px 110px}
.anim-energy-balance .energy-balance-pan-l{transform-box:view-box;transform-origin:560px 110px}
.anim-energy-balance .energy-balance-pan-r{transform-box:view-box;transform-origin:1040px 110px}
/* resting frame = the end: intake side down by 5 deg, pans hanging straight, surplus marked */
.anim-energy-balance .energy-balance-beam{transform:rotate(-5deg)}
.anim-energy-balance .energy-balance-pan-l,.anim-energy-balance .energy-balance-pan-r{transform:rotate(5deg)}
.anim-energy-balance .energy-balance-in-wt{stroke:var(--anim-accent)}
.anim-energy-balance .energy-balance-n0,.anim-energy-balance .energy-balance-n1,.anim-energy-balance .energy-balance-n2{opacity:0}

/* ---- motion (9.3 s once pass), only when the slide is visible. percent = s / 9.3 ---- */
/* scene fades in 0-0.5 s */
@keyframes energy-balance-scene{0%{opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1)}5.376%{opacity:1}100%{opacity:1}}
/* beam: level 0-1.1 s; dips right 1.1-1.9 (14deg), 2.45-3.05 (18.5deg), 3.55-4.05 (20deg); swings left 4.9-6.7 s to -5deg (hero) */
@keyframes energy-balance-beam{
  0%{transform:rotate(0deg)}
  11.828%{transform:rotate(0deg);animation-timing-function:cubic-bezier(0.2,0,0,1)}   /* 1.1 s */
  20.43%{transform:rotate(14deg)}                                                      /* 1.9 s */
  26.344%{transform:rotate(14deg);animation-timing-function:cubic-bezier(0.2,0,0,1)}  /* 2.45 s */
  32.796%{transform:rotate(18.5deg)}                                                   /* 3.05 s */
  38.172%{transform:rotate(18.5deg);animation-timing-function:cubic-bezier(0.2,0,0,1)}/* 3.55 s */
  43.548%{transform:rotate(20deg)}                                                     /* 4.05 s */
  52.688%{transform:rotate(20deg);animation-timing-function:cubic-bezier(0.45,0,0.25,1)}/* 4.9 s */
  72.043%{transform:rotate(-5deg)}                                                     /* 6.7 s */
  100%{transform:rotate(-5deg)}}
/* pans: the exact negative of the beam about their hang points, so they hang straight */
@keyframes energy-balance-pan{
  0%{transform:rotate(0deg)}
  11.828%{transform:rotate(0deg);animation-timing-function:cubic-bezier(0.2,0,0,1)}
  20.43%{transform:rotate(-14deg)}
  26.344%{transform:rotate(-14deg);animation-timing-function:cubic-bezier(0.2,0,0,1)}
  32.796%{transform:rotate(-18.5deg)}
  38.172%{transform:rotate(-18.5deg);animation-timing-function:cubic-bezier(0.2,0,0,1)}
  43.548%{transform:rotate(-20deg)}
  52.688%{transform:rotate(-20deg);animation-timing-function:cubic-bezier(0.45,0,0.25,1)}
  72.043%{transform:rotate(5deg)}
  100%{transform:rotate(5deg)}}
/* weights land (drop 28 px and fade in, enter curve) with their labels:
   resting 0.6-1.05 s, activity 2.0-2.4 s, digesting 3.1-3.5 s, intake 4.3-4.8 s */
@keyframes energy-balance-w1{0%{opacity:0;transform:translateY(-28px)}6.452%{opacity:0;transform:translateY(-28px);animation-timing-function:cubic-bezier(0.16,1,0.3,1)}11.29%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(0)}}
@keyframes energy-balance-w2{0%{opacity:0;transform:translateY(-28px)}21.505%{opacity:0;transform:translateY(-28px);animation-timing-function:cubic-bezier(0.16,1,0.3,1)}25.806%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(0)}}
@keyframes energy-balance-w3{0%{opacity:0;transform:translateY(-28px)}33.333%{opacity:0;transform:translateY(-28px);animation-timing-function:cubic-bezier(0.16,1,0.3,1)}37.634%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(0)}}
@keyframes energy-balance-win{0%{opacity:0;transform:translateY(-28px)}46.237%{opacity:0;transform:translateY(-28px);animation-timing-function:cubic-bezier(0.16,1,0.3,1)}51.613%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(0)}}
/* the heavier side takes the accent 6.9-7.3 s */
@keyframes energy-balance-in-wt{0%{stroke:var(--anim-fg)}74.194%{stroke:var(--anim-fg);animation-timing-function:cubic-bezier(0.2,0,0,1)}78.495%{stroke:var(--anim-accent)}100%{stroke:var(--anim-accent)}}
/* surplus band, glow and "used" level appear 6.95-7.4 s */
@keyframes energy-balance-surplus{0%{opacity:0}74.731%{opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1)}79.57%{opacity:1}100%{opacity:1}}
/* bracket draws on 7.35-7.85 s */
@keyframes energy-balance-brk{0%{stroke-dashoffset:101}79.032%{stroke-dashoffset:101;animation-timing-function:cubic-bezier(0.16,1,0.3,1)}84.409%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
/* answer label 7.65-8.1 s */
@keyframes energy-balance-ans{0%{opacity:0}82.258%{opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1)}87.097%{opacity:1}100%{opacity:1}}
/* captions cross-fade: n0 0.1-0.9 s, n1 0.6-4.5 s, n2 4.25-7.2 s, n3 from 7.0 s */
@keyframes energy-balance-n0{0%{opacity:0}1.075%{opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1)}5.376%{opacity:1}6.452%{opacity:1;animation-timing-function:cubic-bezier(0.3,0,1,1)}9.677%{opacity:0}100%{opacity:0}}
@keyframes energy-balance-n1{0%{opacity:0}6.452%{opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1)}11.29%{opacity:1}45.161%{opacity:1;animation-timing-function:cubic-bezier(0.3,0,1,1)}48.387%{opacity:0}100%{opacity:0}}
@keyframes energy-balance-n2{0%{opacity:0}45.699%{opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1)}51.075%{opacity:1}74.194%{opacity:1;animation-timing-function:cubic-bezier(0.3,0,1,1)}77.419%{opacity:0}100%{opacity:0}}
@keyframes energy-balance-n3{0%{opacity:0}75.269%{opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1)}80.645%{opacity:1}100%{opacity:1}}

.visible .anim-energy-balance .energy-balance-n3{animation:energy-balance-n3 9.3s linear 1 both}

@media (prefers-reduced-motion: reduce) { .anim-energy-balance * { animation: none !important; } }
</style>
<div class="anim anim-energy-balance" data-anim="energy-balance" data-anim-cycle="9.3" data-anim-control="once" data-anim-phases="0.6,4.2,6.9,8.3" data-anim-verb="balance">
