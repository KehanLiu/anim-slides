<!-- oxbow-lake (pool, verb transform, form plan-view scene, domain earth science). Hand-built (geometry
  generated, then checked by eye); lean style, references/style.md.
  Story: a river seen from above. Its gentle bend grows into a tight loop with a narrow neck; in a flood
  the river cuts through the neck and takes the short new course; deposition seals the ends of the old
  loop, which is left behind as a crescent-shaped oxbow lake. A dashed ghost keeps the line of the first
  bend. Once-play pass 9.6 s, hold 8.35-9.6 s.
  Verb: transform. The river's own outline changes shape in place (gentle bend -> tight loop -> lake
  plus straight course). The river is drawn in neutral tones; only the cut-off channel and, at the
  end, the new course between the old neck ends carry the accent.
  Technique (references/motion-verbs.md section 5, Morph): every river path keeps the same commands
  (M + cubic C segments) in every state and is drawn twice (a wide bank stroke under a narrower water
  stroke, all banks before all water so pieces join without seams). Base rule: stacked copies of the
  river (gentle bend, pronounced bend, tight loop, final loop + course) cross-faded, plus the cut
  channel drawn on at the neck, so a browser without CSS d animation shows a correct pass and the
  same finished still. Inside @supports (d: path("M0 0")) the gentle and pronounced copies are hidden; the
  tight-loop copy becomes the one morphing river (d: gentle -> pronounced -> tight). After the cut it
  hands over in 0.1 s to two pieces in the same geometry, the loop and the course (left reach + cut
  channel + right reach as one path), which morph together: the loop seals off and pulls away, the
  course straightens. At most three shapes move at once; their d attributes hold the final state, so the resting frame,
  the reduced-motion still and the last frame of the pass are the same picture.
  Facts (textbook physical geography, no source numbers; every shape is schematic):
  - "meander", "outer bank: erosion", "inner bank: deposition": a meandering river erodes the outer
    bank of a bend (cut bank) and deposits sediment on the inner bank (point bar). Stated fact (brief).
  - the bend grows tighter and its neck narrows; label "neck". Stated fact (brief).
  - "cut-off", "new course": in a flood the river breaks through the neck and takes the shorter,
    straighter course. Stated fact (brief).
  - "oxbow lake": deposition seals the ends of the abandoned loop, which remains as a crescent-shaped
    lake. Stated fact (brief).
  - No numbers, dates, rates or place names. Sizes and the timing of the stages are illustrative and
    carry no scale; nothing is measured, so no illustrative tag. -->
