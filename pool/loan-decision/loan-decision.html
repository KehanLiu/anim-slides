<!-- loan-decision (pool, archetype graph, domain finance). Hand-built.
  Story: two alternative inputs (apply online OR in a branch) merge at an OR junction into a real
  decision diamond. Application 1 passes the credit check; the yes branch forks into a group whose
  two checks run in parallel (progress bars of different length) and join into a loan offer.
  Application 2 fails the check; the no branch leads to a decline and a reason letter. The idle path
  dims while the other is told. Scores are illustrative. Cycle 13 s, hold 10.9-12.6 s. -->
