<!-- mitosis (pool, verb split, archetype states drawn as one cell, domain biology). Hand-built; lean style, references/style.md.
  Story: one cell divides into two cells, each with a full copy of the chromosomes. Prophase: the
  copied chromosomes (X shapes, two sister chromatids each) condense, scattered in the cell; the
  spindle poles are present. Metaphase: the chromosomes move one after another to the middle of the
  cell and spindle fibres draw on to them. Anaphase (the hero): every X comes apart, its two
  chromatids pulled to opposite poles while the fibres shorten. Telophase: a nucleus forms at each
  pole. Cytokinesis: the outline pinches at the middle into two cells that move slightly apart.
  Verb: split. Technique: each chromatid is its own path from the start (nothing is swapped). The
  four left chromatids, the left fibres, the left nucleus and the left daughter outline sit in one
  group (.mitosis-gl) that is pulled to the pole by scaleX(0.4) about the pole (520,300) with
  transform-box:view-box; the fibres converge on the pole, so scaling about it shortens each fibre
  exactly to its chromatid. vector-effect:non-scaling-stroke keeps every stroke at its width; the
  nucleus and daughter outlines are drawn pre-stretched (x 1/0.4) so they render as circles. Mirror
  group on the right about (1160,300). One track per group, so anaphase is two moving things.
  Colour (accent on the separating chromatids, kept to the end) rides `color` on the same groups (currentColor).
  Pinch: base rule = cross-fade from the parent outline to the two daughter outlines; inside
  @supports (d: path("M0 0")) the parent outline morphs (d, same 8 cubic commands) from the ellipse
  to two touching circles, then hands over to the daughter outlines, which are drawn on those
  circles. Line-up runs one chromosome at a time (0.45 s each) so at most two chromatids move at once.
  Once pass 10 s: prophase 0-1.0, metaphase 1.0-3.8, anaphase 3.8-5.75, telophase 5.75-6.5,
  stillness 6.5-6.95, cytokinesis 6.95-9.1 (caption swap 6.95, pinch 7.2-8.2, apart 8.35-9.1), hold 9.15-10.
  At rest the chromatids (the focal split) keep the accent; the daughter outlines stay in --anim-line like the parent. Phases 1, 3.8, 5.75, 6.75, 9.15.
  Facts:
  - Before mitosis the chromosomes are copied, so each is two sister chromatids; prophase: chromosomes
    condense, spindle forms; metaphase: line up at the middle; anaphase: sister chromatids separate and
    are pulled to opposite poles; telophase: a nucleus forms at each pole; cytokinesis: the cell
    pinches in two, giving two daughter cells with the same chromosomes: stated textbook cell biology
    (the brief's facts). Phase names, "sister chromatids", "spindle", "two daughter cells": stated terms.
  - 4 chromosomes: schematic choice, written on the slide as "schematic: 4 chromosomes shown"; no
    human chromosome number, no timings, no sizes. Positions, distances and the 0.4 pull are drawing
    choices, not data. -->
