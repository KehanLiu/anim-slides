<!-- forgetting-curve (pool, verb trace with mark as the supporting move, archetype chart, form line-chart, domain education). Hand-built; lean style, references/style.md.
  Story: without review, what you learned fades fast and then levels off; each review lifts it back
  up, and after each review it fades more slowly. Two thin axes; the no-review curve draws on from
  the top left, falling steeply and flattening low, then drops to a dashed muted ghost that stays.
  The hero: the review line traces in the accent as one continuous path from left to right. It
  follows the same start; at each of three review moments (tick and label on the time axis)
  it jumps back to the top and falls again, each time less steeply, so the three teeth get
  visibly flatter. It pauses after each step. Answer: a bracket drawn on at the right edge marks
  the gap between the end of the review line and the end of the ghost: "kept with review".
  Verb: trace (main), mark (support). No head dot, no offset-path, no travelling marker: the line is the motion.
  Technique: draw-on by stroke-dashoffset with pathLength="100" and dasharray 100 120; the review
  path is one path whose dashoffset keyframes stop at the end of each tooth (linear between stops,
  so the drawing speed is even across all three steps). The no-review line is a solid draw-on copy
  that fades out while the dashed ghost fades in.
  Curves: generated by a throwaway script from exponential decays toward a common floor,
  R = 0.18 + 0.82 * exp(-(t - t_i) / tau_i), restarted at R = 1 at each review, with tau growing
  0.075 -> 0.15 -> 0.3 -> 0.6 (fractions of the time axis); reviews at 0.15, 0.36, 0.62 of the axis.
  These are drawing parameters of a schematic, not data.
  Once pass 10.0 s: set 0-3.0 s (axes, no-review curve, ghost), hero 3.15-8.40 s (three steps,
  0.55 s and 0.8 s pauses, the last a 0.42 s stillness after the tick), answer 8.43-9.12 s, hold 9.15-10.0 s. Phases 3.0,5.33,6.86,9.15.
  Facts:
  - Shape of the forgetting curve (retention drops steeply at first, then flattens): Hermann
    Ebbinghaus, Ueber das Gedaechtnis, 1885 (year checked on the web: en.wikipedia.org/wiki/Forgetting_curve).
  - Each review lifts retention back up and forgetting after each review is slower (spacing effect): stated
    qualitative fact (the brief's claim).
  - "retention", "time since learning", "all", "learned", "no review", "with reviews", "kept with review",
    "review 1/2/3": axis and line labels, no values. Three reviews: the brief.
  - No numbers on the axes; every curve height, review position and decay rate is SCHEMATIC, carried
    by the visible tag "schematic, no measured values". -->
