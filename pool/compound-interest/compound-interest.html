<!-- compound-interest (pool, verb grow + count, archetype chart drawn as columns, domain finance). Hand-built; lean style, references/style.md.
  Story: 1,000 left alone at 5 % a year. Four columns stand on one baseline at year 0, 10, 20 and 30;
  each holds the original 1,000 as a quiet base of constant height (sides only, its top is the dashed
  ghost line at the 1,000 level). The interest part of each column then rises from that line, one
  column after another, to its true height; the value riding the top counts up year by year in step
  with the height (each yearly balance shows as the top passes its level) and lands on the
  column's own value exactly as the bar lands. Answer: a tie at the previous column's
  level and a bracket mark each decade's gain, +629, +1,024, +1,669, drawn on in order; the last and
  largest takes the accent.
  Verb: grow (supporting: count). Technique: interest part (faint tint + two sides) is a scaleY 0 -> 1
  about the 1,000 level (transform-box view-box, px origin 387.50); the cap and its value ride the
  top as a translateY on the same curve (move curve cubic-bezier(0.2,0,0,1), no overshoot); the value is a digit strip
  (one <text> per value under a clipPath window inside the cap group) moved by translateY in
  steps(1,end), one row per year: it switches to year n's balance exactly when the rising top
  passes that balance's height (crossing times solved from the move curve); the last row
  (the column's own value) at the landing time. Passing values muted, the landed value in fg.
  Brackets: pathLength draw-on. No travelling marker, no offset-path.
  Scale: 0.0925 px per 1 unit of money (4,322 -> 399.8 px), baseline y 480. Heights:
  1,000 -> 92.50 px, 1,629 -> 150.68 px, 2,653 -> 245.40 px, 4,322 -> 399.78 px.
  Once pass 9.2 s: set 0-0.54 s (axis draws on, the 1,000 bases rise from the baseline, ghost
  wipes in from the left, labels settle with a 10 px rise); hero 0.6-5.5 s (column 10 0.6-1.8,
  column 20 2.2-3.5, column 30 3.9-5.5, its value counting up at hero size, the focal element);
  caption 1 out 5.65-5.85; stillness 5.85-6.35; answer 6.35-8.0 (brackets 6.35-6.8, 6.85-7.3,
  7.4-7.9, labels follow with a rise, caption 2 cross-fades in); hold 8.1-9.2 s.
  Phases 0.55,2,3.7,5.6,8.1.
  Facts:
  - 5 % a year: ILLUSTRATIVE example rate, shown with the "illustrative rate" tag; no currency unit.
  - 1,000 start: illustrative amount (the brief's claim).
  - 1,629 / 2,653 / 4,322: arithmetic, 1000 x 1.05^n for n = 10, 20, 30 (annual compounding) =
    1,628.89 / 2,653.30 / 4,321.94, rounded.
  - +629 / +1,024 / +1,669: arithmetic, differences of the rounded values.
  - Passing values in the counter (1,050, 1,103, ... ): arithmetic, 1000 x 1.05^n for each year
    n, rounded; shown only while the bar passes that height.
  - "interest added yearly", "interest earns interest": the claim's mechanism (annual
    compounding), stated in the brief. No inflation, tax or product claims.
  - Column heights: drawing scale above, at true proportion; bracket positions follow from it. -->
