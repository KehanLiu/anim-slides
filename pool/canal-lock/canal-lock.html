<!-- canal-lock (pool, archetype states as a physical scene, domain engineering/transport). Hand-built; lean restyle, references/style.md.
  Story: a boat enters a lock chamber at the lower level, the lower gates close, the filling valve
  opens, water from the upper canal lifts chamber and boat, the upper gates open and the boat leaves
  one level higher. A dashed ghost keeps the start level. Once-play pass 9.5 s, final hold 8.5-9.5 s.
  Technique: transforms on SVG groups use transform-box:view-box with px transform-origin; the level
  is a scaleY on a rect about the chamber floor (no CSS d morphing, which Safari lacks). -->
<style>

  --anim-fg:       var(--anim-theme-fg,       #E6EDF0);

  display:block;width:100%;height:100%
}
