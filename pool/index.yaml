# Pool of finished, checked fragments. One entry per folder: pool/<name>/<name>.html,
# plus thumb.png (resting frame) and, where it exists, spec.yaml.
# Agents: match on archetype, domain and tags first, then read the story; open only the fragment you pick.
# All entries: data-anim-control="loop", CSS only, pass check_fragment.py at viewBox width.

- name: deploy-pipeline
