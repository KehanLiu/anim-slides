# Pool of finished, checked fragments. One entry per folder: pool/<name>/<name>.html,
# plus thumb.png (resting frame) and, where it exists, spec.yaml.
# Agents: match on form and moves first (the picture the slide needs, the motion that shows it), then archetype,
# domain and tags; then read the story and open only the fragment you pick. form = the picture's shape, moves = the
# motion techniques it demonstrates (vocabulary in README.md).
# All entries: data-anim-control="once" by default (one pass of `cycle` seconds, ends on the resting frame), CSS only,
# pass check_fragment.py at viewBox width. Every entry is step-capable: `phases` repeats the wrapper's
# data-anim-phases (stop marks in seconds, the last = finished figure), so integrate_fragment.py --control step
# switches it to presenter-driven steps without touching the file.

