<!-- job-states (pool, verb switch, archetype states drawn as one job ticket, domain software). Hand-built; lean style, references/style.md.
  Story: one job changes state: it is queued, picked, fails with a timeout, waits out a 2 s backoff
  and succeeds on the second attempt. The job does not go anywhere; it changes condition in place.
  Hero: one job ticket in the centre (a sheet with a folded corner, an id line, a status word and
  an attempt counter). At each event its outline and status word switch: Queued (dashed, muted),
  Running (solid, accent), Failed (solid, danger), Queued again for the backoff (dashed, with a thin
  timer arc that draws on once next to "retry · 2 s"), Running with the counter stepping from
  "attempt 1 of 3" to "attempt 2 of 3", Succeeded (solid, ok, the one glow on the word). The
  failure (1.0 s) and the success (1.1 s) are the two slowest, clearest switches.
  Support: a small state map on the left (the same four state names, thin arcs, no token) on which
  only the current state is lit, 100 ms after the ticket; the event log on the right gains one line
  100 to 150 ms after the change it records.
  Verb: switch. Technique: stacked copies (outline + status word per state) cross-faded with
  opacity, one full-pass track each; timer arc by stroke-dashoffset draw-on (pathLength 100,
  linear because it tracks time); counter as two stacked texts cross-faded.
  Once pass 9.8 s: set 0-0.5; picked 1.0-1.5; error 2.3-3.3; retry 4.0-4.5 and backoff timer (in 4.45-4.7, draws
  4.6-5.5, out 5.5-5.65); picked again 5.8-6.3 and counter 6.35-6.7; exit 0 7.3-8.4; log lines after each; hold
  8.8-9.8. Phases 0.7, 2.0, 3.8, 5.7, 7.1, 8.8.
  Colours: accent = running (the active state); danger = failed; ok = succeeded (exit 0). No other.
  Facts:
  - State names Queued, Running, Failed, Succeeded; transitions picked, error, retry · 2 s, exit 0;
    "attempt 1 of 3" / "attempt 2 of 3"; job 4812; log times 00:00, 00:02, 00:31, 00:33, 00:35,
    00:58 and log texts: kept verbatim from the previous version of this entry, all ILLUSTRATIVE
    (a generic job queue with retry and backoff), shown with the "illustrative" tag.
  - 2 s backoff = 00:35 - 00:33: consistent with the log (arithmetic on the illustrative values).
  - Timer arc length and timings: drawing, not data. -->
