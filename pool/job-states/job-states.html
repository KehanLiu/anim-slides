<!-- job-states: states archetype, hand-tuned from pool/job-states/spec.yaml (scaffold, then rebuilt for layout and story).
  12 s cycle: queued > running (attempt 1) > failed > retry > queued > running (attempt 2) > succeeded
  | one token per hop, event log fills in | 9.4-11.5 s hold | 11.5 s reset -->
<style>
.anim-job-states {
  --anim-bg:       var(--anim-theme-bg,       #0f1218);
  --anim-panel:    var(--anim-theme-panel,    #1a2030);
  --anim-line:     var(--anim-theme-line,     #3a4660);
  --anim-fg:       var(--anim-theme-fg,       #eef2f8);
  --anim-muted:    var(--anim-theme-muted,    #9aa7bd);
  --anim-accent:   var(--anim-theme-accent,   #4cc2ff);
  --anim-accent-2: var(--anim-theme-accent-2, #ffb454);
  --anim-ok:       var(--anim-theme-ok,       #3ecf8e);
  --anim-warn:     var(--anim-theme-warn,     #ffb454);
  --anim-danger:   var(--anim-theme-danger,   #ff5d5d);
  --anim-font:     var(--anim-theme-font,     system-ui, sans-serif);
  --anim-mono:     var(--anim-theme-mono,     ui-monospace, monospace);
  display: block; width: 100%; height: 100%;
}
.anim-job-states svg{display:block;width:100%;height:100%}
.anim-job-states .job-states-c-acc{--job-states-k:var(--anim-accent)}
.anim-job-states .job-states-c-ok{--job-states-k:var(--anim-ok)}
.anim-job-states .job-states-c-bad{--job-states-k:var(--anim-danger)}
.anim-job-states .job-states-c-wn{--job-states-k:var(--anim-warn)}
.anim-job-states .job-states-lbl{font-family:var(--anim-font);font-size:22px;font-weight:600;fill:var(--anim-fg)}
.anim-job-states .job-states-sub{font-family:var(--anim-mono);font-size:18px;fill:var(--anim-muted)}
.anim-job-states .job-states-albl{font-family:var(--anim-mono);font-size:18px;fill:var(--anim-muted)}
.anim-job-states .job-states-albl-on{fill:var(--job-states-k);font-weight:700}
.anim-job-states .job-states-arc{fill:none;stroke:var(--anim-line);stroke-width:2.5;stroke-linecap:round}
.anim-job-states .job-states-arc-evt{stroke-dasharray:3 8}
.anim-job-states .job-states-arw{fill:var(--anim-line)}
.anim-job-states .job-states-arc-on{fill:none;stroke:var(--job-states-k);stroke-width:3;stroke-linecap:round}
.anim-job-states .job-states-arw-on{fill:var(--job-states-k)}
.anim-job-states .job-states-pill{fill:var(--anim-panel);stroke:var(--anim-line);stroke-width:2}
.anim-job-states .job-states-pill-on{fill:color-mix(in srgb,var(--job-states-k) 16%,var(--anim-panel));stroke:var(--job-states-k);stroke-width:3}
.anim-job-states .job-states-chk{fill:none;stroke:var(--anim-ok);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.anim-job-states .job-states-tok{fill:var(--job-states-k);stroke:var(--anim-bg);stroke-width:3;offset-rotate:0deg}
.anim-job-states .job-states-panel{fill:var(--anim-panel);stroke:var(--anim-line);stroke-width:1.5}
.anim-job-states .job-states-title{font-family:var(--anim-font);font-size:22px;font-weight:700;fill:var(--anim-fg)}
.anim-job-states .job-states-ts{font-family:var(--anim-mono);font-size:18px;fill:var(--anim-muted)}
.anim-job-states .job-states-ev{font-family:var(--anim-mono);font-size:18px}
.anim-job-states .job-states-t-fg{fill:var(--anim-fg)}
.anim-job-states .job-states-t-rd{fill:var(--anim-danger)}
.anim-job-states .job-states-t-wn{fill:var(--anim-warn)}
.anim-job-states .job-states-t-gn{fill:var(--anim-ok)}
/* resting frame = end of the story: job succeeded on attempt 2, full event log visible.
   Layers that belong only to earlier phases rest at opacity 0. */
.anim-job-states .job-states-on-exit,.anim-job-states .job-states-hot-done,.anim-job-states .job-states-att2,.anim-job-states .job-states-log0,.anim-job-states .job-states-log1,.anim-job-states .job-states-log2,.anim-job-states .job-states-log3,.anim-job-states .job-states-log4,.anim-job-states .job-states-log5{opacity:1}
.anim-job-states .job-states-tk-h1,.anim-job-states .job-states-tk-h2,.anim-job-states .job-states-tk-h3,.anim-job-states .job-states-tk-h4,.anim-job-states .job-states-tk-h5,.anim-job-states .job-states-on-picked,.anim-job-states .job-states-on-error,.anim-job-states .job-states-on-retry,.anim-job-states .job-states-hot-queued,.anim-job-states .job-states-hot-running,.anim-job-states .job-states-hot-failed,.anim-job-states .job-states-att1{opacity:0}

@keyframes job-states-tk-h5{0%,68.75%{opacity:0;offset-distance:0%}70%{opacity:1;offset-distance:0%}78.33%{opacity:1;offset-distance:100%}79.58%,100%{opacity:0;offset-distance:100%}}
@keyframes job-states-on-picked{0%,8.33%{opacity:0}10.42%,18.33%{opacity:1}19.69%,55%{opacity:0}57.08%,65%{opacity:1}66.35%,100%{opacity:0}}
@keyframes job-states-on-error{0%,28.33%{opacity:0}30.42%,38.33%{opacity:1}39.68%,100%{opacity:0}}

@keyframes job-states-on-exit{0%,70%{opacity:0}72.08%,95.83%{opacity:1}97.18%,100%{opacity:0}}
@keyframes job-states-hot-queued{0%,8.33%{opacity:1}9.69%,51.67%{opacity:0}53.75%,55%{opacity:1}56.35%,97.5%{opacity:0}100%{opacity:1}}

@keyframes job-states-hot-failed{0%,36.67%{opacity:0}38.75%,43.33%{opacity:1}44.68%,100%{opacity:0}}

@keyframes job-states-att2{0%,63.33%{opacity:0}65.83%,95.83%{opacity:1}98.33%,100%{opacity:0}}
@keyframes job-states-log0{0%,1.67%{opacity:0}4.17%,95.83%{opacity:1}98.33%,100%{opacity:0}}
@keyframes job-states-log1{0%,16.67%{opacity:0}19.17%,95.83%{opacity:1}98.33%,100%{opacity:0}}
@keyframes job-states-log2{0%,36.67%{opacity:0}39.17%,95.83%{opacity:1}98.33%,100%{opacity:0}}
@keyframes job-states-log3{0%,51.67%{opacity:0}54.17%,95.83%{opacity:1}98.33%,100%{opacity:0}}
