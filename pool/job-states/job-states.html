<!-- job-states: states archetype, hand-tuned from pool/job-states/spec.yaml (scaffold, then rebuilt for layout and story).
  Plays once, 9.8 s pass: queued > running (attempt 1) > failed > retry > queued > running (attempt 2) > succeeded
  | one token per hop, event log fills in | final state from 8.7 s
  Names, numbers and times are illustrative examples. -->
<style>
.anim-job-states {
  --anim-bg:       var(--anim-theme-bg,       #0F1E27);
  --anim-panel:    var(--anim-theme-panel,    #0D1820);
  --anim-line:     var(--anim-theme-line,     #2A3D49);
  --anim-fg:       var(--anim-theme-fg,       #E6EDF0);
  --anim-muted:    var(--anim-theme-muted,    #93A7B2);
  --anim-accent:   var(--anim-theme-accent,   #34D1BF);
  --anim-accent-2: var(--anim-theme-accent-2, #FF8A3D);
  --anim-ok:       var(--anim-theme-ok,       #8ED7AD);
  --anim-warn:     var(--anim-theme-warn,     #FFD15C);
  --anim-danger:   var(--anim-theme-danger,   #FF6B6B);
  --anim-font:     var(--anim-theme-font,     system-ui, sans-serif);
  --anim-mono:     var(--anim-theme-mono,     ui-monospace, monospace);
  display: block; width: 100%; height: 100%;
}
.anim-job-states svg{display:block;width:100%;height:100%}
/* lean style (references/style.md): states are rings with a line glyph and the label outside,
   transitions are thin arcs with the label sitting on the arc, the job is a glowing dot,
   the event log is plain mono lines with no panel */
.anim-job-states .job-states-c-acc{--job-states-k:var(--anim-accent)}
.anim-job-states .job-states-c-ok{--job-states-k:var(--anim-ok)}
.anim-job-states .job-states-c-bad{--job-states-k:var(--anim-danger)}
.anim-job-states .job-states-lbl{font-family:var(--anim-font);font-size:26px;font-weight:600;fill:var(--anim-fg)}

.anim-job-states .job-states-albl{font-family:var(--anim-mono);font-size:19px;fill:var(--anim-muted)}
.anim-job-states .job-states-albl-on{fill:var(--job-states-k)}
.anim-job-states .job-states-arc{fill:none;stroke:var(--anim-line);stroke-width:2.5;stroke-linecap:round}
.anim-job-states .job-states-arc-evt{stroke-dasharray:4 9}
.anim-job-states .job-states-arw{fill:none;stroke:var(--anim-line);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.anim-job-states .job-states-arc-on{fill:none;stroke:var(--job-states-k);stroke-width:3;stroke-linecap:round}
.anim-job-states .job-states-arw-on{fill:none;stroke:var(--job-states-k);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.anim-job-states .job-states-ring{fill:var(--anim-bg);stroke:color-mix(in srgb,var(--anim-muted) 55%,var(--anim-bg));stroke-width:2.5}
.anim-job-states .job-states-glyph{fill:none;stroke:var(--anim-muted);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.anim-job-states .job-states-ring-on{fill:color-mix(in srgb,var(--job-states-k) 14%,var(--anim-bg));stroke:var(--job-states-k);stroke-width:3}
.anim-job-states .job-states-glyph-on{stroke:var(--job-states-k)}
.anim-job-states .job-states-halo{fill:none;stroke:var(--job-states-k);stroke-width:12;stroke-opacity:.3;filter:blur(6px)}
.anim-job-states .job-states-tok{fill:var(--job-states-k);stroke:var(--job-states-k);stroke-width:12;stroke-opacity:.3;offset-rotate:0deg}
.anim-job-states .job-states-title{font-family:var(--anim-mono);font-size:19px;fill:var(--anim-muted);letter-spacing:.04em}
.anim-job-states .job-states-ts{font-family:var(--anim-mono);font-size:19px;fill:var(--anim-muted)}
.anim-job-states .job-states-ev{font-family:var(--anim-mono);font-size:19px}
.anim-job-states .job-states-t-fg{fill:var(--anim-fg)}
.anim-job-states .job-states-t-rd{fill:var(--anim-danger)}
.anim-job-states .job-states-t-gn{fill:var(--anim-ok)}
.anim-job-states .job-states-gap{fill:var(--anim-bg)}
