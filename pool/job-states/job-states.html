<!-- job-states (pool, verb switch, archetype states drawn as one job ticket, domain software). Hand-built; lean style, references/style.md.
  Story: one job changes state: it is queued, picked, fails with a timeout, waits out a 2 s backoff
  and succeeds on the second attempt. The job does not go anywhere; it changes condition in place.
  Hero: one job ticket (a sheet with a folded corner, outline only). Each state has its own shape:
  Queued = dashed muted outline, the ticket resting 20 px low; Running = solid outline, ticket
  raised, a progress stroke drawing along the attempt's row; Failed = the progress stroke stops
  short, turns danger and a cross draws on, outline danger; Queued again = dashed and low, with a
  thin timer arc drawing once in row 2 next to "retry · 2 s"; Running again = a second progress
  stroke in row 2 (the counter steps to "attempt 2 of 3" at that same moment); Succeeded = the
  second stroke completes, turns accent, a tick draws on, outline accent, the one glow on the word.
  Support: a state map at the left (the four state names, thin arcs, no token) lights the current
  state just after the ticket changes; the event log gains its line 100 to 150 ms after that.
  Verb: switch. Technique: one outline path whose stroke colour, dash and width switch at each
  cause; translateY on the ticket group; stacked status words, counters and coloured stroke copies
  cross-faded (opacity); progress, cross, tick and timer by stroke-dashoffset draw-on (pathLength
  100; the timer linear because it tracks time).
  Once pass 9.8 s: set 0-0.45; picked 0.55-1.05; run 1 1.6-2.6; error 2.6-3.3 (cross 2.8-3.3);
  retry 4.2-4.6, timer 4.9-5.5; picked again 5.8-6.3; run 2 6.4-7.4; exit 0 7.5-8.3; map and log
  lines follow each change; hold 9.0-9.8. Phases 0.5, 4, 5.7, 7.45, 9.
  Colours: foreground = queued/running; danger = failed; accent = succeeded (the outcome). No other.
  Facts:
  - State names Queued, Running, Failed, Succeeded; transitions picked, error, retry · 2 s, exit 0;
    "attempt 1 of 3" / "attempt 2 of 3"; job 4812; log times 00:00, 00:02, 00:31, 00:33, 00:35,
    00:58 and log texts: kept verbatim from the previous version of this entry, all ILLUSTRATIVE
    (a generic job queue with retry and backoff), shown with the "illustrative" tag.
  - Row numbers 1 and 2 = the attempt numbers above. 2 s backoff = 00:35 - 00:33 (arithmetic).
  - Progress stroke lengths (attempt 1 stops about halfway), timer arc and timings: drawing, not
    data; the source does not say how far attempt 1 got. -->
