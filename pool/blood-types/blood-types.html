<!-- blood-types (pool, verb sort + count, domain health). Hand-built (written once by a throwaway script, then kept static).
  Story: one crowd of 100 people (1 ring = 1 person) sorts itself by ABO blood group. Every ring moves
  on its own track from its cell in the 10 x 10 crowd to its cell in its group: group O slides out to
  the left, group A drops into the middle, B and AB travel right and drop into place. Each group ends
  as a block of columns of five on one baseline, so its size reads at a glance; then each group takes
  its label, its count steps up to the number, and the largest group (O) takes the accent.
  Once-play pass 9.9 s, hold 8.95-9.9 s.
  Verb: sort (main), count (support, after the rings have settled).
  Technique: one keyframe track per ring (appear by crowd row, then its own move: `translate` for the
  across leg, `transform: translateY` for the down leg, overlapped into a soft corner); one
  data-anim-series per group, rings 14-90-110 ms apart, groups staged O, A, B, AB; crowd cells are
  assigned so each group's paths are parallel and never cross (checked in a 10 ms simulation, closest
  approach one grid pitch). No ring is swapped for another. Counts are digit strips under a clipPath.
  Facts:
  - O 44, A 42, B 10, AB 4 of every 100: Stanford Blood Center, "Blood Types" page (US population,
    citing the AABB Technical Manual, 18th ed.): O+ 37.4 % + O- 6.6 % = 44.0 %; A+ 35.7 % + A- 6.3 % =
    42.0 %; B+ 8.5 % + B- 1.5 % = 10.0 %; AB+ 3.4 % + AB- 0.6 % = 4.0 %. The ABO totals are arithmetic
    on those eight figures and sum to exactly 100, so no rounding was needed. (A commonly quoted Red
    Cross rounding is 45/40/11/4; the Red Cross page could not be fetched, so the Stanford figures are
    used.) Rh types are not shown; no compatibility claim is made.
  - "approximate shares, United States": the source calls its figures estimates for the US population.
  - Intermediate count values (0, 10, 20, 30, 40; 0, 5; 0, 2) are round values on the way to the
    stated number (motion-verbs.md, count), not data.
  - Which crowd cell holds which person is arbitrary and carries no meaning. -->
