<!-- blood-types (pool, verb sort + count, domain health). Hand-built (generated once by a throwaway script, then kept static).
  Story: one crowd of 100 people (1 ring = 1 person) sorts itself by ABO blood group. The same rings move:
  the bottom of the crowd slides left as group O, the top drops into the middle as group A (a few A
  rings already stand there), then B and AB travel right. Every group ends as a block of columns of
  five on one baseline, so its size reads at a glance; then each group takes its label, its count
  steps up to the number, and the largest group (O) takes the accent. Once-play pass 9.4 s, hold 8.6-9.4 s.
  Verb: sort (main), count (support, after the units have settled).
  Technique: each rigid piece of units (a block, a strip, a column, a single ring) is one <g> with one
  full-pass track: a `translate` leg across and a `transform: translateY` leg down, overlapped so a
  piece curves around the units still standing. Seven pieces: O 1, A 3 (one stays), B 1, AB 2; a
  piece never swaps a ring for another. Counts are digit strips under a clipPath, stepped with steps().
  Facts:
  - O 44, A 42, B 10, AB 4 of every 100: Stanford Blood Center, "Blood Types" page (US population,
    citing the AABB Technical Manual, 18th ed.): O+ 37.4 % + O- 6.6 % = 44.0 %; A+ 35.7 % + A- 6.3 % =
    42.0 %; B+ 8.5 % + B- 1.5 % = 10.0 %; AB+ 3.4 % + AB- 0.6 % = 4.0 %. The ABO totals are arithmetic
    on those eight figures, sum exactly 100, so no rounding was needed. (The brief's 45/40/11/4 is a
    commonly quoted Red Cross rounding; the Red Cross page could not be fetched, so the Stanford
    figures are used.) Rh types are not shown; no compatibility claim is made.
  - "approximate shares, United States": the source calls its figures estimates for the US population.
  - Intermediate count values (0, 10, 20, 30, 40; 0, 5; 0, 2) are round values on the way to the
    stated number (motion-verbs.md, count), not data.
  - Start layout of the crowd (which ring stands where) is illustrative and carries no meaning. -->
