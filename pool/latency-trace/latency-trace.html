<style>
.anim-latency-trace{
  --anim-bg:       var(--anim-theme-bg,       #0f1218);
  --anim-panel:    var(--anim-theme-panel,    #1a2030);
  --anim-line:     var(--anim-theme-line,     #3a4660);
  --anim-fg:       var(--anim-theme-fg,       #eef2f8);
  --anim-muted:    var(--anim-theme-muted,    #9aa7bd);
  --anim-accent:   var(--anim-theme-accent,   #4cc2ff);
  --anim-accent-2: var(--anim-theme-accent-2, #ffb454);
  --anim-ok:       var(--anim-theme-ok,       #3ecf8e);
  --anim-warn:     var(--anim-theme-warn,     #ffb454);
  --anim-danger:   var(--anim-theme-danger,   #ff5d5d);
  --anim-font:     var(--anim-theme-font,     system-ui, sans-serif);
  --anim-mono:     var(--anim-theme-mono,     ui-monospace, monospace);
  width:100%;height:100%
}
.anim-latency-trace svg{width:100%;height:100%;display:block}
.anim-latency-trace .latency-trace-mono{font-family:var(--anim-mono);font-size:18px;fill:var(--anim-muted)}
.anim-latency-trace .latency-trace-title{font-family:var(--anim-font);font-size:24px;font-weight:700;fill:var(--anim-fg)}
.anim-latency-trace .latency-trace-readout{font-family:var(--anim-mono);font-size:26px;font-weight:600;fill:var(--anim-fg)}
.anim-latency-trace .latency-trace-fg{fill:var(--anim-fg)}
.anim-latency-trace .latency-trace-a2{fill:var(--anim-accent-2)}
.anim-latency-trace .latency-trace-ok{fill:var(--anim-ok)}
.anim-latency-trace .latency-trace-warn{fill:var(--anim-warn)}
.anim-latency-trace .latency-trace-danger{fill:var(--anim-danger)}
.anim-latency-trace .latency-trace-panel{fill:color-mix(in srgb,var(--anim-panel) 50%,transparent);stroke:var(--anim-line);stroke-width:1.5}
.anim-latency-trace .latency-trace-grid{stroke:var(--anim-line);stroke-width:1.5;opacity:.6}
.anim-latency-trace .latency-trace-vgrid{stroke:var(--anim-line);stroke-width:1;opacity:.35}
.anim-latency-trace .latency-trace-axis{stroke:var(--anim-muted);stroke-width:2;stroke-linecap:round}
.anim-latency-trace .latency-trace-zone{fill:color-mix(in srgb,var(--anim-danger) 7%,transparent)}
.anim-latency-trace .latency-trace-slo{stroke:var(--anim-danger);stroke-width:2;stroke-dasharray:8 7;stroke-linecap:round;opacity:.85}
.anim-latency-trace .latency-trace-now{stroke:var(--anim-muted);stroke-width:1.5;stroke-dasharray:3 5;opacity:.7}
.anim-latency-trace .latency-trace-line{fill:none;stroke:var(--anim-accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.anim-latency-trace .latency-trace-breach{fill:none;stroke:var(--anim-danger);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.anim-latency-trace .latency-trace-ev{stroke-width:2;stroke-dasharray:5 6;stroke-linecap:round}
.anim-latency-trace .latency-trace-ev-deploy{stroke:var(--anim-accent-2)}
.anim-latency-trace .latency-trace-ev-rb{stroke:var(--anim-ok)}
.anim-latency-trace .latency-trace-tick{stroke:var(--anim-danger);stroke-width:2;stroke-linecap:round}
.anim-latency-trace .latency-trace-alert-dot{fill:var(--anim-danger);stroke:var(--anim-bg);stroke-width:2}
.anim-latency-trace .latency-trace-head{fill:var(--anim-accent);stroke:var(--anim-bg);stroke-width:2}
.anim-latency-trace .latency-trace-chip{fill:var(--anim-panel);stroke-width:2;stroke-linejoin:round}
.anim-latency-trace .latency-trace-chip-line{stroke:var(--anim-line)}
.anim-latency-trace .latency-trace-chip-a2{stroke:var(--anim-accent-2)}
.anim-latency-trace .latency-trace-chip-ok{stroke:var(--anim-ok)}
.anim-latency-trace .latency-trace-chip-danger{stroke:var(--anim-danger)}
.anim-latency-trace .latency-trace-chip-warn{stroke:var(--anim-warn)}
/* resting frame (no .visible): the strip at second 11, whole incident in the window, back on v2.3 */
.anim-latency-trace .latency-trace-g{transform:translateX(-495px)}
.anim-latency-trace .latency-trace-head-g{transform:translateY(332.3px)}
.anim-latency-trace .latency-trace-alt{opacity:0}
.anim-latency-trace .latency-trace-base{opacity:1}

/* ---- motion, only when the slide is visible (cycle 14 s; 45 px of trace per second) ---- */
.visible .anim-latency-trace .latency-trace-g{animation:latency-trace-scroll 14s linear infinite}
.visible .anim-latency-trace .latency-trace-head-g{animation:latency-trace-head 14s linear infinite}
.visible .anim-latency-trace .latency-trace-v0{animation:latency-trace-v0 14s linear infinite}
.visible .anim-latency-trace .latency-trace-v1{animation:latency-trace-v1 14s linear infinite}
.visible .anim-latency-trace .latency-trace-s0{animation:latency-trace-s0 14s linear infinite}
.visible .anim-latency-trace .latency-trace-s1{animation:latency-trace-s1 14s linear infinite}
.visible .anim-latency-trace .latency-trace-s2{animation:latency-trace-s2 14s linear infinite}
.visible .anim-latency-trace .latency-trace-r0{animation:latency-trace-r0 14s linear infinite}
.visible .anim-latency-trace .latency-trace-r1{animation:latency-trace-r1 14s linear infinite}
.visible .anim-latency-trace .latency-trace-r2{animation:latency-trace-r2 14s linear infinite}
.visible .anim-latency-trace .latency-trace-r3{animation:latency-trace-r3 14s linear infinite}
.visible .anim-latency-trace .latency-trace-r4{animation:latency-trace-r4 14s linear infinite}
.visible .anim-latency-trace .latency-trace-r5{animation:latency-trace-r5 14s linear infinite}

/* release chip: deploy v2.4 reaches "now" at 3.0 s, rollback at 6.5 s */
@keyframes latency-trace-v0{0%,21.1%{opacity:1}21.4%,46.1%{opacity:0}46.4%,100%{opacity:1}}
