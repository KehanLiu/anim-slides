<!-- latency-trace: chart archetype (scrolling strip), lean restyle (references/style.md).
  14 s seamless loop, 45 px of trace per second: deploy v2.4 reaches now at 3.0 s, alert 4.6 s,
  rollback 6.5 s, SLO met again 8.5 s; the strip content repeats every 630 px -->
<style>
.anim-latency-trace {
  --anim-bg:       var(--anim-theme-bg,       #0F1E27);
  --anim-panel:    var(--anim-theme-panel,    #0D1820);
  --anim-line:     var(--anim-theme-line,     #2A3D49);
  --anim-fg:       var(--anim-theme-fg,       #E6EDF0);
  --anim-muted:    var(--anim-theme-muted,    #93A7B2);
  --anim-accent:   var(--anim-theme-accent,   #34D1BF);
  --anim-accent-2: var(--anim-theme-accent-2, #FF8A3D);
  --anim-ok:       var(--anim-theme-ok,       #8ED7AD);
  --anim-warn:     var(--anim-theme-warn,     #FFD15C);
  --anim-danger:   var(--anim-theme-danger,   #FF6B6B);
  --anim-font:     var(--anim-theme-font,     system-ui, sans-serif);
  --anim-mono:     var(--anim-theme-mono,     ui-monospace, monospace);
  display: block; width: 100%; height: 100%;
}
.anim-latency-trace svg{width:100%;height:100%;display:block}
/* type */
.anim-latency-trace .latency-trace-mono{font-family:var(--anim-mono);font-size:18px;fill:var(--anim-muted)}
.anim-latency-trace .latency-trace-title{font-family:var(--anim-font);font-size:24px;font-weight:600;fill:var(--anim-fg)}
.anim-latency-trace .latency-trace-readout{font-family:var(--anim-mono);font-size:26px;font-weight:600;fill:var(--anim-fg)}
.anim-latency-trace .latency-trace-fg{fill:var(--anim-fg)}
.anim-latency-trace .latency-trace-ok{fill:var(--anim-ok)}
.anim-latency-trace .latency-trace-danger{fill:var(--anim-danger)}
/* frame: thin axes, dotted grid */
.anim-latency-trace .latency-trace-grid,.anim-latency-trace .latency-trace-vgrid{stroke:var(--anim-line);stroke-width:2;stroke-dasharray:1 9;stroke-linecap:round;opacity:.4}
.anim-latency-trace .latency-trace-axis{stroke:var(--anim-line);stroke-width:2;stroke-linecap:round}
.anim-latency-trace .latency-trace-zone{fill:color-mix(in srgb,var(--anim-danger) 7%,transparent)}
.anim-latency-trace .latency-trace-slo{stroke:color-mix(in srgb,var(--anim-muted) 45%,var(--anim-line));stroke-width:2;stroke-dasharray:8 7;stroke-linecap:round}
.anim-latency-trace .latency-trace-now{stroke:var(--anim-line);stroke-width:2;stroke-dasharray:2 6;stroke-linecap:round}
/* series and its glowing head */
.anim-latency-trace .latency-trace-line{fill:none;stroke:var(--anim-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.anim-latency-trace .latency-trace-head{fill:var(--anim-accent)}
.anim-latency-trace .latency-trace-halo{fill:var(--anim-accent);opacity:.3;filter:blur(4px)}
/* events: outlined mono tags on dashed leaders */
.anim-latency-trace .latency-trace-ev{stroke:var(--anim-line);stroke-width:2;stroke-dasharray:4 5;stroke-linecap:round}
.anim-latency-trace .latency-trace-tag{fill:var(--anim-bg);stroke:var(--anim-line);stroke-width:2}
.anim-latency-trace .latency-trace-alert-dot{fill:var(--anim-danger);stroke:var(--anim-bg);stroke-width:2}
.anim-latency-trace .latency-trace-tagbox{fill:none;stroke:var(--anim-line);stroke-width:2}

/* resting frame (no .visible): the strip at second 11, whole incident in the window, back on v2.3 */
.anim-latency-trace .latency-trace-g{transform:translateX(-495px)}
.anim-latency-trace .latency-trace-head-g{transform:translateY(332.3px)}
.anim-latency-trace .latency-trace-alt{opacity:0}
.anim-latency-trace .latency-trace-base{opacity:1}

/* ---- motion, only when the slide is visible (cycle 14 s; 45 px of trace per second) ---- */
.visible .anim-latency-trace .latency-trace-g{animation:latency-trace-scroll 14s linear infinite}
.visible .anim-latency-trace .latency-trace-head-g{animation:latency-trace-head 14s linear infinite}
.visible .anim-latency-trace .latency-trace-v0{animation:latency-trace-v0 14s linear infinite}
.visible .anim-latency-trace .latency-trace-v1{animation:latency-trace-v1 14s linear infinite}
.visible .anim-latency-trace .latency-trace-s0{animation:latency-trace-s0 14s linear infinite}
.visible .anim-latency-trace .latency-trace-s1{animation:latency-trace-s1 14s linear infinite}
.visible .anim-latency-trace .latency-trace-s2{animation:latency-trace-s2 14s linear infinite}
.visible .anim-latency-trace .latency-trace-r0{animation:latency-trace-r0 14s linear infinite}
.visible .anim-latency-trace .latency-trace-r1{animation:latency-trace-r1 14s linear infinite}
.visible .anim-latency-trace .latency-trace-r2{animation:latency-trace-r2 14s linear infinite}
.visible .anim-latency-trace .latency-trace-r3{animation:latency-trace-r3 14s linear infinite}
.visible .anim-latency-trace .latency-trace-r4{animation:latency-trace-r4 14s linear infinite}
.visible .anim-latency-trace .latency-trace-r5{animation:latency-trace-r5 14s linear infinite}
