  each milestone's leader draws out and its label settles, the line stops at "now" (Q4, mobile apps in
  progress, the focal ring) and the planned v2 appears dashed. Plays once: 9.9 s pass, final state from 8.9 s.
  Names, numbers and times are illustrative examples. -->

  display:block;width:100%;height:100%
}
.anim-roadmap svg{display:block;width:100%;height:100%}

.anim-roadmap text{font-variant-numeric:tabular-nums}
.anim-roadmap .roadmap-lbl{font-family:var(--anim-font);font-size:26px;font-weight:600;fill:var(--anim-fg)}

.anim-roadmap .roadmap-st.roadmap-gn{fill:var(--anim-ok)}
.anim-roadmap .roadmap-note{font-family:var(--anim-font);font-size:26px;fill:var(--anim-fg)}
.anim-roadmap .roadmap-date{font-family:var(--anim-mono);font-size:19px;fill:var(--anim-fg)}

.anim-roadmap .roadmap-axis-plan{fill:none;stroke:var(--anim-line);stroke-width:2;stroke-linecap:round;stroke-dasharray:2 10;clip-path:inset(0 0 0 0)}
.anim-roadmap .roadmap-prog{fill:none;stroke:var(--anim-accent);stroke-width:4;stroke-linecap:round;stroke-dasharray:100 120;stroke-dashoffset:0}
.anim-roadmap .roadmap-mk{fill:var(--anim-bg);stroke:var(--anim-line);stroke-width:2}
.anim-roadmap .roadmap-mk-now{fill:var(--anim-accent);stroke:var(--anim-accent)}

.anim-roadmap .roadmap-mk-plan{stroke:var(--anim-muted);stroke-dasharray:3 4}
.anim-roadmap .roadmap-glow{fill:none;stroke:var(--anim-accent);stroke-width:8;stroke-opacity:.22;filter:blur(7px)}
