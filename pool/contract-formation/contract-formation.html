<!-- contract-formation (pool, verb switch, archetype states drawn as one document, domain law). Hand-built; lean style, references/style.md.
  Story: an agreement is drawn as one sheet with three empty slots for the elements of a contract.
  The offer lands in its slot; the status beside the sheet stays "not binding". Acceptance lands;
  the status still reads "not binding" and the one empty slot is ringed once (two of three is not
  enough). Consideration lands, and in that moment the whole document changes state in place: its
  outline turns from dashed to solid in the accent, the status cross-fades to "binding contract" and
  a signature draws on along the signature line. The old dashed outline stays as a faint ghost
  offset behind the sheet.
  Verb: switch (the same object, a new condition, at the moment of a cause). No traveller, no
  offset-path: the three elements sit on the document and the document is what changes.
  Technique: stacked copies cross-faded (dashed outline group under a solid accent sheet group with
  a bg fill, so the stepped-back ghost shows only at its offset edges); the ghost is a translate +
  opacity on the dashed group; slot outlines and the signature are draw-ons (pathLength 100,
  dasharray 100 120); status text is two stacked <text> in one group, the old word out before the new one in.
  Once pass 9 s: set 0-0.6 s; offer 1.45-2.05 s; acceptance 2.75-3.35 s and the empty slot ringed
  3.7-4.3 s; consideration 4.95-5.55 s; hero switch 5.7-7.25 s (the slowest step, nothing else moves);
  final caption 7.4-7.75 s; hold 7.85-9 s. Phases 1.0, 2.3, 4.45, 7.85.
  Facts:
  - A contract requires an offer, acceptance of that offer and consideration; with one missing there
    is no binding contract: stated fact (common-law contract basics as taught in an introductory
    course; the brief's claim), shown with the mono note "common-law basics, simplified".
  - "something of value from each side": the brief's definition of consideration.
  - Labels "offer", "acceptance", "consideration", "not binding", "binding contract": the brief's words.
  - No numbers, statutes, case names or jurisdictions. The sheet, text rules, seals and signature
    are drawing, not data. -->

}

.anim-contract-formation .contract-formation-dash{fill:none;stroke:var(--anim-muted);stroke-width:2;stroke-dasharray:10 9;stroke-linejoin:round;stroke-linecap:round}
.anim-contract-formation .contract-formation-body{fill:var(--anim-bg);stroke:var(--anim-accent);stroke-width:3;stroke-linejoin:round}
.anim-contract-formation .contract-formation-fold{fill:none;stroke:var(--anim-accent);stroke-width:2.5;stroke-linejoin:round}
.anim-contract-formation .contract-formation-glow{fill:var(--anim-accent);opacity:.3;filter:blur(10px)}
.anim-contract-formation .contract-formation-rule{fill:none;stroke:var(--anim-muted);stroke-width:2.5;stroke-linecap:round;opacity:.55}
.anim-contract-formation .contract-formation-rule-h{stroke-width:4}
.anim-contract-formation .contract-formation-sigline{fill:none;stroke:var(--anim-muted);stroke-width:2;stroke-linecap:round}
.anim-contract-formation .contract-formation-sig{fill:none;stroke:var(--anim-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100 120;stroke-dashoffset:0}
/* slots: an empty dashed ring; an element lands as the outline completes and a seal drops in */
.anim-contract-formation .contract-formation-slot{fill:none;stroke:var(--anim-muted);stroke-width:2;stroke-dasharray:5 7;stroke-linecap:round}
.anim-contract-formation .contract-formation-ring{fill:none;stroke:var(--anim-fg);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:100 120;stroke-dashoffset:0}
.anim-contract-formation .contract-formation-seal{fill:var(--anim-fg)}
.anim-contract-formation .contract-formation-mark{fill:none;stroke:var(--anim-accent);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:100 120;stroke-dashoffset:0}
/* resting frame = the end: all three present, sheet solid in the accent, ghost of the old state offset behind, signed, binding */
.anim-contract-formation .contract-formation-ghost{transform:translate(22px,18px);opacity:.5}
.anim-contract-formation .contract-formation-mark,.anim-contract-formation .contract-formation-st-no,.anim-contract-formation .contract-formation-n0,.anim-contract-formation .contract-formation-n1,.anim-contract-formation .contract-formation-n2,.anim-contract-formation .contract-formation-n3{opacity:0}

/* ---- motion (9 s once pass), only when the slide is visible. percent = s / 9 ---- */
/* set: the sheet, its empty slots and the status fade in 0-0.6 s */
@keyframes contract-formation-scene{
  0%{opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1)}  /* 0 s */
  6.667%{opacity:1}  /* 0.6 s */

/* offer: slot outline completes 1.45-2.05 s */
@keyframes contract-formation-ring-o{

  22.778%{stroke-dashoffset:0}  /* 2.05 s */
  100%{stroke-dashoffset:0}}
/* offer: seal drops in 1.55-1.95 s */
@keyframes contract-formation-seal-o{

  21.667%{opacity:1;transform:translateY(0px)}  /* 1.95 s */
  100%{opacity:1;transform:translateY(0px)}}
/* offer: label follows 1.65-2.05 s */
@keyframes contract-formation-lbl-o{

/* acceptance: slot outline completes 2.75-3.35 s */
@keyframes contract-formation-ring-a{

  37.222%{stroke-dashoffset:0}  /* 3.35 s */
  100%{stroke-dashoffset:0}}
/* acceptance: seal drops in 2.85-3.25 s */
@keyframes contract-formation-seal-a{
  0%{opacity:0;transform:translateY(-14px)}  /* 0 s */
  31.667%{opacity:0;transform:translateY(-14px);animation-timing-function:cubic-bezier(0.16,1,0.3,1)}  /* 2.85 s */
  36.111%{opacity:1;transform:translateY(0px)}  /* 3.25 s */

/* acceptance: label follows 2.95-3.35 s */
@keyframes contract-formation-lbl-a{

/* consideration: slot outline completes 4.95-5.55 s */
@keyframes contract-formation-ring-c{
  0%{stroke-dashoffset:101}  /* 0 s */

  61.667%{stroke-dashoffset:0}  /* 5.55 s */
  100%{stroke-dashoffset:0}}
/* consideration: seal drops in 5.05-5.45 s */
@keyframes contract-formation-seal-c{
  0%{opacity:0;transform:translateY(-14px)}  /* 0 s */
  56.111%{opacity:0;transform:translateY(-14px);animation-timing-function:cubic-bezier(0.16,1,0.3,1)}  /* 5.05 s */
  60.556%{opacity:1;transform:translateY(0px)}  /* 5.45 s */

/* consideration: label follows 5.15-5.55 s */
@keyframes contract-formation-lbl-c{

  100%{opacity:1}}
/* mark: the one empty slot is ringed once 3.7-4.3 s (two of three, still not binding) and the ring leaves as consideration lands 4.9-5.15 s */
@keyframes contract-formation-mark{
  0%{opacity:1;stroke-dashoffset:101}  /* 0 s */

  47.778%{opacity:1;stroke-dashoffset:0}  /* 4.3 s */

/* hero: the dashed outline steps back to a faint ghost behind the sheet 5.7-6.6 s */
@keyframes contract-formation-ghost{
  0%{opacity:1;transform:translate(0px,0px)}  /* 0 s */

@keyframes contract-formation-solid{

  100%{opacity:1}}

@keyframes contract-formation-st-no{

@keyframes contract-formation-n4{
