<!-- petition-threshold (pool, archetype chart drawn as a measuring column, domain civics). Hand-built; lean style, references/style.md.
  Story: a European Citizens' Initiative fills a measuring column with statements of support. One
  mark = 20,000 signatures, so 50 marks reach the line at 1,000,000. The marks arrive in three
  staggered waves (20, 20, 10) and settle into rows; after each wave the level rises and the running
  total rolls on one step per row of ten marks, as that row settles (0, 200,000, ... 1,000,000). When the level reaches the line, the line and its
  label take the accent. Then, quieter: seven member-state markers tick on beside a static
  "12 months" bracket, and the caption states the full condition.
  Verb: accumulate (main), count (support, the digit strip). Pass 9 s once, hold 7.9-9.0 s.
  Technique: one translateY+opacity track per mark (each wave is one staggered series, 35 ms apart);
  the level is a scaleY on a rect about the floor (transform-box view-box, px origin); the total is a
  digit strip of stacked <text> under a clipPath, rolled by translateY; the threshold change is a
  cross-fade of stacked copies. No offset-path, no travelling marker.
  Timing: wave rows (0, 1): 0.5-1.61 s; wave rows (2, 3): 2.9-4.01 s; wave rows (4,): 4.9-5.67 s; level after each wave 1.65-2.25, 4.05-4.65, 5.7-6.3 s;
  counter rolls per row 1.0-1.3, 1.35-1.65, 3.4-3.7, 3.75-4.05, 5.4-5.7 s; threshold lights 6.35-6.75 s; markers 7.0-7.73 s.
  Facts (Regulation (EU) 2019/788 on the European citizens' initiative; checked 2026-11-16 against
  citizens-initiative.europa.eu "How it works": "the support of at least 1 million EU citizens",
  "12 months to collect statements of support", "thresholds (minimum numbers) in at least 7 EU
  countries"):
  - 1,000,000 valid statements of support: stated fact (Reg. 2019/788).
  - 12 months collection period: stated fact (Reg. 2019/788).
  - at least 7 member states with minimum numbers reached: stated fact (Reg. 2019/788). No country
    is named and no per-country threshold is drawn.
  - the Commission must respond once the conditions are met: stated (the claim; Reg. 2019/788).
  - 1 mark = 20,000 signatures: a drawing scale, 1,000,000 / 50 marks (arithmetic).
  - 200,000 / 400,000 / 600,000 / 800,000: positions on the way, marks x 20,000 (arithmetic), not facts about any
    real initiative; the wave sizes and their timing are a drawing choice, not a collection rate.
  - the seven markers stand for "at least 7"; the number of member states in total is not drawn. -->
<style>
.anim-petition-threshold{
  --anim-bg:       var(--anim-theme-bg,       #0F1E27);
  --anim-panel:    var(--anim-theme-panel,    #0D1820);
  --anim-line:     var(--anim-theme-line,     #2A3D49);
  --anim-fg:       var(--anim-theme-fg,       #E6EDF0);
  --anim-muted:    var(--anim-theme-muted,    #93A7B2);
  --anim-accent:   var(--anim-theme-accent,   #34D1BF);
  --anim-accent-2: var(--anim-theme-accent-2, #FF8A3D);
  --anim-ok:       var(--anim-theme-ok,       #8ED7AD);
  --anim-warn:     var(--anim-theme-warn,     #FFD15C);
  --anim-danger:   var(--anim-theme-danger,   #FF6B6B);
  --anim-font:     var(--anim-theme-font,     system-ui, sans-serif);
  --anim-mono:     var(--anim-theme-mono,     ui-monospace, monospace);
  display:block;width:100%;height:100%
}
.anim-petition-threshold svg{display:block;width:100%;height:100%;max-width:none}
.anim-petition-threshold .petition-threshold-t{font-family:var(--anim-font);fill:var(--anim-fg)}
.anim-petition-threshold .petition-threshold-lbl{font-size:26px;font-weight:600}
.anim-petition-threshold .petition-threshold-note{font-size:26px;font-weight:400}
.anim-petition-threshold .petition-threshold-big{font-family:var(--anim-font);font-size:64px;font-weight:600;fill:var(--anim-fg)}
.anim-petition-threshold .petition-threshold-big.petition-threshold-acc{fill:var(--anim-accent)}
.anim-petition-threshold .petition-threshold-mono{font-family:var(--anim-mono);font-size:20px;font-weight:400;fill:var(--anim-muted)}
.anim-petition-threshold .petition-threshold-thr-t{font-family:var(--anim-font);font-size:28px;font-weight:600;fill:var(--anim-muted)}
.anim-petition-threshold .petition-threshold-thr-t.petition-threshold-acc{fill:var(--anim-accent)}
/* the measuring column: thin walls, a lip, graduation ticks */
.anim-petition-threshold .petition-threshold-wall{fill:none;stroke:var(--anim-muted);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.anim-petition-threshold .petition-threshold-tick{fill:none;stroke:var(--anim-line);stroke-width:2;stroke-linecap:round}
/* level: quiet tint, scene ground (the contents of the column) */
.anim-petition-threshold .petition-threshold-level{fill:color-mix(in srgb,var(--anim-muted) 12%,transparent);transform-box:view-box;transform-origin:840px 498px;transform:scaleY(1)}
/* marks: one slip per 20,000 signatures, a short signature line inside */
.anim-petition-threshold .petition-threshold-slip{fill:var(--anim-bg);stroke:var(--anim-fg);stroke-width:2;stroke-linejoin:round}
.anim-petition-threshold .petition-threshold-sig{fill:none;stroke:var(--anim-muted);stroke-width:2;stroke-linecap:round}
.anim-petition-threshold .petition-threshold-unit{transform-box:view-box;transform:translateY(0px);opacity:1}
/* threshold: dashed line, then the accent copy over it */
.anim-petition-threshold .petition-threshold-thr{fill:none;stroke:var(--anim-muted);stroke-width:2;stroke-dasharray:8 8;stroke-linecap:round}
.anim-petition-threshold .petition-threshold-thr-a{fill:none;stroke:var(--anim-accent);stroke-width:3;stroke-linecap:round}
.anim-petition-threshold .petition-threshold-thr-off{opacity:0}
/* secondary: member-state markers and the 12-month bracket */
.anim-petition-threshold .petition-threshold-ring{fill:none;stroke:var(--anim-muted);stroke-width:2}
.anim-petition-threshold .petition-threshold-dot{fill:var(--anim-accent)}
.anim-petition-threshold .petition-threshold-brk{fill:none;stroke:var(--anim-muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.anim-petition-threshold .petition-threshold-strip{transform-box:view-box}
.anim-petition-threshold .petition-threshold-strip{transform:translateY(-400px)}
/* resting frame: column full to the line, total 1,000,000, line in accent, 7 markers on, final caption */
.anim-petition-threshold .petition-threshold-n0{opacity:0}

/* ---- motion (9 s once-play pass), only when the slide is visible ---- */
