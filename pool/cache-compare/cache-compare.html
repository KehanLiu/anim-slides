<!-- cache-compare (pool, verb race, archetype compare, domain software). Hand-built; lean style, references/style.md.
  Story: the same four reads without a cache (left) and with a read-through cache (right). Each read
  is a race under one clock: the two latency bars of that read start at the same instant and grow at
  the same rate on the same scale (bar length proportional to milliseconds), so a 180 ms database
  read keeps growing while an 8 ms cache hit stops almost at once. Read 1 misses on both sides (the
  right side goes to the database and fills the cache, 185 ms); reads 2 to 4 are database reads on
  the left (180 ms each) and cache hits on the right (8 ms each). After each database read that
  side's load gauge steps up 24 % and its read counter ticks in step: the left reaches 96 % (4 reads,
  in danger red), the right stays at 24 % (1 read). Answer: the left level is ghosted on the right
  gauge and an accent bracket spans the gap: 75 % fewer database reads; the verdict sentence lands.
  Verb: race. Technique: one full-pass scaleX track per bar (transform-box fill-box, origin at the
  bar start), LINEAR timing because the bars track the clock: 1.0 s of pass per 180 ms, so every bar
  grows at 360 px/s (180 ms = 360 px over 1.0 s, 185 ms = 370 px over 1.028 s, 8 ms = 16 px over
  0.044 s). Scale 2 px per ms on both sides ("bars to scale"); bars 24 px tall, the largest marks
  and the only large movement. Load gauges: horizontal scaleX in four steps of 24 % (100 % = 360 px);
  counters are stacked <text> that switch in one instant as the level arrives. Answer: dashed ghost
  tick, then the bracket draws on alone (pathLength 100), then its label. No packets, no offset-path.
  Colours: neutral for bars, danger only for the overloaded side, the accent only for the answer.
  Once pass 10 s: set 0-0.4 s; read 1 0.5-1.95 s; read 2 2.5-3.95 s; read 3 4.15-5.6 s; read 4
  5.8-7.25 s; answer 7.4-8.89 s (bracket alone 7.95-8.25 s, still to 8.65 s, then 75 % fewer); hold 8.9-10 s.
  Phases 2.1, 4.05, 5.7, 7.35, 8.9.
  Facts (all values are the entry's existing illustrative example figures, tagged "illustrative"):
  - 180 ms per database read (left reads 1-4): illustrative, as in the entry before this rework.
  - 185 ms for read 1 with cache (miss, go to the database, fill): illustrative, entry value.
  - 8 ms per cache hit (right reads 2-4): illustrative, entry value.
  - Which reads hit and miss (read 1 misses, reads 2-4 hit; left always goes to the database):
    the entry's stated scenario (read-through cache, the first read fills it). The column notes
    "every read → database" and "miss → DB, fill, then cache hit" reuse the entry's row labels.
  - "0 reads" .. "4 reads" left, "0 reads"/"1 read" right: count of database reads in that scenario.
  - Load 24 % per database read (0/24/48/72/96 % left, 0/24 % right): illustrative, entry values.
  - "22x faster on cache hits" = 180 / 8 = 22.5, rounded down: arithmetic, entry's verdict.
  - "75 % fewer database reads" = (4 - 1) / 4: arithmetic, entry's verdict; also 96 % vs 24 %.
  - Captions "First read misses and fills the cache", "Later reads hit the cache": the entry's
    phase notes (spec.yaml).
  - "bars to scale" (2 px per ms) and the 1.0 s per 180 ms clock: drawing scale, not data. -->
