<!-- street-redesign (pool, verb wipe, archetype compare drawn as a street cross-section, domain civics / urban planning). Hand-built; lean style, references/style.md.
  Story: an example street is 20 m wide between its building edges. Before: pavement, four car lanes,
  parking, pavement. A thin boundary line sweeps once across the street from left to right; behind it
  stands the redesigned section: wider pavements, a cycle track, two car lanes, a bus lane. The
  building edges, the ground line and the 20 m bracket do not move at all: the width is the same, only
  its division changes. Answer: the widths of the new strips take the accent, the old widths stay as a
  muted row of ticks under the strip labels (the ghost) and a mono line under the bracket says
  "car lanes 4 to 2". Strip labels never meet the line: the before labels leave just before the
  sweep, the after labels come in per half once the line has passed (left half at the centre pause,
  the rest after the sweep). Building edges and the bracket are drawn in the foreground colour and
  never move.
  Verb: wipe. Technique: each layer is clipped by a url(#) clipPath rect in viewBox units: the after
  layer by a rect from x 0 with CSS width X, the before layer by a rect from CSS x X (width 1680), and
  the boundary line is translated with X; X runs 280 -> 840 (pause at the street centre so both halves
  are seen at once) -> 1400. (Same picture as clip-path: inset(); animating the clip rect's x/width
  follows lessons.md and lets check_look.py see the clip.)
  Scale: true horizontal proportion, 1 m = 56 px; the street spans x 280 to 1400 (20 m = 1120 px).
  Glyphs (pedestrian, car front, parked car, bicycle, bus front) stand on the strips at roughly true
  size; they are pictograms, not data.
  Once pass 8.6 s: set 0-1.6 s (strips build left to right, labels follow, bracket draws),
  read to 2.1 s, labels leave 2.08-2.28 s, wipe 2.1-5.55 s (moves 2.3-3.2 and 4.4-5.3 s, pause at the
  centre 3.2-4.4 s with the left labels in 3.3-3.7 s), right labels 5.35-5.75 s, answer 5.95-7.4 s,
  hold 7.5-8.6 s. Phases 2.05,3.8,5.9,7.5.
  Facts (all ILLUSTRATIVE, an example street, shown with the "illustrative" tag):
  - total width 20 m: illustrative; both rows below sum to 20.0 m (arithmetic).
  - before: pavement 2.5 m | car lanes 4 x 3.0 = 12.0 m | parking 3.0 m | pavement 2.5 m: illustrative.
  - after: pavement 4.0 m | cycle track 2.5 m | car lanes 2 x 3.0 = 6.0 m | bus lane 3.5 m |
    pavement 4.0 m: illustrative.
  - "car lanes 4 to 2": count of lanes in the two illustrative rows.
  - new strips in the accent (cycle track, bus lane, widened pavements): the brief's claim.
  - No traffic counts, safety claims or places. -->
