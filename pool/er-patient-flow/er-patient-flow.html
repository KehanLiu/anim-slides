<!-- er-patient-flow (lean restyle sample, archetype pipeline, domain health). Hand-built.
  Story: an emergency department visit in eight steps on a thin line, wrapped into two rows: a glowing
  token hops ring to ring, the active ring lights in the accent, a reached ring settles to the text colour
  (the route to muted), since every step is reached; the quiet wrap carries the token from step 4 down to step 5. Entrance: the route draws on in
  order, each ring lands as its wire reaches it, its label settles just after. Step 8 (discharge) is the
  focal: a larger ring that stays lit. Once-play pass 10 s, ends on the resting frame; hold 9.0-10 s.
  Illustrative, not clinical guidance. -->
