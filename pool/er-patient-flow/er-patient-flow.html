<!-- er-patient-flow (lean restyle sample, archetype pipeline, domain health). Hand-built.
  Story: an emergency department visit in eight steps on a thin line, wrapped into two rows: a glowing
  token hops ring to ring, the active ring lights in the accent, a passed ring settles in ok; the quiet
  wrap carries the token from step 4 down to step 5. Cycle 13 s, hold 10.9-12.6 s.
  Illustrative, not clinical guidance. -->
