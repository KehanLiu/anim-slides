<!-- er-patient-flow (pool, archetype pipeline, domain health). Hand-built.
  Story: an emergency department visit in eight steps, wrapped into two rows (snake): a token hops
  step to step, each step lights while it is in progress and then settles with a check; the wrap wire
  carries the token from the end of row 1 down to the start of row 2. Cycle 13 s, hold 10.9-12.6 s.
  Step starts (s): 1, 2.25, 3.5, 4.75, 6.3, 7.55, 8.8, 10.05. Illustrative, not clinical guidance. -->
