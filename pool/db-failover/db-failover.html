<!-- db-failover (pool, archetype graph, domain software). Error rate, p99 latency and the replica state are illustrative, not measurements. -->
<style>
.anim-db-failover {
  --anim-bg:       var(--anim-theme-bg,       #0F1E27);
  --anim-panel:    var(--anim-theme-panel,    #0D1820);
  --anim-line:     var(--anim-theme-line,     #2A3D49);
  --anim-fg:       var(--anim-theme-fg,       #E6EDF0);
  --anim-muted:    var(--anim-theme-muted,    #93A7B2);
  --anim-accent:   var(--anim-theme-accent,   #34D1BF);
  --anim-accent-2: var(--anim-theme-accent-2, #FF8A3D);
  --anim-ok:       var(--anim-theme-ok,       #8ED7AD);
  --anim-warn:     var(--anim-theme-warn,     #FFD15C);
  --anim-danger:   var(--anim-theme-danger,   #FF6B6B);
  --anim-font:     var(--anim-theme-font,     system-ui, sans-serif);
  --anim-mono:     var(--anim-theme-mono,     ui-monospace, monospace);
  display: block; width: 100%; height: 100%;
}
.anim-db-failover svg{width:100%;height:100%;display:block}
/* type */
.anim-db-failover .db-failover-mono{font-family:var(--anim-mono);font-size:18px}
.anim-db-failover .db-failover-sans{font-family:var(--anim-font);font-size:18px}
.anim-db-failover .db-failover-lbl{font-family:var(--anim-font);font-size:22px;font-weight:600;fill:var(--anim-fg)}
.anim-db-failover .db-failover-title{font-size:22px;font-weight:600}
.anim-db-failover .db-failover-st{letter-spacing:.08em}
.anim-db-failover .db-failover-fg{fill:var(--anim-fg)}
.anim-db-failover .db-failover-dim{fill:var(--anim-muted)}
.anim-db-failover .db-failover-cy{fill:var(--anim-accent)}
.anim-db-failover .db-failover-gn{fill:var(--anim-ok)}
.anim-db-failover .db-failover-rd{fill:var(--anim-danger)}
/* resting frame = finished story: db-a down, db-b promoted, traffic rerouted, approval shown.
   Layers that belong only to earlier phases rest at opacity 0; keyframes bring them in. */
.anim-db-failover .db-failover-pre,.anim-db-failover .db-failover-pl,.anim-db-failover .db-failover-fail,.anim-db-failover .db-failover-fl,.anim-db-failover .db-failover-s1,.anim-db-failover .db-failover-s2,.anim-db-failover .db-failover-halo,.anim-db-failover .db-failover-was{opacity:0}
.anim-db-failover .db-failover-post,.anim-db-failover .db-failover-after,.anim-db-failover .db-failover-al,.anim-db-failover .db-failover-appr,.anim-db-failover .db-failover-card,.anim-db-failover .db-failover-chk{opacity:1}
/* wires: hairlines; requests are dots marching along them (no glow: lines never glow) */
.anim-db-failover .db-failover-base path{fill:none;stroke:var(--anim-line);stroke-width:2;stroke-linecap:round}
.anim-db-failover .db-failover-req{fill:none;stroke:var(--anim-accent);stroke-width:6;stroke-linecap:round;stroke-dasharray:0 24}
.anim-db-failover .db-failover-req.db-failover-err{stroke:var(--anim-danger);stroke-dasharray:0 16}
.anim-db-failover .db-failover-req.db-failover-new{stroke:var(--anim-ok);opacity:1}
.anim-db-failover .db-failover-repl{fill:none;stroke:var(--anim-muted);stroke-width:2;stroke-linecap:round;stroke-dasharray:6 10}
/* nodes: rings with a line glyph, labels outside */
.anim-db-failover .db-failover-ring{fill:var(--anim-bg);stroke:color-mix(in srgb,var(--anim-muted) 55%,var(--anim-bg));stroke-width:2.5}
.anim-db-failover .db-failover-glyph{fill:none;stroke:var(--anim-muted);stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round}
.anim-db-failover .db-failover-r-pri{fill:var(--anim-bg);stroke:var(--anim-accent);stroke-width:3}
.anim-db-failover .db-failover-r-pri+.db-failover-glyph{stroke:var(--anim-accent)}
.anim-db-failover .db-failover-r-down{fill:var(--anim-bg);stroke:var(--anim-danger);stroke-width:3;stroke-dasharray:6 6}
.anim-db-failover .db-failover-r-down+.db-failover-glyph{stroke:var(--anim-danger)}
.anim-db-failover .db-failover-r-up{fill:var(--anim-bg);stroke:var(--anim-ok);stroke-width:3}
.anim-db-failover .db-failover-r-up+.db-failover-glyph{stroke:var(--anim-ok)}
.anim-db-failover .db-failover-glow{fill:none;stroke:var(--anim-ok);stroke-width:12;stroke-opacity:.3;filter:blur(6px)}
.anim-db-failover .db-failover-halo circle{fill:none;stroke:var(--anim-accent)}
.anim-db-failover .db-failover-halo .db-failover-hb{stroke-width:12;stroke-opacity:.3;filter:blur(6px)}
.anim-db-failover .db-failover-halo .db-failover-hr{stroke-width:2;stroke-dasharray:4 7}
.anim-db-failover .db-failover-client path{fill:none;stroke:var(--anim-muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* orchestrator: a hairline bracket, no panel */
.anim-db-failover .db-failover-brk{fill:none;stroke:var(--anim-line);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.anim-db-failover .db-failover-dot-ok{fill:var(--anim-ok)}
.anim-db-failover .db-failover-dot-bad{fill:var(--anim-danger)}
.anim-db-failover .db-failover-rule{fill:none;stroke:var(--anim-ok);stroke-width:3;stroke-linecap:round}
.anim-db-failover .db-failover-appr .db-failover-human{fill:none;stroke:var(--anim-ok);stroke-width:2;stroke-linecap:round}
.anim-db-failover .db-failover-appr .db-failover-head{fill:none;stroke:var(--anim-ok);stroke-width:2}
.anim-db-failover .db-failover-tagbox{fill:none;stroke:var(--anim-line);stroke-width:2}
.anim-db-failover .db-failover-legend path{fill:none;stroke-width:6;stroke-linecap:round;stroke-dasharray:0 16}
.anim-db-failover .db-failover-lg-req{stroke:var(--anim-accent)}
.anim-db-failover .db-failover-lg-err{stroke:var(--anim-danger)}
.anim-db-failover .db-failover-lg-new{stroke:var(--anim-ok)}

/* Plays once, 9.4 s pass. 0-2.7 s normal | 2.7 s db-a fails | 4.5 s checks exhausted, promotion proposed (5.67 s card)
   | 7.56 s approved | 8.1 s rerouted | 8.4 s panel confirms | final state from 8.7 s; request dots march at the old speed for 9 s in one pass, then stop */
@keyframes db-failover-dots{to{stroke-dashoffset:-240}}
@keyframes db-failover-repl{to{stroke-dashoffset:-108}}
@keyframes db-failover-scene{0%,100%{opacity:1}}
/* visible until the failure at 2.7 s */
@keyframes db-failover-pre{0%,28.73%{opacity:1}30.64%,100%{opacity:0}}
/* visible from the failure at 2.7 s to the end */
@keyframes db-failover-post{0%,28.73%{opacity:0}30.64%,100%{opacity:1}}
/* failure window 2.7 s - 8.1 s */
@keyframes db-failover-fail{0%,28.73%{opacity:0}31.59%,86.18%{opacity:1}89.04%,100%{opacity:0}}
/* status line 2: 3.06 s - 4.5 s; status line 3: 4.5 s - 8.4 s */
@keyframes db-failover-s1{0%,32.56%{opacity:0}35.4%,47.87%{opacity:1}49.78%,100%{opacity:0}}
/* orchestrator panel reacts 0.36 s after the topology (3.06 s), so the two do not change in the same instant */
@keyframes db-failover-pl{0%,32.56%{opacity:1}34.46%,100%{opacity:0}}
@keyframes db-failover-fl{0%,32.56%{opacity:0}35.4%,89.36%{opacity:1}91.49%,100%{opacity:0}}
/* panel confirms the reroute 0.3 s later (8.4 s) */
@keyframes db-failover-al{0%,89.36%{opacity:0}92.55%,100%{opacity:1}}
@keyframes db-failover-s2{0%,47.87%{opacity:0}49.78%,89.36%{opacity:1}91.49%,100%{opacity:0}}
/* visible until the reroute at 8.1 s */
@keyframes db-failover-was{0%,86.18%{opacity:1}89.04%,100%{opacity:0}}
/* visible from the reroute at 8.1 s */
@keyframes db-failover-after{0%,86.18%{opacity:0}89.04%,100%{opacity:1}}
/* health checks fail one by one: 3.06 s, 3.78 s, 4.5 s */
@keyframes db-failover-c1{0%,32.56%{opacity:0}34.46%,100%{opacity:1}}
@keyframes db-failover-c2{0%,40.21%{opacity:0}42.13%,100%{opacity:1}}
@keyframes db-failover-c3{0%,47.87%{opacity:0}49.78%,100%{opacity:1}}
/* replica highlighted while it is being promoted: 4.68 s - 7.56 s */
@keyframes db-failover-halo{0%,49.78%{opacity:0}53.62%,80.43%{opacity:1}82.34%,100%{opacity:0}}
/* proposal card slides in at 5.67 s */
@keyframes db-failover-card{0%,60.32%{opacity:0;transform:translateX(30px)}66.07%,100%{opacity:1;transform:translateX(0)}}
@keyframes db-failover-cardstroke{0%,80.43%{stroke:var(--anim-accent)}84.26%,100%{stroke:var(--anim-ok)}}
/* approval at 7.56 s */
@keyframes db-failover-appr{0%,80.43%{opacity:0}84.26%,100%{opacity:1}}

.visible .anim-db-failover .db-failover-scene{animation:db-failover-scene 9.4s ease-in-out 1 forwards}
.visible .anim-db-failover .db-failover-req{animation:db-failover-dots 9s linear 1 forwards}
.visible .anim-db-failover .db-failover-req.db-failover-pre{animation:db-failover-dots 9s linear 1 forwards,db-failover-pre 9.4s ease-in-out 1 forwards}
.visible .anim-db-failover .db-failover-req.db-failover-err{animation:db-failover-fail 9.4s ease-in-out 1 forwards}
.visible .anim-db-failover .db-failover-req.db-failover-new{animation:db-failover-dots 9s linear 1 forwards,db-failover-after 9.4s ease-in-out 1 forwards}
.visible .anim-db-failover .db-failover-repl.db-failover-pre{animation:db-failover-repl 8.4s linear 1 forwards,db-failover-pre 9.4s ease-in-out 1 forwards}
.visible .anim-db-failover .db-failover-pre{animation:db-failover-pre 9.4s ease-in-out 1 forwards}
.visible .anim-db-failover .db-failover-post{animation:db-failover-post 9.4s ease-in-out 1 forwards}
.visible .anim-db-failover .db-failover-fail{animation:db-failover-fail 9.4s ease-in-out 1 forwards}
.visible .anim-db-failover .db-failover-pl{animation:db-failover-pl 9.4s ease-in-out 1 forwards}
.visible .anim-db-failover .db-failover-fl{animation:db-failover-fl 9.4s ease-in-out 1 forwards}
.visible .anim-db-failover .db-failover-al{animation:db-failover-al 9.4s ease-in-out 1 forwards}
.visible .anim-db-failover .db-failover-s1{animation:db-failover-s1 9.4s ease-in-out 1 forwards}
.visible .anim-db-failover .db-failover-s2{animation:db-failover-s2 9.4s ease-in-out 1 forwards}
.visible .anim-db-failover .db-failover-was{animation:db-failover-was 9.4s ease-in-out 1 forwards}
.visible .anim-db-failover .db-failover-after{animation:db-failover-after 9.4s ease-in-out 1 forwards}
.visible .anim-db-failover .db-failover-c1{animation:db-failover-c1 9.4s ease-in-out 1 forwards}
.visible .anim-db-failover .db-failover-c2{animation:db-failover-c2 9.4s ease-in-out 1 forwards}
.visible .anim-db-failover .db-failover-c3{animation:db-failover-c3 9.4s ease-in-out 1 forwards}
.visible .anim-db-failover .db-failover-halo{animation:db-failover-halo 9.4s ease-in-out 1 forwards}
.visible .anim-db-failover .db-failover-card{animation:db-failover-card 9.4s ease-in-out 1 forwards}
.visible .anim-db-failover .db-failover-card .db-failover-rule{animation:db-failover-cardstroke 9.4s ease-in-out 1 forwards}
.visible .anim-db-failover .db-failover-appr{animation:db-failover-appr 9.4s ease-in-out 1 forwards}

@media (prefers-reduced-motion: reduce) { .anim-db-failover * { animation: none !important; } }
</style>
<div class="anim anim-db-failover" data-anim="db-failover" data-anim-cycle="9.4" data-anim-phases="2.6,3.0,4.4,7.5,8.0,9.0" data-anim-control="once">
<svg viewBox="0 0 1000 560" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Service topology: the primary database fails, health checks detect it, the replica is promoted with on-call approval and traffic is rerouted to it.">
