<!-- parcel-route: hero demo fragment (archetype pipeline). Story: a parcel hops ordered > picked > sorted >

<style>

  --anim-bg:       var(--anim-theme-bg,       #0f1218);
  --anim-panel:    var(--anim-theme-panel,    #1a2030);

  --anim-fg:       var(--anim-theme-fg,       #eef2f8);

  --anim-accent-2: var(--anim-theme-accent-2, #ffb454);
  --anim-ok:       var(--anim-theme-ok,       #3ecf8e);
  --anim-warn:     var(--anim-theme-warn,     #ffb454);
  --anim-danger:   var(--anim-theme-danger,   #ff5d5d);
  --anim-font:     var(--anim-theme-font,     system-ui, sans-serif);
  --anim-mono:     var(--anim-theme-mono,     ui-monospace, monospace);
  display:block;width:100%;height:100%
}
.anim-parcel-route svg{display:block;width:100%;height:100%}
.anim-parcel-route .parcel-route-t{font-family:var(--anim-font);fill:var(--anim-fg)}
.anim-parcel-route .parcel-route-lbl{font-size:34px;font-weight:700}
.anim-parcel-route .parcel-route-sub{font-size:24px;fill:var(--anim-muted)}
.anim-parcel-route .parcel-route-big{font-size:32px;font-weight:600}
.anim-parcel-route .parcel-route-hl{fill:var(--anim-ok);font-weight:800}
.anim-parcel-route .parcel-route-track{fill:var(--anim-line)}
.anim-parcel-route .parcel-route-prog{fill:var(--anim-ok);transform-box:fill-box;transform-origin:left center;transform:scaleX(1)}
.anim-parcel-route .parcel-route-disc{fill:var(--anim-panel);stroke:var(--anim-line);stroke-width:3}
.anim-parcel-route .parcel-route-ring{fill:color-mix(in srgb,var(--anim-accent) 16%,var(--anim-panel));stroke:var(--anim-accent);stroke-width:4;opacity:0;transform-box:fill-box;transform-origin:center}

.anim-parcel-route .parcel-route-ico{fill:none;stroke:var(--anim-fg);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.anim-parcel-route .parcel-route-badge{fill:var(--anim-ok);stroke:var(--anim-bg);stroke-width:4}
.anim-parcel-route .parcel-route-tick{fill:none;stroke:var(--anim-bg);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.anim-parcel-route .parcel-route-ok0,.anim-parcel-route .parcel-route-ok1,.anim-parcel-route .parcel-route-ok2,.anim-parcel-route .parcel-route-ok3,.anim-parcel-route .parcel-route-ok4{transform-box:fill-box;transform-origin:center}
.anim-parcel-route .parcel-route-box{fill:var(--anim-accent-2);stroke:var(--anim-bg);stroke-width:3}
.anim-parcel-route .parcel-route-tape{fill:none;stroke:color-mix(in srgb,var(--anim-bg) 45%,var(--anim-accent-2));stroke-width:4;stroke-linecap:round}
.anim-parcel-route .parcel-route-pin{fill:var(--anim-accent-2)}
.anim-parcel-route .parcel-route-mk{transform:translateX(1280px)}
