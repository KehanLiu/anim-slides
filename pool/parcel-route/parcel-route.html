<!-- parcel-route: hero demo fragment (archetype pipeline), lean style (references/style.md).
  Story: a parcel hops ordered > picked > sorted > on the van > delivered; the active ring lights in the
  accent, each hand-off settles in ok, the route draws on, the lead time lands.
  Cycle 8 s, hold 6.5-7.6 s. Resting frame = delivered.
  Names, numbers and times are illustrative examples. -->
