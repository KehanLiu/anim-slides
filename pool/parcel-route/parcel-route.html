<!-- parcel-route: hero demo fragment (archetype pipeline), lean style (references/style.md).
  Story: a parcel hops order placed > picked > sorted > out for delivery > delivered; the active ring lights in
  the accent (the only glow), each passed station settles in ok, the route draws on as a plain line, the lead
  time lands. Once-play pass 7.5 s (lead time lands at 6.5 s, then a 1 s hold); ends on the resting frame = delivered.
  Every label is taken from the README demo slide, examples/first-slide/source.html (tests/test_readme_demo.py). -->
