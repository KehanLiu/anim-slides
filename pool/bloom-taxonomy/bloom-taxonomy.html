<!-- bloom-taxonomy (pool, verb stack, archetype layers drawn as a pyramid, domain education). Hand-built; lean style, references/style.md. No spec.yaml (six levels exceed the scaffolder five-layer limit).
  Story: the six levels of the revised Bloom's taxonomy stack bottom-up, each resting on the one
  below, and one topic (fractions) gets an example task at every level. A ground line draws; then
  each tier is lowered onto the tier beneath it and settles there, one at a time (Remember first,
  Create last). The tier that just landed carries the accent and its fraction task lands beside it;
  when the next tier lands the accent moves up and the tier below settles to a quieter "built"
  outline that stays visible as the base. Answer: the full pyramid with Create in the accent and the
  one glow, and a hairline bracket up the left side with the note "each level rests on the one below".
  Verb: stack. Technique: per tier an outer <g> fades in (enter curve) while an inner <g> is lowered
  56 px with translateY (transform-box view-box) on a slow ease-in-out that decelerates into the landing,
  no overshoot; tiers share their edges so each lands on the one below. Accent = a stacked outline copy
  per tier cross-faded on/off. No token, no offset-path.
  Once pass 10 s: set 0-1.0 s (ground draws, caption) | stack 1.05-6.85 s in three pairs with a settled
  moment after each pair (Remember+Understand 1.05-3.0, Apply+Analyze 3.1-5.05, Evaluate+Create
  5.15-7.1, rows follow each landing by 0.1 s) | answer 7.2-8.4 s (glow, bracket, note, final caption)
  | hold 8.6-10 s. Phases 1, 3.05, 5.1, 7.2, 8.6.
  Facts:
  - Six levels Remember, Understand, Apply, Analyze, Evaluate, Create, bottom to top: the revised
    taxonomy, Anderson & Krathwohl (2001), cognitive process dimension (stated fact).
  - Mono sub-labels: cognitive processes A&K list under each level (plan = designing, critique =
    judging) (stated fact, unchanged from the earlier version of this entry).
  - The six fraction tasks: ILLUSTRATIVE examples, marked by the outlined tag "example tasks, one
    topic: fractions".
  - "Each level builds on the ones below it" / "each level rests on the one below": the usual
    pyramid reading of the taxonomy, kept from the earlier entry. Note: Krathwohl (2002) says the
    revision relaxed the strict cumulative hierarchy so that categories may overlap.
  - No numbers besides 2001 and the fractions inside the example tasks. Tier sizes are drawing scale. -->
