<!-- bloom-taxonomy (pool, archetype layers, domain education; lean restyle, references/style.md). Hand-built; no spec.yaml (six levels exceed the scaffolder five-layer limit).
  The revised Bloom's taxonomy (Anderson & Krathwohl, 2001), six levels of the cognitive process
  dimension, bottom to top; the verbs are cognitive processes A&K list under each level
  (plan = designing, critique = judging). Example tasks on fractions are illustrative.
  10 s once-play pass: levels rise bottom-up 0.13-0.9 s | token climbs, one level per 1.23 s, each level stays lit
  and its task row lands | 8.75 s full stack, final caption | hold to 10 s, then stays. -->
