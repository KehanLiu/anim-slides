<style>
.anim-water-cycle{
  --anim-bg:       var(--anim-theme-bg,       #0F1E27);
  --anim-panel:    var(--anim-theme-panel,    #0D1820);
  --anim-line:     var(--anim-theme-line,     #2A3D49);
  --anim-fg:       var(--anim-theme-fg,       #E6EDF0);
  --anim-muted:    var(--anim-theme-muted,    #93A7B2);
  --anim-accent:   var(--anim-theme-accent,   #34D1BF);
  --anim-accent-2: var(--anim-theme-accent-2, #FF8A3D);
  --anim-ok:       var(--anim-theme-ok,       #8ED7AD);
  --anim-warn:     var(--anim-theme-warn,     #FFD15C);
  --anim-danger:   var(--anim-theme-danger,   #FF6B6B);
  --anim-font:     var(--anim-theme-font,     system-ui, sans-serif);
  --anim-mono:     var(--anim-theme-mono,     ui-monospace, monospace);
  display:block;width:100%;height:100%
}
.anim-water-cycle svg{display:block;width:100%;height:100%;max-width:none}
.anim-water-cycle .water-cycle-sans{font-family:var(--anim-font);font-size:19px}
.anim-water-cycle .water-cycle-mono{font-family:var(--anim-mono);font-size:18px;font-weight:400}
.anim-water-cycle .water-cycle-label{font-size:26px;font-weight:600}
.anim-water-cycle .water-cycle-n{font-family:var(--anim-mono);font-size:20px;font-weight:500}
.anim-water-cycle .water-cycle-fg{fill:var(--anim-fg)}
.anim-water-cycle .water-cycle-dim{fill:var(--anim-muted)}
.anim-water-cycle .water-cycle-cy{fill:var(--anim-accent)}
/* landscape: thin strokes, two quiet fills (sea, land) */
.anim-water-cycle .water-cycle-sea{fill:color-mix(in srgb,var(--anim-accent) 11%,var(--anim-bg))}
.anim-water-cycle .water-cycle-wave{fill:none;stroke:color-mix(in srgb,var(--anim-accent) 45%,var(--anim-bg));stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.anim-water-cycle .water-cycle-land{fill:color-mix(in srgb,var(--anim-ok) 7%,var(--anim-bg));stroke:color-mix(in srgb,var(--anim-ok) 40%,var(--anim-bg));stroke-width:2.5;stroke-linejoin:round}
.anim-water-cycle .water-cycle-sun{fill:none;stroke:var(--anim-warn);stroke-width:2.5}
.anim-water-cycle .water-cycle-rays path{fill:none;stroke:var(--anim-warn);stroke-width:2.5;stroke-linecap:round}
.anim-water-cycle .water-cycle-cloud{fill:none;stroke:var(--anim-muted);stroke-width:2.5;stroke-linejoin:round}
.anim-water-cycle .water-cycle-raincloud{fill:none;stroke:var(--anim-muted);stroke-width:2.5;stroke-linejoin:round}
.anim-water-cycle .water-cycle-cloud-on{fill:none;stroke:var(--anim-accent);stroke-width:3;stroke-linejoin:round}
.anim-water-cycle .water-cycle-cloud-on .water-cycle-glow{stroke-width:10;opacity:.3;filter:blur(7px)}
.anim-water-cycle .water-cycle-streaks path{fill:none;stroke:color-mix(in srgb,var(--anim-accent) 50%,var(--anim-bg));stroke-width:2;stroke-linecap:round;stroke-dasharray:8 12}
.anim-water-cycle .water-cycle-river{fill:none;stroke:color-mix(in srgb,var(--anim-accent) 35%,var(--anim-bg));stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.anim-water-cycle .water-cycle-river-on{fill:none;stroke:var(--anim-accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.anim-water-cycle .water-cycle-river-on .water-cycle-glow{stroke-width:12;opacity:.3;filter:blur(7px)}
/* the loop guide: thin dashed wires, small open arrowheads */
.anim-water-cycle .water-cycle-guide{fill:none;stroke:var(--anim-muted);stroke-width:2;stroke-linecap:round;stroke-dasharray:2 9;opacity:.8}
.anim-water-cycle .water-cycle-head{fill:none;stroke:var(--anim-muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* step markers: rings, labels outside; the active ring lights in the accent with a glow copy */
.anim-water-cycle .water-cycle-num circle{fill:none;stroke:var(--anim-line);stroke-width:2.5}
.anim-water-cycle .water-cycle-on circle{fill:none;stroke:var(--anim-accent);stroke-width:4}
.anim-water-cycle .water-cycle-on circle.water-cycle-glow{stroke-width:10;opacity:.3;filter:blur(7px)}
/* packets: glowing dots (vapour), droplets, a stream dot */
.anim-water-cycle .water-cycle-vap circle{fill:var(--anim-accent)}
.anim-water-cycle .water-cycle-drop{fill:var(--anim-accent)}
.anim-water-cycle .water-cycle-flow{fill:var(--anim-accent)}
.anim-water-cycle .water-cycle-halo{filter:blur(7px);opacity:.55}
.anim-water-cycle .water-cycle-p-vap{offset-path:path('M432 436 C412 366 472 290 448 214');offset-rotate:0deg;offset-distance:55%;opacity:1}
.anim-water-cycle .water-cycle-p-wind{offset-path:path('M592 146 C730 104 960 104 1102 140');offset-rotate:0deg;offset-distance:50%;opacity:1}
.anim-water-cycle .water-cycle-p-rain{offset-path:path('M1252 214 L1240 336');offset-rotate:0deg;offset-distance:55%;opacity:1}
.anim-water-cycle .water-cycle-p-flow{offset-path:path('M1238 348 C1166 388 1104 420 1040 446 C960 478 840 490 720 488 C690 487 670 484 650 478 C600 500 500 504 440 452');offset-rotate:0deg;offset-distance:28%;opacity:1}
/* resting frame = the whole loop at once: every step labelled, one packet of each kind on it.
   Other highlight overlays rest hidden. */
.anim-water-cycle .water-cycle-on,.anim-water-cycle .water-cycle-cloud-on{opacity:0}
/* the story ends with the water back in the sea: step 4 and the river rest highlighted */
.anim-water-cycle .water-cycle-on4,.anim-water-cycle .water-cycle-river-on{opacity:1}
.anim-water-cycle .water-cycle-rays{opacity:1}

/* 12 s cycle, seamless (no reset: the loop ends where it starts, in the sea).
   0.3-2.6 s evaporation (vapour rises) | 2.9-5.4 s condensation, wind carries the cloud droplet inland
   | 5.6-6.6 s precipitation (droplet falls) | 6.7-10.8 s runoff to the sea | 10.8-12 s hold in the sea */
@keyframes water-cycle-vap{
  0%,2.5%{offset-distance:0%;opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1)}   /* 0.3 s */
  5%{offset-distance:8%;opacity:1;animation-timing-function:ease-in-out}                       /* 0.6 s */
  20%{offset-distance:92%;opacity:1;animation-timing-function:cubic-bezier(0.3,0,1,1)}          /* 2.4 s */
  22.5%,100%{offset-distance:100%;opacity:0}}                                                   /* 2.7 s */
@keyframes water-cycle-wind{
  0%,23.33%{offset-distance:0%;opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1)} /* 2.8 s */
  25.83%{offset-distance:6%;opacity:1;animation-timing-function:ease-in-out}                    /* 3.1 s */
  44.17%{offset-distance:94%;opacity:1;animation-timing-function:cubic-bezier(0.3,0,1,1)}       /* 5.3 s */
  46.67%,100%{offset-distance:100%;opacity:0}}                                                  /* 5.6 s */
@keyframes water-cycle-rain{
  0%,46.67%{offset-distance:0%;opacity:0}                                                       /* 5.6 s */
  47.5%{offset-distance:4%;opacity:1;animation-timing-function:cubic-bezier(0.3,0,1,1)}         /* 5.7 s */
  54.17%{offset-distance:96%;opacity:1}                                                         /* 6.5 s */
  55.83%,100%{offset-distance:100%;opacity:0}}                                                  /* 6.7 s */
@keyframes water-cycle-flow{
  0%,55%{offset-distance:0%;opacity:0;animation-timing-function:cubic-bezier(0.16,1,0.3,1)}    /* 6.6 s */
  57.5%{offset-distance:3%;opacity:1;animation-timing-function:ease-in-out}                     /* 6.9 s */
  86.67%{offset-distance:94%;opacity:1;animation-timing-function:cubic-bezier(0.3,0,1,1)}       /* 10.4 s */
  90%,100%{offset-distance:100%;opacity:0}}                                                     /* 10.8 s */
/* step highlights cross-fade around the loop; step 4 hands back to step 1 at the seam */
@keyframes water-cycle-s1{0%,21.67%{opacity:1}24.17%,96.67%{opacity:0}100%{opacity:1}}        /* on 0-2.6 s, back at 11.6-12 s */
@keyframes water-cycle-s2{0%,21.67%{opacity:0}24.17%,45%{opacity:1}47.5%,100%{opacity:0}}      /* 2.6-5.4 s */
@keyframes water-cycle-s3{0%,45%{opacity:0}47.5%,55%{opacity:1}57.5%,100%{opacity:0}}          /* 5.4-6.6 s */
@keyframes water-cycle-s4{0%,55%{opacity:0}57.5%,96.67%{opacity:1}100%{opacity:0}}             /* 6.6-11.6 s */
/* sun brightens while it drives evaporation */
@keyframes water-cycle-rays{0%,20%{opacity:1}24.17%,96.67%{opacity:.4}100%{opacity:1}}
/* the sea cloud fills as vapour condenses; the rain cloud fills as the droplet arrives */
@keyframes water-cycle-c1{0%,17.5%{opacity:0}22.5%,30%{opacity:1}35%,100%{opacity:0}}           /* 2.1-4.2 s */
@keyframes water-cycle-c2{0%,40%{opacity:0}45%,52.5%{opacity:1}57.5%,100%{opacity:0}}           /* 4.8-6.9 s */
@keyframes water-cycle-riv{0%,55%{opacity:0}59.17%,88.33%{opacity:1}92.5%,100%{opacity:0}}      /* 6.6-11.1 s */

.visible .anim-water-cycle .water-cycle-p-vap{animation:water-cycle-vap 12s linear infinite}
.visible .anim-water-cycle .water-cycle-p-wind{animation:water-cycle-wind 12s linear infinite}
.visible .anim-water-cycle .water-cycle-p-rain{animation:water-cycle-rain 12s linear infinite}
.visible .anim-water-cycle .water-cycle-p-flow{animation:water-cycle-flow 12s linear infinite}
.visible .anim-water-cycle .water-cycle-on1{animation:water-cycle-s1 12s ease-in-out infinite}
.visible .anim-water-cycle .water-cycle-on2{animation:water-cycle-s2 12s ease-in-out infinite}
.visible .anim-water-cycle .water-cycle-on3{animation:water-cycle-s3 12s ease-in-out infinite}
.visible .anim-water-cycle .water-cycle-on4{animation:water-cycle-s4 12s ease-in-out infinite}
.visible .anim-water-cycle .water-cycle-rays{animation:water-cycle-rays 12s ease-in-out infinite}
.visible .anim-water-cycle .water-cycle-c1{animation:water-cycle-c1 12s ease-in-out infinite}
.visible .anim-water-cycle .water-cycle-c2{animation:water-cycle-c2 12s ease-in-out infinite}
.visible .anim-water-cycle .water-cycle-river-on{animation:water-cycle-riv 12s ease-in-out infinite}

@media (prefers-reduced-motion: reduce) { .anim-water-cycle * { animation: none !important; } }
</style>
<div class="anim anim-water-cycle" data-anim="water-cycle" data-anim-cycle="12" data-anim-control="loop">
<svg viewBox="0 0 1680 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The water cycle as a closed loop: the sun evaporates sea water, the vapour condenses into a cloud that wind carries inland, rain falls on the mountains and rivers carry it back to the sea.">

    <text class="water-cycle-n water-cycle-fg" y="7" text-anchor="middle">1</text>
    <text class="water-cycle-sans water-cycle-label water-cycle-fg" x="36" y="9">Evaporation</text>
    <text class="water-cycle-sans water-cycle-label water-cycle-cy water-cycle-on water-cycle-on1" x="36" y="9">Evaporation</text>
    <text class="water-cycle-mono water-cycle-dim" x="36" y="38">the sun warms the sea surface</text>

</svg>
</div>
