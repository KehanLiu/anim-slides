<!-- anim-slides:step-host:start -->
<!--
  anim-slides step host: the presenter steps through data-anim-control="step" fragments.
  Once per deck, anywhere in <head> before the first fragment. Plain CSS + classic script, no
  library. integrate_fragment.py --control step inserts it (between the step-host markers).
  Set the gate after it if the deck does not use .visible (reveal.js: section.present):

    <script>animSlides.gate = 'section.present';</script>

  Never assign window.animSlides yourself. Never nest comment markers in this header.

  A step fragment is the same file as a once fragment (CSS keyframes, one full pass) plus
  data-anim-phases="2,4.5,7" on the wrapper: stop marks in seconds. Its animations are held
  paused (the style rule below, then the Web Animations API). The first time its slide becomes
  current, segment 1 plays (0 to the first mark). Right/Space/PageDown plays the next segment
  (during a segment: jump to its mark), Left/PageUp jumps back one mark without motion. At the
  last mark (or the first, going back) the key passes to the deck. The phase is kept when the
  deck leaves the slide and comes back. Reduced motion (no animations): no key is taken.
  Print / PDF (beforeprint, html.print-pdf, html.reveal-print, animSlides.printing): the end.
-->
<style>[data-anim-control="step"],[data-anim-control="step"] *{animation-play-state:paused!important}</style>
<script>
(function () {
  var A = window.animSlides = window.animSlides || {}, S = new WeakMap(), raf = 0;
  function all() { return [].slice.call(document.querySelectorAll('[data-anim-control="step"]')); }
  function printing() {
    var c = document.documentElement.classList;
    return A.printing || c.contains('print-pdf') || c.contains('reveal-print');
  }
  function st(w) {                       // m = [0, mark 1, ..., mark n], i = phase index
    var s = S.get(w), m;
    if (!s) {
      m = (w.getAttribute('data-anim-phases') || '').split(',').map(parseFloat).filter(function (x) { return x > 0; });
      S.set(w, s = { m: [0].concat(m.length ? m : [+w.getAttribute('data-anim-cycle') || 0]), i: 0, on: false, run: 0 });
    }
    return s;
  }
  function anims(w) { return w.getAnimations ? w.getAnimations({ subtree: true }) : []; }
  function seek(w, t) { anims(w).forEach(function (a) { a.pause(); a.currentTime = t * 1000; }); }
  function stop(w) { var s = st(w); s.run = 0; seek(w, s.m[s.i]); }
  function go(w, k) {                    // play segment k (mark k-1 to mark k), then stop
    var s = st(w), t = s.m[k - 1];
    seek(w, t);
    anims(w).forEach(function (a) { if (t * 1000 < a.effect.getComputedTiming().endTime) a.play(); });
    s.i = k; s.run = performance.now() + (s.m[k] - t) * 1000;
    raf = raf || requestAnimationFrame(tick);
  }
  function tick(now) {
    raf = 0;
    all().forEach(function (w) {
      var s = st(w);
      if (s.run && now >= s.run) stop(w); else if (s.run) raf = raf || requestAnimationFrame(tick);
    });
  }
  function check() {                     // a gate came or went: hold, restore or start
    var g = A.gate || '.visible', p = printing();
    all().forEach(function (w) {
      var s = st(w), on = !!w.closest(g);
      if (p && on) seek(w, s.m[s.m.length - 1]);
      if (p || on === s.on) { s.on = on; return; }
      s.on = on; s.run = 0;
      if (on && s.i) seek(w, s.m[s.i]);  // back on the slide: the phase it was left at
      else if (on) { seek(w, 0); if (anims(w).length) go(w, 1); }
    });
  }
  addEventListener('keydown', function (e) {
    var k = e.key, f = /^(ArrowRight| |PageDown)$/.test(k), el = document.activeElement, used = 0;
    if (!f && !/^(ArrowLeft|PageUp)$/.test(k) || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey ||
        e.defaultPrevented || el && (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable)) return;
    check();
    if (!printing()) all().forEach(function (w) {
      var s = st(w);
      if (!s.on || !anims(w).length) return;
      if (f && s.run) { stop(w); used = 1; }
      else if (f && s.i < s.m.length - 1) { go(w, s.i + 1); used = 1; }
      else if (!f && s.i > 1) { s.run = 0; s.i--; seek(w, s.m[s.i]); used = 1; }
    });
    if (used) { e.preventDefault(); e.stopPropagation(); }
  }, true);
  addEventListener('beforeprint', function () { A.printing = true; check(); });
  addEventListener('afterprint', function () {
    A.printing = false;
    all().forEach(function (w) { var s = st(w); if (s.on) seek(w, s.m[s.i]); });
  });
  new MutationObserver(check).observe(document.documentElement,
    { attributes: true, subtree: true, attributeFilter: ['class', 'hidden'] });
  document.addEventListener('DOMContentLoaded', check);
})();
</script>
<!-- anim-slides:step-host:end -->
